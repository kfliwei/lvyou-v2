<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>行程规划 · 行迹</title>
<script src="theme.js"></script>
<link rel="stylesheet" href="design.css">
<link rel="stylesheet" href="vendor/leaflet/leaflet.css">
<style>
  html,body{min-height:100%;margin:0;font-family:var(--font-sans);background:var(--color-bg);color:var(--color-ink)}
  .wrap{max-width:560px;margin:0 auto;padding:18px 16px 120px}
  .card{background:var(--color-surface);border:1px solid var(--color-line);border-radius:18px;box-shadow:var(--shadow-soft);padding:16px;margin-bottom:14px}
  .ph{font-size:11px;color:var(--color-muted);letter-spacing:.18em;margin-bottom:10px}
  .sec-title{font-family:var(--font-serif);font-size:16px;font-weight:400;margin:4px 0 10px}
  /* AI 三段开关 */
  .ai-switch{display:inline-flex;align-items:center;gap:3px;background:var(--color-bg-soft);border:1px solid var(--color-line);border-radius:999px;padding:3px;margin-bottom:12px}
  .ai-switch .lab{font-size:10.5px;color:var(--color-muted);padding:0 8px 0 10px}
  .ai-switch button{border:0;background:transparent;color:var(--color-muted);font-size:12px;padding:6px 14px;border-radius:999px;cursor:pointer;white-space:nowrap}
  .ai-switch button.on{background:var(--color-primary);color:#fff;font-weight:600}
  .ai-switch.locked button{cursor:not-allowed;opacity:.5}
  .ai-switch.locked button.on{opacity:1}
  /* 输入条 */
  .input-bar{display:flex;gap:8px;align-items:center}
  .input-bar input{flex:1;min-width:0;height:46px;border:1px solid var(--color-line-strong);border-radius:12px;background:var(--color-surface);color:var(--color-ink);padding:0 14px;font-size:14.5px}
  .input-bar input::placeholder{color:var(--color-faint)}
  .btn{min-height:42px;padding:0 18px;border-radius:12px;font-size:13.5px;border:1px solid var(--color-line-strong);background:var(--color-surface);color:var(--color-ink-soft);cursor:pointer;white-space:nowrap}
  .btn:active{transform:scale(.96)}
  .btn.primary{background:var(--color-primary);border-color:var(--color-primary);color:#fff;font-weight:600}
  .btn.ghost{background:transparent}
  .btn:disabled{opacity:.5;cursor:not-allowed}
  /* 种子 */
  .seeds{display:flex;flex-direction:column;gap:8px}
  .seed{display:flex;align-items:center;gap:10px;background:var(--color-surface);border:1px solid var(--color-line);border-radius:14px;padding:12px 14px;cursor:pointer;font-size:13.5px}
  .seed:active{transform:scale(.98)}
  .seed .ic{width:32px;height:32px;border-radius:10px;background:var(--color-primary-soft);color:var(--color-primary-dark);display:grid;place-items:center;flex:0 0 auto;font-size:15px}
  .seed .t{flex:1}
  .seed .t small{display:block;font-size:11px;color:var(--color-muted);margin-top:2px}
  .seed .arr{color:var(--color-faint)}
  .chips{display:flex;flex-wrap:wrap;gap:6px}
  .chip{display:inline-flex;align-items:center;padding:6px 12px;border-radius:999px;font-size:12px;border:1px solid var(--color-line);background:var(--color-surface);color:var(--color-ink-soft);cursor:pointer;white-space:nowrap}
  .chip.on{background:var(--color-primary);border-color:var(--color-primary);color:#fff;font-weight:600}
  /* 意图卡字段 */
  .fld{margin-bottom:12px}
  .fld label{display:block;font-size:11.5px;color:var(--color-muted);margin-bottom:6px;letter-spacing:.04em}
  .fld .row{display:flex;gap:8px;align-items:center}
  .fld input[type=text],.fld input[type=number],.fld input[type=date]{height:42px;border:1px solid var(--color-line-strong);border-radius:11px;background:var(--color-surface);color:var(--color-ink);padding:0 12px;font-size:13.5px}
  .fld input[type=number]{width:70px}
  .fld input[type=date]{flex:1}
  .fld input[type=text]{flex:1;min-width:0}
  /* 候选卡片 */
  .cand{display:flex;align-items:center;gap:10px;padding:11px 4px;border-bottom:1px solid var(--color-line)}
  .cand:last-child{border-bottom:0}
  .cand .ck{width:22px;height:22px;border-radius:7px;border:1.5px solid var(--color-line-strong);flex:0 0 auto;display:grid;place-items:center;cursor:pointer;color:#fff;font-size:13px;background:var(--color-surface)}
  .cand.on .ck{background:var(--color-primary);border-color:var(--color-primary)}
  .cand .dot{width:9px;height:9px;border-radius:50%;flex:0 0 auto}
  .cand .main{flex:1;min-width:0}
  .cand .main b{font-family:var(--font-serif);font-size:15px;font-weight:400;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .cand .main small{font-size:11px;color:var(--color-muted);display:block;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .bdg{display:inline-block;font-size:9.5px;padding:0 6px;border-radius:999px;margin-left:5px;vertical-align:1px}
  .bdg-m{background:var(--color-primary);color:#fff}
  .bdg-h{background:var(--color-blue);color:#fff}
  .bdg-n{background:var(--color-gold,#BA7517);color:#fff}
  /* 汇总条 */
  .summbar{position:sticky;bottom:14px;z-index:90;display:flex;flex-direction:column;align-items:stretch;gap:10px;background:var(--color-ink);color:#fff;border-radius:18px;padding:12px 16px;box-shadow:var(--shadow-float);margin-top:4px}
  .summbar .info{font-size:13px;line-height:1.5}
  .summbar .info b{font-size:15px}
  .summbar .acts{display:flex;gap:10px}
  .summbar .acts .btn{flex:1}
  /* 排期结果 */
  .day-card{border-top:1px solid var(--color-line);padding:12px 0}
  .day-card .dhead{display:flex;align-items:center;gap:8px;margin-bottom:6px}
  .day-card .dhead b{font-family:var(--font-serif);font-weight:400;font-size:16px}
  .day-card .dhead span{font-size:11px;color:var(--color-muted);flex:1}
  .stop{display:flex;gap:8px;align-items:center;padding:5px 0;font-size:13px}
  .stop .n{flex:0 0 20px;text-align:center;color:var(--color-faint);font-size:12px}
  .stop .lbl{flex:1;min-width:0;word-break:break-all;line-height:1.4}
  .stop .meta{font-size:10.5px;color:var(--color-muted);flex:0 0 auto}
  .stop.warn .lbl{color:#B4543A}
  .stop.done .lbl{color:var(--color-muted)}
  .stop .warn-ic{color:#B4543A;flex:0 0 auto}
  .mv{width:28px;height:28px;border:1px solid var(--color-line);border-radius:8px;background:var(--color-bg-soft);color:var(--color-muted);font-size:12px;cursor:pointer;flex:0 0 auto;padding:0;line-height:1}
  .mv:active{transform:scale(.9)}
  .warnline{margin:8px 0;padding:9px 12px;border-radius:10px;font-size:12px;line-height:1.6;background:rgba(180,84,58,.1);color:#B4543A}
  .narr{margin-top:10px;padding:14px;border-radius:14px;background:var(--color-bg-soft);border:1px solid var(--color-line)}
  .narr .story{font-family:var(--font-serif);font-size:15px;line-height:1.9}
  .narr .themes{font-size:12px;color:var(--color-muted);margin-top:8px;line-height:1.8}
  .act-row{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}
  .act-row .btn{flex:1;justify-content:center;min-width:96px;display:flex;align-items:center;justify-content:center}
  #mapBox{height:46vh;min-height:220px;border-radius:18px;overflow:hidden;border:1px solid var(--color-line);margin-bottom:14px}
  .empty-tip{text-align:center;padding:24px 10px;color:var(--color-faint);font-size:12.5px;line-height:1.8}
  .theme-dark .summbar{background:var(--color-primary);color:#fff;box-shadow:0 8px 30px rgba(0,0,0,.5)}
  .theme-dark .narr{background:var(--color-bg-deep)}
  .theme-dark .warnline{background:rgba(224,140,120,.16);color:#E8A18D}
  .theme-dark .stop.warn .lbl{color:#E8A18D}
  .theme-dark .stop .warn-ic{color:#E8A18D}

/* ============================================================
   排期结果卡 v2 化（2026-08-15：宣纸卡片 + 16px 圆角 + 柔和阴影）
   ============================================================ */
.day-card{background:var(--color-surface);border:1px solid var(--color-line);border-radius:16px;box-shadow:0 6px 18px rgba(40,38,32,.06);padding:14px 15px;margin-bottom:14px}
.day-card .dhead{border-bottom:1px solid var(--color-line);padding-bottom:9px;margin-bottom:9px}
.day-card .dhead b{font-family:var(--font-serif);font-size:16px;font-weight:600;letter-spacing:.03em}
.day-card .dhead span{font-size:11.5px;color:var(--color-muted)}
.day-card .stop{display:flex;flex-direction:column;align-items:stretch;gap:6px;border-radius:10px;padding:8px 10px;transition:background .15s}
.day-card .stop:active{background:var(--color-bg-soft)}
.day-card .stop .n{flex:0 0 20px;height:20px;border-radius:7px;background:var(--color-primary-soft);color:var(--color-primary-dark);font-size:11px;font-weight:600;display:inline-grid;place-items:center}
.day-card .stop.done{opacity:.55}
.day-card .stop .meta{font-size:11px;color:var(--color-muted)}
.day-card .warnline{background:rgba(200,109,75,.08);border:1px solid rgba(200,109,75,.18);color:var(--color-primary-dark)}
.stop-name{display:flex;align-items:center;gap:8px;min-width:0}
.stop-name .lbl{flex:1;min-width:0;word-break:break-word;line-height:1.45}
.stop-meta{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding-left:28px}
.stop-acts{display:flex;align-items:center;gap:8px;padding-left:28px}
.stop-acts .ops{margin-left:auto;display:flex;align-items:center;gap:4px}
.stop-acts .btn.mini{min-height:26px;padding:0 10px;font-size:11px}
.day-card .mv{width:26px;height:26px}
.theme-dark .day-card{background:var(--color-surface);border-color:var(--color-line)}
.theme-dark .day-card .dhead{border-bottom-color:var(--color-line)}
.theme-dark .day-card .stop .n{background:var(--color-primary-soft);color:var(--color-primary-dark)}

/* ============================================================
   v3 CINEMATIC LAYER · 行程规划页收口
   ============================================================ */
/* 分区标题：清掉全局 .ph 卡其占位底，改为鎏金 eyebrow */
.ph{
  display:flex;align-items:center;gap:8px;
  background:none;
  font-family:var(--font-sans);font-size:11px;font-weight:700;
  letter-spacing:.22em;color:var(--color-faint);
  margin:4px 0 12px;
}
.ph::before{
  content:"";width:14px;height:3px;border-radius:99px;flex:0 0 auto;
  background:var(--grad-gold);
}
.card > .ph:first-child{margin-top:0}
.wrap > .ph{margin:22px 2px 12px}
.sec-title{
  font-family:var(--font-serif);font-size:19px;font-weight:600;
  letter-spacing:.04em;color:var(--color-ink);margin:2px 0 12px;
  display:flex;align-items:center;gap:9px;
}
.sec-title::before{
  content:"";width:4px;height:17px;border-radius:99px;flex:0 0 auto;
  background:var(--grad-primary);
}
/* 卡片与输入 */
.card{border-radius:20px;padding:18px;transition:box-shadow .25s var(--ease-out),transform .25s var(--ease-out),border-color .25s}
.card:hover{box-shadow:var(--shadow-medium)}
.input-bar input{
  height:48px;border-radius:14px;border-color:rgba(33,26,19,.1);
  background:var(--color-bg);
  transition:border-color .2s,box-shadow .2s;
}
.input-bar input:focus{outline:none;border-color:rgba(200,109,75,.5);box-shadow:0 0 0 3px rgba(200,109,75,.12)}
.btn{border-radius:13px;transition:transform .14s var(--ease-pop),box-shadow .2s,filter .2s}
.btn.primary{
  background:var(--grad-primary);border-color:transparent;color:#fff;
  box-shadow:var(--glow-ember);font-weight:600;
}
.btn.primary:active{filter:brightness(.96)}
.ai-switch{padding:3px 4px;border-radius:999px;background:var(--color-bg);border-color:rgba(33,26,19,.08)}
.ai-switch button.on{background:var(--grad-primary);box-shadow:0 3px 10px rgba(200,109,75,.28)}
/* 种子卡 */
.seed{border-radius:16px;padding:13px 15px;transition:transform .2s var(--ease-out),box-shadow .2s,border-color .2s}
.seed:hover{transform:translateY(-1px);border-color:rgba(200,109,75,.3);box-shadow:var(--shadow-soft)}
.seed .ic{
  width:38px;height:38px;border-radius:12px;
  background:linear-gradient(135deg,rgba(219,125,83,.16),rgba(169,76,45,.08));
  color:var(--color-primary-deep,#A94C2D);
}
.seed .arr{
  width:26px;height:26px;border-radius:50%;display:grid;place-items:center;
  background:var(--color-bg-soft);color:var(--color-faint);font-size:15px;
}
/* chips */
.chip{border-radius:999px;padding:7px 14px;transition:all .18s var(--ease-out)}
.chip.on{background:var(--grad-primary);border-color:transparent;box-shadow:var(--glow-ember)}
.chip:active{transform:scale(.95)}
/* 字段 */
.fld input[type=text],.fld input[type=number],.fld input[type=date]{border-radius:12px;border-color:rgba(33,26,19,.1);background:var(--color-bg)}
.fld input:focus{outline:none;border-color:rgba(200,109,75,.5);box-shadow:0 0 0 3px rgba(200,109,75,.12)}
#candFilter{border-radius:12px!important}
#candFilter:focus{outline:none;border-color:rgba(200,109,75,.5)!important;box-shadow:0 0 0 3px rgba(200,109,75,.12)!important}
.cand.on .ck{background:var(--grad-primary);border-color:transparent;box-shadow:0 2px 8px rgba(200,109,75,.3)}
.bdg-m{background:var(--grad-primary)}
.bdg-n{background:var(--grad-gold);color:#2a1f08}
/* 汇总条：夜墨玻璃 + 鎏金发丝 */
.summbar{
  background:var(--grad-night);
  border:1px solid rgba(220,174,94,.28);
  border-radius:22px;
  box-shadow:var(--shadow-pop);
}
.summbar .btn{
  background:rgba(255,255,255,.08);border-color:rgba(255,255,255,.16);color:var(--color-paper-warm,#F4EDDF);
}
.summbar .btn.primary{
  background:var(--grad-primary);border-color:transparent;color:#fff;
}
/* 排期结果 */
.day-card{border-radius:18px;padding:16px 17px;transition:box-shadow .25s}
.day-card:hover{box-shadow:var(--shadow-medium)}
.day-card .stop .n{
  background:var(--color-primary-soft);color:var(--color-primary-deep,#A94C2D);
  font-family:var(--font-sans);
}
.narr{
  border-radius:18px;border:1px solid rgba(201,162,39,.28);
  background:linear-gradient(135deg,rgba(220,174,94,.1),rgba(220,174,94,.03));
}
.narr .story{color:var(--color-ink)}
#mapBox{border-radius:20px;border-color:rgba(33,26,19,.08);box-shadow:var(--shadow-soft)}
.theme-dark .summbar{background:var(--grad-night);border-color:rgba(220,174,94,.28)}
.theme-dark .narr{background:linear-gradient(135deg,rgba(220,174,94,.14),rgba(220,174,94,.04));border-color:rgba(201,162,39,.32)}
</style>
</head>
<body>
<header class="topbar">
  <div class="t-row">
    <button class="back" onclick="window.plannerBack?plannerBack():(history.length>1?history.back():location.href='index.html')" aria-label="返回">←</button>
    <div class="title">行程规划 <small>把想去的地方串成一场旅行</small></div>
    <a href="wishlist.html" aria-label="想去清单" style="flex:0 0 auto;width:40px;height:40px;display:flex;align-items:center;justify-content:center;border:1px solid var(--color-line);border-radius:50%;background:var(--color-bg-soft);color:var(--color-ink);text-decoration:none;font-size:16px">☆</a>
  </div>
</header>
<div class="wrap">

  <!-- ===== 阶段一：输入 ===== -->
  <div id="stageInput">
    <div class="ai-switch" id="aiSwitch">
      <span class="lab">AI 参与</span>
      <button data-level="off">关</button>
      <button data-level="narrate">叙事</button>
      <button data-level="full">全量</button>
    </div>

    <div class="card">
      <div class="ph">从哪里开始</div>
      <div class="input-bar">
        <input id="promptInput" type="text" placeholder="我想去 川西 玩 5 天" enterkeyhint="search" autocomplete="off">
        <button class="btn primary" id="genBtn">开始规划</button>
      </div>
    </div>

    <div class="ph">或从一个念头开始</div>
    <div class="seeds">
      <div class="seed" id="seedWish">
        <span class="ic"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"><path d="M12 3 L14.8 8.9 L21 9.6 L16.5 13.8 L17.6 20 L12 16.9 L6.4 20 L7.5 13.8 L3 9.6 L9.2 8.9 Z"/></svg></span>
        <span class="t">从想去清单生成<small id="seedWishSub">把收藏过的地方串起来</small></span>
        <span class="arr">›</span>
      </div>
      <div class="seed" id="seedExample">
        <span class="ic"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3 V8 M12 16 V21 M3 12 H8 M16 12 H21 M5.6 5.6 L9 9 M15 15 L18.4 18.4 M18.4 5.6 L15 9 M9 15 L5.6 18.4"/></svg></span>
        <span class="t">给我一个示例<small>不知道怎么描述？点我试试</small></span>
        <span class="arr">›</span>
      </div>
    </div>
    <div class="card" id="destCard">
      <div class="ph">热门目的地</div>
      <div class="chips" id="destChips"></div>
    </div>
    <div class="card" id="tripsHome" style="display:none">
      <div class="ph">已保存的行程</div>
      <div id="tripsHomeList"></div>
    </div>
  </div>

  <!-- ===== 阶段二：意图卡 + 候选 ===== -->
  <div id="stagePick" style="display:none">
    <div class="card" id="intentCard"></div>
    <div class="card" id="candCard" style="display:none">
      <div class="sec-title" id="candTitle">候选景点</div>
      <input id="candFilter" type="text" placeholder="在候选里筛选（名称/主题/城市）" style="width:100%;height:40px;border:1px solid var(--color-line-strong);border-radius:10px;background:var(--color-surface);color:var(--color-ink);padding:0 12px;font-size:13px;margin-bottom:8px">
      <div id="candHint" style="display:none;margin:-2px 0 8px;padding:8px 12px;border-radius:10px;font-size:12px;line-height:1.6;background:var(--color-primary-soft);color:var(--color-primary-dark)"></div>
      <div id="candList"></div>
    </div>
    <div id="wizardBox" style="display:none"></div>
    <div class="summbar" id="summbar" style="display:none">
      <div class="info" id="summInfo"></div>
      <div class="acts">
        <button class="btn" id="browseBtn" onclick="window.plannerOpenBrowse()"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" style="vertical-align:-2px;margin-right:4px"><path d="M2 12 C5 7 9.5 4.5 12 4.5 C14.5 4.5 19 7 22 12 C19 17 14.5 19.5 12 19.5 C9.5 19.5 5 17 2 12 Z"/><circle cx="12" cy="12" r="3"/></svg> 浏览</button>
        <button class="btn primary" id="scheduleBtn"><svg width="12" height="12" viewBox="0 0 24 24" fill="currentColor" style="vertical-align:-1px;margin-right:4px"><path d="M6 4 L20 12 L6 20 Z"/></svg> 开始排期</button>
      </div>
    </div>
  </div>

  <!-- ===== 阶段三：排期结果 ===== -->
  <div id="stageResult" style="display:none">
    <div id="mapBox"></div>
    <div class="card">
      <div class="sec-title" id="resultTitle"></div>
      <div id="resultBody"></div>
      <div class="narr" id="narrBox" style="display:none"></div>
      <div class="act-row" id="actRow"></div>
    </div>
    <div class="card" id="tripsCard" style="display:none">
      <div class="ph">已保存的行程</div>
      <div id="tripsList"></div>
    </div>
  </div>

</div>

<script src="vendor/leaflet/leaflet.js"></script>
<script src="geo.js"></script>
<script src="travel-notes.js"></script>
<script src="wishlist.js"></script>
<script src="ui.js"></script>
<!-- nation-index(1.4MB) 与 planner.js defer 化：不阻塞解析，defer 保序仍先于 planner 执行 -->
<script src="nation-index.js" defer></script>
  <script src="planner.js" defer></script>
  <script>
    /* 起终点：存储到 window（planner.js 意图卡渲染时读取） */
    window.__planEnd = null;
    window.__planStart = null;
  </script>
<div id="bnav"></div><script src="nav.js" data-active="planner"></script>
</body>
</html>
