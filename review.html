<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>旅程回顾 · 行迹</title>
<script src="theme.js"></script>
<link rel="stylesheet" href="design.css">
<link rel="stylesheet" href="vendor/leaflet/leaflet.css">
<style>
  html,body{height:100%;margin:0;font-family:var(--font-sans);background:var(--color-bg);color:var(--color-ink)}
  .page{max-width:560px;margin:0 auto;min-height:100dvh;padding-bottom:60px}
  .content{padding:16px 16px 40px}
  .stats{display:flex;gap:0;margin:2px 0 14px;background:var(--color-surface);border:1px solid var(--color-line);border-radius:18px;box-shadow:var(--shadow-soft);overflow:hidden}
  .stats div{flex:1;text-align:center;padding:12px 2px}
  .stats b{display:block;font-family:var(--font-serif);font-size:20px;font-weight:400;color:var(--color-ink)}
  .stats span{font-size:10.5px;color:var(--color-muted);letter-spacing:.06em}
  .eyebrow{font-size:11px;color:var(--color-muted);letter-spacing:.28em;text-transform:uppercase;margin:0 2px 8px}
  .cal-card{background:var(--color-surface);border:1px solid var(--color-line);border-radius:18px;box-shadow:var(--shadow-soft);padding:14px;margin-bottom:14px}
  .cal-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
  .cal-head b{font-family:var(--font-serif);font-size:17px;font-weight:400;color:var(--color-ink)}
  .cal-head .nav{display:flex;gap:6px}
  .cal-head .nav button{width:40px;height:40px;border:1px solid var(--color-line);border-radius:50%;background:var(--color-bg-soft);color:var(--color-muted);font-size:15px;cursor:pointer}
  .cal-head .nav button:active{transform:scale(.92)}
  .cal-week,.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
  .cal-week{font-size:11px;color:var(--color-muted);text-align:center;margin-bottom:4px}
  .cal-week span{padding:4px 0}
  .cal-cell{position:relative;aspect-ratio:1;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:13px;color:var(--color-ink-soft);cursor:pointer;border:1px solid transparent}
  @media (hover:hover){.cal-cell:hover{background:var(--color-bg-soft)}}
  .cal-cell:active{opacity:.55}
  .cal-cell.has{background:var(--color-primary-soft);color:var(--color-primary-dark);font-weight:600}
  .cal-cell.has .dot{position:absolute;bottom:5px;left:50%;transform:translateX(-50%);width:4px;height:4px;border-radius:50%;background:var(--color-primary)}
  .cal-cell .cnt{position:absolute;top:3px;right:5px;font-size:9px;color:var(--color-primary-dark)}
  .cal-cell .mood{position:absolute;top:2px;left:6px;font-size:11px;line-height:1}
  .moodrow{display:flex;gap:6px;align-items:center;margin-bottom:12px;flex-wrap:wrap}
  .moodrow .mk{width:34px;height:34px;border:1px solid var(--color-line);border-radius:999px;display:grid;place-items:center;font-size:16px;cursor:pointer;background:var(--color-surface)}
  .moodrow .mk.on{border-color:var(--color-primary);background:var(--color-primary-soft)}
  .moodrow .mk:active{transform:scale(.92)}
  .moodrow .mk.clear{font-size:12px;color:var(--color-muted)}
  .cal-cell.off{color:transparent;cursor:default}
  @media (hover:hover){.cal-cell.off:hover{background:none}}
  .cal-cell.today{border-color:var(--color-primary)}
  .md-item{display:block;width:100%;text-align:left;background:var(--color-surface);border:1px solid var(--color-line);border-radius:16px;box-shadow:var(--shadow-soft);padding:14px 16px;margin-bottom:12px;box-sizing:border-box}
  .md-item h3{margin:0;font-family:var(--font-serif);font-size:17px;font-weight:400;color:var(--color-ink)}
  .md-item .meta{font-size:11.5px;color:var(--color-muted);margin-top:4px}
  .md-item .txt{font-size:0.8438rem;color:var(--color-ink-soft);line-height:1.8;margin-top:8px;white-space:pre-wrap;max-height:90px;overflow:hidden}
  .md-item .tags{display:flex;gap:6px;flex-wrap:wrap;margin-top:9px}
  .md-item .tags span{font-size:11px;color:var(--color-primary-dark);background:var(--color-primary-soft);padding:2px 9px;border-radius:999px}
  .md-item .thumbs{display:flex;gap:6px;margin-top:10px;overflow:hidden}
  .md-item .thumbs img{width:50px;height:50px;object-fit:cover;border-radius:10px;flex:0 0 auto}
  .sec{border-top:1px solid var(--color-line);padding:16px 2px}
  .monthbar{display:flex;align-items:flex-end;gap:5px;height:120px;padding:0 2px;overflow-x:auto}
  .monthbar .mb{flex:0 0 34px;display:flex;flex-direction:column;align-items:center;gap:4px}
  .monthbar .mb i{display:block;width:100%;border-radius:4px 4px 0 0;background:var(--color-primary);opacity:.85;min-height:2px}
  .monthbar .mb span{font-size:10px;color:var(--color-muted)}
  .tagcloud{display:flex;flex-wrap:wrap;gap:7px}
  .tagcloud span{font-size:11.5px;color:var(--color-primary-dark);background:var(--color-primary-soft);padding:4px 12px;border-radius:999px}
  .places{display:flex;flex-wrap:wrap;gap:8px}
  .places span{font-size:11.5px;color:var(--color-ink-soft);background:var(--color-bg-soft);border:1px solid var(--color-line);padding:5px 12px;border-radius:999px}
  .provbar{display:flex;flex-wrap:wrap}
  .prov{display:inline-flex;align-items:center;gap:4px;margin:4px 6px 4px 0;padding:6px 12px;border-radius:999px;background:var(--color-primary);color:#fff;font-size:11.5px}
  .prov b{font-weight:700;margin-left:2px}
  .empty{text-align:center;padding:48px 20px}
  .empty .em{font-family:var(--font-serif);font-size:44px;color:var(--color-faint)}
  .empty b{display:block;margin-top:12px;font-family:var(--font-serif);font-weight:400;font-size:18px;color:var(--color-ink)}
  .empty span{display:block;margin-top:6px;font-size:12.5px;color:var(--color-muted)}
  .report-dlg{position:fixed;left:10px;right:10px;bottom:10px;z-index:9000;max-height:80dvh;overflow-y:auto;background:var(--color-surface);border:1px solid var(--color-line);border-radius:20px;box-shadow:var(--shadow-float);padding:18px 20px 22px}
  .report-dlg h4{font-family:var(--font-serif);font-weight:400;color:var(--color-ink);margin:0 0 10px;font-size:18px}
  .report-dlg .txt{font-family:var(--font-serif);font-size:0.9063rem;line-height:1.9;color:var(--color-ink-soft);white-space:pre-wrap}
  .report-dlg .acts{display:flex;gap:10px;margin-top:16px}
  .report-dlg .acts button{flex:1;min-height:44px;border:0;border-radius:999px;background:var(--color-primary);color:#fff;font-size:13.5px;font-weight:600;cursor:pointer}
  .report-dlg .acts button.x{background:var(--color-bg-soft);color:var(--color-muted)}

/* ============================================================
   TRACE 深色模式补丁（覆盖内联浅色浮层/控件 — 跨页面保持深色）
   ============================================================ */

/* 日历翻月 / 心情选择 采用原始 34px（紧凑且可点，无需额外覆盖） */

/* 成果工坊：整行卡片式入口，信息完整、触控友好、不拥挤 */
.workshop-sec{border-top:1px solid var(--color-line);padding:16px 2px}
.workshop-sec .sec-title{margin-bottom:12px}
.ws-list{display:flex;flex-direction:column;gap:10px}
.ws-item{display:flex;align-items:center;gap:14px;width:100%;min-height:60px;padding:13px 16px;background:var(--color-surface);border:1px solid var(--color-line);border-radius:16px;box-shadow:var(--shadow-soft);cursor:pointer;text-align:left;box-sizing:border-box}
.ws-item:active{transform:scale(.98);background:var(--color-bg-soft)}
.ws-item .ws-ic{flex:0 0 38px;height:38px;border-radius:11px;background:var(--color-primary-soft);color:var(--color-primary-dark);display:grid;place-items:center;font-size:18px}
.ws-item .ws-main{flex:1;min-width:0}
.ws-item .ws-main b{display:block;font-family:var(--font-serif);font-size:16px;font-weight:600;color:var(--color-ink);letter-spacing:.02em}
.ws-item .ws-main small{display:block;font-size:11.5px;color:var(--color-muted);margin-top:2px;line-height:1.5}
.ws-item .ws-arr{color:var(--color-faint);flex:0 0 auto;font-size:15px}
.theme-dark .ws-item{background:var(--color-surface);border-color:var(--color-line)}

/* ---- 旅行画像 ---- */
#profileSec .sec-title{margin-bottom:12px}
.prof-th{display:flex;align-items:center;gap:10px;padding:9px 4px;border-bottom:1px dashed var(--color-line)}
.prof-th:last-of-type{border-bottom:0}
.prof-th .th-dot{flex:0 0 12px;width:12px;height:12px;border-radius:50%}
.prof-th .th-name{flex:0 0 auto;font-size:13px;color:var(--color-ink-soft);font-weight:600;min-width:86px}
.prof-th .th-bar{flex:1;height:7px;border-radius:99px;background:var(--color-bg-soft);overflow:hidden}
.prof-th .th-bar i{display:block;height:100%;border-radius:99px;background:var(--color-primary);opacity:.85}
.prof-th .th-cnt{flex:0 0 auto;font-size:11.5px;color:var(--color-muted)}
.prof-rec{display:flex;gap:10px;padding:10px 4px;border-bottom:1px dashed var(--color-line);align-items:flex-start}
.prof-rec:last-of-type{border-bottom:0}
.prof-rec .pr-ic{flex:0 0 30px;height:30px;border-radius:9px;background:var(--color-primary-soft);color:var(--color-primary-dark);display:grid;place-items:center;font-size:15px}
.prof-rec .pr-main{flex:1;min-width:0}
.prof-rec .pr-main b{display:block;font-size:13.5px;color:var(--color-ink);font-weight:600}
.prof-rec .pr-main small{display:block;font-size:11px;color:var(--color-muted);margin-top:2px;line-height:1.5}
.prof-rec .pr-go{flex:0 0 auto;align-self:center;font-size:11.5px;color:var(--color-primary);font-weight:600;cursor:pointer;padding:6px 4px}
.prof-rec .pr-go:active{opacity:.6}
.prof-hint{font-size:11.5px;color:var(--color-muted);line-height:1.7;padding:4px 4px 0}
.theme-dark .prof-th{border-color:var(--color-line)}
.theme-dark .prof-rec{border-color:var(--color-line)}
.theme-dark .prof-th .th-bar{background:var(--color-bg-soft)}
.theme-dark .prof-rec .pr-main b{color:var(--color-ink)}

/* ============================================================
   v3 CINEMATIC LAYER · 旅程回顾页收口
   ============================================================ */
.sec-title{
  display:flex;align-items:center;gap:9px;
  font-family:var(--font-serif);font-size:18px;font-weight:600;color:var(--color-ink);
  letter-spacing:.04em;margin-bottom:12px;
}
.sec-title::before{content:"";width:4px;height:17px;border-radius:99px;background:var(--grad-primary);flex:0 0 auto}
.sec{border-top:0;padding:20px 2px 4px}
.workshop-sec{border-top:0;padding:20px 2px 4px}
/* 统计卡：鎏金数字 */
.stats{border-radius:20px;padding:2px 0}
.stats div{position:relative;padding:14px 2px}
.stats div + div::before{content:"";position:absolute;left:0;top:22%;bottom:22%;width:1px;background:var(--color-line)}
.stats b{
  font-family:var(--font-serif);font-size:23px;font-weight:600;
  background:var(--grad-gold);-webkit-background-clip:text;background-clip:text;
  -webkit-text-fill-color:transparent;color:var(--color-gold-bright);
}
.stats span{font-size:10px;letter-spacing:.14em}
/* 工坊行卡 */
.ws-item{border-radius:18px;padding:14px 16px;transition:transform .22s var(--ease-out),box-shadow .22s,border-color .22s}
.ws-item:hover{transform:translateY(-2px);border-color:rgba(200,109,75,.28);box-shadow:var(--shadow-medium)}
.ws-item .ws-ic{
  width:40px;height:40px;border-radius:12px;
  background:linear-gradient(135deg,rgba(219,125,83,.16),rgba(169,76,45,.08));
  color:var(--color-primary-dark);
}
.ws-item .ws-arr{
  width:26px;height:26px;border-radius:50%;display:grid;place-items:center;
  background:var(--color-bg-soft);font-size:15px;
}
.ws-item:hover .ws-arr{background:var(--color-primary-soft);color:var(--color-primary-dark)}
/* 日历 */
.cal-card{border-radius:20px;padding:16px}
.cal-head b{font-weight:600;font-size:17px;letter-spacing:.03em}
.cal-head .nav button{background:var(--color-bg);border-color:rgba(33,26,19,.08);transition:transform .14s,background .2s}
.cal-head .nav button:hover{background:var(--color-primary-soft);color:var(--color-primary-dark)}
.cal-cell.has{
  background:linear-gradient(135deg,rgba(219,125,83,.2),rgba(169,76,45,.1));
  color:var(--color-primary-dark);
}
.cal-cell.has .dot{background:var(--color-ember-deep)}
.cal-cell.today{border-color:var(--color-gold-bright);box-shadow:inset 0 0 0 1px rgba(220,174,94,.5)}
.cal-head .nav #yrPrev,.cal-head .nav #yrNext{height:34px;border-radius:999px;letter-spacing:.04em}
.md-item{border-radius:18px;transition:box-shadow .22s,border-color .22s}
.md-item:hover{box-shadow:var(--shadow-medium);border-color:rgba(200,109,75,.22)}
.md-item h3{font-weight:600}
/* 成就 / 分布 */
.prov{background:var(--grad-gold);color:#2a1f08;box-shadow:0 2px 8px rgba(186,117,23,.18)}
.monthbar .mb i{background:var(--grad-gold)}
.prof-th .th-bar i{background:var(--grad-gold)}
/* 日历：圆点已表示有记录，隐藏角标计数，避免与日期数字重叠 */
.cal-cell.has .cnt{display:none}
/* 旅行画像：线性 SVG 图标 */
.prof-th .th-name{display:inline-flex;align-items:center;gap:6px}
.prof-th .th-ico{display:inline-flex;color:var(--color-ember-deep)}
.prof-rec .pr-ic svg{width:16px;height:16px}
.tagcloud span{background:rgba(220,174,94,.14);color:var(--color-gold);font-weight:600}
.md-item .tags span{background:rgba(220,174,94,.14);color:var(--color-gold);font-weight:600}
.report-dlg{border-radius:26px}
.report-dlg .acts button{background:var(--grad-primary);box-shadow:var(--glow-ember);font-family:var(--font-sans)}
.report-dlg .acts button.x{background:var(--color-bg-soft);color:var(--color-muted);box-shadow:none}
.theme-dark .stats b{background:var(--grad-gold);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
/* 海报按钮组：三副按钮一行 + 主 CTA 整行（窄屏不溢出） */
.poster-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:8px}
.poster-grid button{min-width:0;min-height:0;height:44px;padding:0 6px;border-radius:999px;font-size:12.5px;white-space:nowrap;display:inline-flex;align-items:center;justify-content:center;gap:5px;cursor:pointer}
.poster-grid .btn-primary{grid-column:1/-1;height:48px;font-size:14px;gap:7px}
.poster-grid #posterCarto{border:1px solid var(--color-line-strong);background:var(--color-surface);color:var(--color-ink-soft)}
.poster-hint{font-size:11.5px;color:var(--color-muted);line-height:1.6;margin:0 2px 14px}
</style>
<style>
  body{padding-bottom:112px}
</style>
</head>
<body>
<div class="page">
  <header class="topbar">
    <div class="t-row">
      <button class="back" aria-label="返回" onclick="history.length>1?history.back():location.href='me.html'">←</button>
      <div class="title">旅程回顾</div>
    </div>
  </header>
  <div class="content">
    <div class="stats" id="stats"></div>
    <div class="stats" id="stats2"></div>
    <div class="poster-grid">
      <button class="btn-secondary" id="aiReport"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"><path d="M4 5.5C7 4.5 10 4.8 12 6v13c-2-1.2-5-1.5-8-.5z"/><path d="M20 5.5C17 4.5 14 4.8 12 6v13c2-1.2 5-1.5 8-.5z"/></svg>年度报告</button>
      <button class="btn-secondary" id="posterBtnH">横版海报</button>
      <button class="is-btn" id="posterCarto">制图海报</button>
      <button class="btn-primary" id="posterBtn"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"><path d="M9 4 3 6v14l6-2 6 2 6-2V4l-6 2-6-2Z"/><path d="M9 4v14M15 6v14"/></svg>足迹海报</button>
    </div>
    <div class="poster-hint">生成需要至少 1 篇带位置的游记 · 生成后先预览，确认保存</div>
    <div class="workshop-sec">
      <div class="sec-title">成果工坊</div>
      <div class="ws-list">
        <button class="ws-item" onclick="location.href='album.html'">
          <span class="ws-ic"><span aria-hidden="true"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5.5 C10 3.5 7.5 3 5.5 4 C4.5 7 4.5 11 5.5 15 C7.5 14 10 14 12 16 C14 14 16.5 14 18.5 15 C19.5 11 19.5 7 18.5 4 C16.5 3 14 3.5 12 5.5 Z"/><path d="M12 5.5 V16"/></svg></span></span>
          <span class="ws-main"><b>旅行图册</b><small>把游记排成纵向沉浸的杂志式旅行书，可编辑</small></span>
          <span class="ws-arr">›</span>
        </button>
        <button class="ws-item" onclick="window.Results && Results.album()">
          <span class="ws-ic"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"><path d="M4 5.5C7 4.5 10 4.8 12 6v13c-2-1.2-5-1.5-8-.5z"/><path d="M20 5.5C17 4.5 14 4.8 12 6v13c2-1.2 5-1.5 8-.5z"/></svg></span>
          <span class="ws-main"><b>旅行纪念册</b><small>全部游记 + 名言，汇成一册可导出的年鉴</small></span>
          <span class="ws-arr">›</span>
        </button>
        <button class="ws-item" onclick="window.Results && Results.atlas()">
          <span class="ws-ic"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M12 4l1.7 4.6L18 10.5l-4.3 1.9L12 17l-1.7-4.6L6 10.5l4.3-1.9z"/><path d="M18.2 15l.7 1.9 1.9.7-1.9.7-.7 1.9-.7-1.9-1.9-.7 1.9-.7z"/></svg></span>
          <span class="ws-main"><b>个人图鉴</b><small>探访过的景点，逐个收录成册</small></span>
          <span class="ws-arr">›</span>
        </button>
        <button class="ws-item" onclick="window.Results && Results.story()">
          <span class="ws-ic"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M14.5 5.5l4 4L8 20l-5 1 1-5z"/><path d="M12.5 7.5l4 4"/></svg></span>
          <span class="ws-main"><b>旅程故事</b><small>把时间线交给 AI，写成一整篇旅行散文</small></span>
          <span class="ws-arr">›</span>
        </button>
        <button class="ws-item" onclick="window.Results && Results.itinerary()">
          <span class="ws-ic"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"><circle cx="12" cy="12" r="8.5"/><path d="m15.5 8.5-2 5-5 2 2-5z"/></svg></span>
          <span class="ws-main"><b>定制路书</b><small>把去过的（或专题里的）景点串成每日路线</small></span>
          <span class="ws-arr">›</span>
        </button>
      </div>
    </div>
    <div id="todayBox" style="display:none"></div>
    <div class="cal-card">
      <div class="cal-head">
        <b id="calTitle"></b>
        <div class="nav">
          <button id="calPrev">‹</button>
          <button id="calNext">›</button>
        </div>
      </div>
      <div class="cal-week"><span>日</span><span>一</span><span>二</span><span>三</span><span>四</span><span>五</span><span>六</span></div>
      <div class="cal-grid" id="calGrid"></div>
    </div>
    <div id="dayBox"></div>
    
<div class="sec" id="achvSec">
  <div class="sec-title">足迹成就</div>
  <div id="achvBox" style="background:var(--color-surface);border:1px solid var(--color-line);border-radius:18px;box-shadow:var(--shadow-soft);padding:16px 14px">
    <div id="achvMetrics" style="display:flex;gap:6px;margin-bottom:14px"></div>
    <div id="achvProvs" style="display:flex;flex-wrap:wrap;gap:5px"></div>
    <div id="achvProgress" style="margin-top:14px"></div>
  </div>
</div>
<div class="sec"><div class="sec-title">省份足迹</div><div class="provbar" id="provBar"></div>
      <button class="btn-secondary" id="provBtn" style="width:100%;margin-top:10px;display:none">展开省份地图</button>
      <div id="provMap" style="display:none;height:340px;border-radius:14px;overflow:hidden;border:1px solid var(--color-line);margin-top:10px"></div>
    </div>
    <div class="sec"><div class="sec-title">月份分布</div><div class="monthbar" id="monthBar"></div></div>
    <div class="sec"><div class="sec-title">标签</div><div class="tagcloud" id="tagCloud"></div></div>

    document.getElementById('achvMetrics').innerHTML=metHtml;
    document.getElementById('achvProvs').innerHTML=provHtml;
    document.getElementById('achvProgress').innerHTML='<div style="font-size:11px;color:var(--color-muted);margin-bottom:6px">足迹进度 · '+pct+'%</div><div style="height:6px;background:var(--color-bg-soft);border-radius:99px;overflow:hidden"><div style="height:100%;width:'+pct+'%;background:linear-gradient(90deg,var(--color-primary),#E0A458);border-radius:99px"></div></div>';
  }catch(e){}
}

function renderStats(){
  var sites={},days=0,photos=0;
  notes.forEach(function(n){if(n.lat!=null)sites[n.lat.toFixed(4)+','+n.lng.toFixed(4)]=1;if(dayOf(n))days++;photos+=(n.photos||[]).length;});
  document.getElementById('stats').innerHTML=
    '<div><b>'+notes.length+'</b><span>篇游记</span></div>'+
    '<div><b>'+Object.keys(sites).length+'</b><span>地点</span></div>'+
    '<div><b>'+days+'</b><span>记录日</span></div>'+
    '<div><b>'+photos+'</b><span>照片</span></div>';
}
var _provMap = null, _provLoaded = false;
document.getElementById('provBtn').onclick = function () {
  if (_provLoaded) return; _provLoaded = true;
  var btn = document.getElementById('provBtn');
  btn.textContent = '加载中…';
  var counts = {};
  notes.forEach(function (n) { if (n.province) counts[n.province] = (counts[n.province] || 0) + 1; });
  var max = 0; Object.keys(counts).forEach(function (k) { if (counts[k] > max) max = counts[k]; });
  fetch('https://geo.datav.aliyun.com/areas_v3/bound/100000_full.json')
    .then(function (r) { return r.json(); })
    .then(function (j) {
      var el = document.getElementById('provMap');
      el.style.display = 'block';
      _provMap = L.map(el, { zoomControl: false, attributionControl: true, scrollWheelZoom: false }).setView([35, 104], 4);
      /* 高德街道默认（国内可达，无需代理）；OSM 兜底仅当高德不可用时自动切换 */
      var _amap = L.tileLayer('https://wprd0{s}.is.autonavi.com/appmaptile?lang=zh_cn&size=1&style=7&x={x}&y={y}&z={z}', { subdomains: '1234', maxZoom: 18, attribution: '© 高德地图' }).addTo(_provMap);
      var _osm = L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', { maxZoom: 10, attribution: '© OpenStreetMap' });
      _amap.on('tileerror', function () {
        if (!_provMap.hasLayer(_osm)) { try { _amap.remove(); } catch (e) {} _osm.addTo(_provMap); }
      });
      L.geoJSON(j, {
        style: function (f) {
          var n = counts[f.properties.name] || 0;
          var op = n ? (0.35 + (n / max) * 0.6) : 0.06;
          return { color: '#C86D4B', weight: 1, fillColor: '#C86D4B', fillOpacity: op };
        }
      }).addTo(_provMap);
      _provMap.fitBounds([[3, 73], [54, 135]]);
      btn.style.display = 'none';
    })
    .catch(function () {
      btn.textContent = '地图加载失败，请检查网络';
      setTimeout(function () { btn.textContent = '展开省份地图'; }, 2000);
      _provLoaded = false;
    });
};
function renderCal(){
  var p=curYm.split('-'),y=+p[0],m=+p[1];
  var first=new Date(y,m-1,1).getDay(),dim=new Date(y,m,0).getDate();
  document.getElementById('calTitle').textContent=y+' 年 '+m+' 月';
  var html='';
  for(var i=0;i<first;i++)html+='<div class="cal-cell off"></div>';
  var today=new Date(),td=today.getFullYear()===y&&today.getMonth()+1===m?today.getDate():0;
  for(var d=1;d<=dim;d++){
    var dd=curYm+'-'+pad(d),list=dayMap[dd]||[];
    var cls='cal-cell'+(list.length?' has':'')+(d===td?' today':'');
    html+='<div class="'+cls+'" data-d="'+dd+'">'+d+(list.length?'<span class="dot"></span><span class="cnt">'+list.length+'</span>':'')+(dayMoods[dd]?'<span class="mood">'+dayMoods[dd]+'</span>':'')+'</div>';
  }
  var grid=document.getElementById('calGrid');
  grid.innerHTML=html;
  grid.querySelectorAll('.cal-cell.has').forEach(function(c){
    c.onclick=function(){selDay=c.dataset.d;renderDay();grid.querySelectorAll('.cal-cell').forEach(function(x){x.style.outline='none';});c.style.outline='2px solid var(--color-primary)';};
  });
}
function renderDay(){
  var box=document.getElementById('dayBox');
  if(!selDay||!dayMap[selDay]){box.innerHTML='<div class="empty"><div class="em">选</div><b>选一天，看看那天</b><span>点日历里有记录的日期</span></div>';return;}
  var list=dayMap[selDay].slice().sort(function(a,b){return a.ts-b.ts;});
  var items=list.map(function(n){
    var tags=(n.tags&&n.tags.length)?'<div class="tags">'+n.tags.map(function(t){return '<span>#'+esc(t)+'</span>';}).join('')+'</div>':'';
    var thumbs=(n.photos&&n.photos.length)?'<div class="thumbs">'+n.photos.slice(0,4).map(function(p){return '<img src="'+esc(p)+'" onerror="this.remove()">';}).join('')+'</div>':'';
    return '<div class="md-item"><h3>'+esc(n.title||n.siteName||'未命名')+'</h3>'+
      '<div class="meta">'+esc(n.date)+(n.weather?' · '+esc(n.weather):'')+(n.lat!=null?' · '+n.lat.toFixed(4)+', '+n.lng.toFixed(4):'')+'</div>'+
      '<div class="txt">'+esc(n.text||n.raw)+'</div>'+tags+thumbs+'</div>';
  }).join('');
  var moods=['😀','😐','😭','⛰️','🍜','🧭'];
  var cur=dayMoods[selDay]||'';
  var moodRow='<div class="moodrow">'+moods.map(function(m){return '<span class="mk'+(m===cur?' on':'')+'" data-m="'+m+'">'+m+'</span>';}).join('')+'<span class="mk clear" data-m="">✕</span></div>';
  box.innerHTML='<div class="eyebrow">'+selDay+' · '+list.length+' 篇</div>'+moodRow+items;
  box.querySelectorAll('.mk').forEach(function(k){
    k.onclick=function(){
      if(k.dataset.m){ dayMoods[selDay]=k.dataset.m; }else{ delete dayMoods[selDay]; }
      saveMoods(); renderCal(); renderDay();
    };
  });
}
function renderMonthBar(){
  var yms={};
  notes.forEach(function(n){var d=dayOf(n);if(d)yms[d.slice(0,7)]=(yms[d.slice(0,7)]||0)+1;});
  var keys=Object.keys(yms).sort(),max=0;
  keys.forEach(function(k){if(yms[k]>max)max=yms[k];});
  document.getElementById('monthBar').innerHTML=keys.map(function(k){
    return '<div class="mb"><i style="height:'+Math.max(4,Math.round(yms[k]/max*100))+'px"></i><span>'+k.slice(5)+'</span></div>';
  }).join('')||'<div class="empty" style="padding:20px"><span>还没有记录</span><a href="travel-map.html" style="display:block;margin-top:10px;color:var(--color-primary-dark);font-weight:600">去留下第一篇记录 →</a></div>';
}
function renderTags(){
  var t={};
  notes.forEach(function(n){(n.tags||[]).forEach(function(x){t[x]=(t[x]||0)+1;});});
  var arr=Object.keys(t).sort(function(a,b){return t[b]-t[a];}).slice(0,20);
  document.getElementById('tagCloud').innerHTML=arr.map(function(x){return '<span>#'+esc(x)+'</span>';}).join('')||'<span>还没有标签</span>';
}
function renderPlaces(){
  var p={};
  notes.forEach(function(n){var k=n.siteName||n.title||'';if(k)p[k]=(p[k]||0)+1;});
  var arr=Object.keys(p).sort(function(a,b){return p[b]-p[a];}).slice(0,24);
  document.getElementById('places').innerHTML=arr.map(function(x){return '<span>'+esc(x)+' <b style="color:var(--color-primary-dark)">'+p[x]+'</b></span>';}).join('')||'<span>还没有地点</span>';
}
(function(){var hp=document.getElementById('calPrev');if(hp&&!document.getElementById('yrPrev')){var mk=function(id,txt){var b=document.createElement('button');b.id=id;b.textContent=txt;b.title=(id==='yrPrev'?'上一年':'下一年');b.style.cssText='font-size:0.75rem;width:auto;padding:0 11px';return b;};var b1=mk('yrPrev','‹ 年'),b2=mk('yrNext','年 ›');hp.parentNode.insertBefore(b1,hp);hp.parentNode.insertBefore(b2,hp.nextSibling);}})();
document.getElementById('calPrev').onclick=function(){
  var p=curYm.split('-'),y=+p[0],m=+p[1]-1;
  if(m<1){m=12;y--;}
  curYm=y+'-'+pad(m);renderCal();renderDay();
};
document.getElementById('yrPrev').onclick=function(){var p=curYm.split('-'),y=+p[0],m=+p[1]-12;if(m<=0){y--;m+=12;}curYm=y+'-'+pad(m);renderCal();renderDay();};
document.getElementById('yrNext').onclick=function(){var p=curYm.split('-'),y=+p[0],m=+p[1]+12;if(m>12){y++;m-=12;}curYm=y+'-'+pad(m);renderCal();renderDay();};
document.getElementById('calNext').onclick=function(){
  var p=curYm.split('-'),y=+p[0],m=+p[1]+1;
  if(m>12){m=1;y++;}
  curYm=y+'-'+pad(m);renderCal();renderDay();
};
function toast(msg){
  if (window.UI) { UI.toast(msg); return; }
  var d=document.createElement('div');
  d.style.cssText='position:fixed;top:calc(env(safe-area-inset-top,0px)+14px);left:50%;transform:translateX(-50%);background:rgba(32,32,29,.92);color:#fff;padding:12px 22px;border-radius:999px;font-size:13px;z-index:9800;box-shadow:0 8px 24px rgba(30,30,28,.18)';
  d.textContent=msg; document.body.appendChild(d);
  setTimeout(function(){ d.remove(); },2200);
}
document.getElementById('aiReport').onclick=function(){
  if(!notes.length){ toast('还没有游记'); return; }
  var list=notes.slice().sort(function(a,b){return a.ts-b.ts;});
  var provs={},sites={};
  list.forEach(function(n){ if(n.province)provs[n.province]=1; if(n.lat!=null)sites[n.lat.toFixed(4)+','+n.lng.toFixed(4)]=1; });
  var timeline=list.map(function(n){
    return (n.date||'')+' 在'+(n.siteName||'某处')+(n.weather?'（'+n.weather+'）':'')+'：'+(n.text||n.raw||'').slice(0,100);
  }).join('\n');
  var prompt='我有 '+list.length+' 篇游记，'+Object.keys(sites).length+' 个地点，覆盖 '+Object.keys(provs).length+' 个省份。请写一篇 400-600 字的年度旅行回顾散文，温暖有画面感，按时间推进，可穿插感悟，不要编造未出现的史实。时间线如下：\n'+timeline;
  var dlg=document.createElement('div');
  dlg.className='report-dlg';
  dlg.innerHTML='<h4>年度报告</h4><div class="txt">正在写作…</div><div class="acts"><button class="x" id="rptClose">关闭</button></div>';
  document.body.appendChild(dlg);
  dlg.querySelector('#rptClose').onclick=function(){ dlg.remove(); };
  /* 本地模板兜底：无 key / 请求失败时生成统计式年度回顾，不让用户空手而归 */
  function fallbackLocal(reason){
    var provArr=Object.keys(provs), siteArr=Object.keys(sites);
    var days={};
    list.forEach(function(n){ var d=(n.date||'').slice(0,10); if(d) days[d]=1; });
    var dCount=Object.keys(days).length;
    var first=list[0], last=list[list.length-1];
    var lines=[
      '这一年，你去了 '+Object.keys(provs).length+' 个省份、'+siteArr.length+' 处地方，',
      '留下了 '+list.length+' 篇游记、'+dCount+' 个日子的记录。',
      (first?'从 '+((first.date||'').slice(0,10)||'出发')+' 的'+(first.siteName||'第一站')+'，':''),
      (last?'到 '+((last.date||'').slice(0,10)||'归途')+' 的'+(last.siteName||'最后一站')+'，':'')+'',
      '每一步都算数。',
      '',
      provArr.length?'走过：'+provArr.join('、')+'。':'',
      '',
      list.slice(0,5).map(function(n){ return '· '+(n.date||'').slice(0,10)+' '+(n.siteName||'某处')+' — '+String(n.text||n.raw||'').slice(0,46); }).join('\n')+(list.length>5?'\n… 还有 '+(list.length-5)+' 段记忆没有写在这里。':''),
      '',
      reason||'在「设置 → AI 助手」配好站点与 Key，下次就能请 AI 把这一年写成散文。'
    ];
    dlg.querySelector('.txt').textContent=lines.join('\n');
  }
  if(!(window.Ai && Ai.hasKey())){ fallbackLocal('（未配置 AI，先在「设置 → AI 助手」选站点填 Key，下次就能请 AI 把这一年写成散文。）'); return; }
  var msgs=[
    {role:'system',content:'你是资深旅行作家。把用户一年的游记时间线写成一篇完整、有画面感与情感的年度旅行回顾散文。'},
    {role:'user',content:prompt}
  ];
  Ai.stream(msgs, function (delta) {
    var el = dlg.querySelector('.txt');
    el.textContent += delta;
  }).then(function (full) {
    dlg.querySelector('.txt').textContent = full;
  }).catch(function (err) {
    fallbackLocal('（AI 生成失败：' + String(err && err.message || err) + '，已为你生成本地版年度回顾。）');
  });
};
/* 海报生成：点击即反馈 —— 无数据明确提示，有数据先提示「正在生成」再执行（避免 Canvas 同步绘制时的无响应空窗） */
function posterFeed(fn) {
  var list = (window.TravelNotes && TravelNotes.list()) || [];
  var has = list.some(function (n) { return n.lat != null && n.lng != null; });
  if (!has) { UI.toast('还没有带位置的游记，先去记录一段旅程吧'); return; }
  UI.toast('正在生成海报…');
  setTimeout(fn, 40);
}
document.getElementById('posterBtnH').onclick = function () { posterFeed(function () { try { window.FootprintPoster.generate(true); } catch (e) { UI.toast('生成失败'); } }); };
document.getElementById('posterBtn').onclick = function () { posterFeed(function () { try { window.FootprintPoster.generate(); } catch (e) { UI.toast('生成失败：' + (e && e.message || e)); } }); };
document.getElementById('posterCarto').onclick = function () { posterFeed(function () { try { window.FootprintPoster.generate(false, 'carto'); } catch (e) { UI.toast('生成失败：' + (e && e.message || e)); } }); };
window.TravelNotes._onReady=render;
window.TravelNotes._afterSave=render;
TravelNotes.init({});
</script>
