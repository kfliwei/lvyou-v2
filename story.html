<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>旅程叙事 · 行迹</title>
<script src="theme.js"></script>
<link rel="stylesheet" href="design.css">
<link rel="stylesheet" href="vendor/leaflet/leaflet.css">
<style>
  html,body{height:100%;margin:0;font-family:var(--font-sans);background-color:var(--color-bg);color:var(--color-ink)}
  #storyMap{position:sticky;top:0;height:44vh;z-index:50;background:var(--map-bg)}
  #storyWrap{position:relative;z-index:60;background:var(--color-bg)}
  .story-bar{position:sticky;top:0;z-index:70;display:flex;align-items:center;gap:8px;padding:calc(env(safe-area-inset-top,0px) + 8px) 14px 10px;background:var(--paper-bar);border-bottom:1px solid var(--color-line)}
  .story-bar .back{border:1px solid var(--color-line);background:var(--color-bg-soft);color:var(--color-ink);font-size:var(--fs-6);display:flex;align-items:center;justify-content:center;cursor:pointer;flex:0 0 auto}
  .story-bar .title{flex:1;font-family:var(--font-serif);font-weight:400;font-size:var(--fs-8);color:var(--color-ink)}
  /* 批次 25-B：34 → 44。顶栏一族的触控口径（design.css）只认两档——高频 ≥44，
     或「地图浮控件」那族点名 36；一个换故事的下拉既不高频也不在豁免里。
     条形本来就靠 44 的返回键撑起 63px 高，这颗跟着抬不额外吃垂直空间。 */
  .story-bar select{flex:0 0 auto;max-width:140px;height:44px;border:1px solid var(--color-line);border-radius:999px;background:var(--color-surface);color:var(--color-ink);font-size:var(--fs-3);padding:0 12px}
  #cards{padding:10px 16px 200px}
  .story-card{background:var(--color-surface);border:1px solid var(--color-line);border-radius:18px;box-shadow:var(--shadow-soft);padding:18px 18px 16px;margin-bottom:14px;transition:box-shadow var(--motion-normal)}
  .story-card.active{box-shadow:0 0 0 2px var(--color-primary)}
  .story-card .sc-date{font-size:var(--fs-3);color:var(--color-muted);letter-spacing:.06em}
  .story-card .sc-place{font-family:var(--font-serif);font-size:22px;font-weight:400;color:var(--color-ink);margin-top:6px;line-height:1.3}
  .story-card .sc-meta{font-size:var(--fs-3);color:var(--color-muted);margin-top:5px}
  .story-card .sc-txt{font-family:var(--font-serif);font-size:var(--fs-5);line-height:1.9;color:var(--color-ink-soft);margin-top:10px;white-space:pre-wrap}
  .story-card .sc-pics{display:flex;gap:6px;margin-top:10px;overflow-x:auto}
  .story-card .sc-pics img{width:90px;height:90px;object-fit:cover;border-radius:10px;flex:0 0 auto;cursor:pointer}
  .story-card .sc-tags{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
  .story-card .sc-tags span{font-size:var(--fs-2);color:var(--color-primary-dark);background:var(--color-primary-soft);padding:2px 9px;border-radius:999px}
  .story-empty{padding:70px 20px;text-align:center;color:var(--color-muted)}
  .story-empty img{width:200px;height:auto;max-width:70vw;display:block;margin:0 auto 18px}
  .story-empty b{display:block;font-family:var(--font-serif);font-size:var(--fs-8);font-weight:400;color:var(--color-ink);margin-bottom:8px}
  .story-empty span{font-size:var(--fs-4);line-height:1.8}
  .sc-skip{margin:8px 4px 0;font-size:var(--fs-3);color:var(--color-muted);text-align:center;line-height:1.7}
  .story-nav{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom,0px) + 104px);z-index:80;display:flex;align-items:center;gap:10px;width:min(calc(100% - 24px),440px);background:var(--glass-bar);border:1px solid var(--edge-hair-soft);border-radius:999px;padding:8px 14px;box-shadow:var(--shadow-float);backdrop-filter:var(--blur-bar);-webkit-backdrop-filter:var(--blur-bar)}
  .story-nav .sn-btn{border:1px solid var(--color-line);border-radius:50%;background:var(--color-surface);color:var(--color-ink);font-size:var(--fs-7);display:flex;align-items:center;justify-content:center;cursor:pointer;flex:0 0 auto}
  .story-nav .sn-btn:disabled{opacity:.35;cursor:not-allowed}
  .story-nav .sn-info{flex:1;text-align:center;min-width:0}
  .story-nav .sn-info b{font-family:var(--font-serif);font-weight:400;font-size:var(--fs-5);color:var(--color-ink);display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .story-nav .sn-info span{display:block;font-size:var(--fs-2);color:var(--color-muted);margin-top:1px}
  .theme-dark .story-nav{background:rgba(29,28,25,.92);border-color:var(--color-line)}

/* ============================================================
   v3 CINEMATIC LAYER · 旅程叙事
   ============================================================ */
.story-bar{background:var(--paper-bar);border-bottom-color:var(--edge-hair-soft)}
.story-bar select{border-radius:999px;padding:0 26px 0 12px;appearance:none;-webkit-appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--color-faint) 50%),linear-gradient(135deg,var(--color-faint) 50%,transparent 50%);background-position:calc(100% - 14px) 50%,calc(100% - 10px) 50%;background-size:4px 4px;background-repeat:no-repeat}
.story-card{border-radius:20px;padding:20px 18px 18px;transition:box-shadow var(--motion-normal),border-color var(--motion-normal)}
.story-card.active{box-shadow:var(--shadow-medium),0 0 0 1.5px var(--color-gold-bright);border-color:color-mix(in srgb,var(--color-gold-bright) 45%,var(--color-line))}
.story-card .sc-date{display:inline-flex;align-items:center;gap:7px;font-size:var(--fs-2);letter-spacing:.16em}
.story-card .sc-date::before{content:"";width:12px;height:2px;border-radius:2px;background:var(--grad-gold-line)}
.story-card .sc-place{font-size:23px}
.story-card .sc-tags span{background:rgba(200,109,75,.10);color:var(--color-ember-deep);font-weight:500}
.story-card .sc-pics img{border-radius:12px}
.story-nav{background:var(--glass-bar);border:1px solid rgba(220,174,94,.25);backdrop-filter:var(--blur-bar);-webkit-backdrop-filter:var(--blur-bar)}
.story-nav .sn-btn{background:linear-gradient(145deg,var(--color-surface),var(--color-bg-soft))}
.story-empty b{font-size:var(--fs-9)}
.theme-dark .story-bar{background:var(--paper-bar)}
.theme-dark .story-nav{background:rgba(27,23,19,.85)}

/* ============================================================
   TRACE 深色模式补丁（覆盖内联浅色浮层/控件 — 跨页面保持深色）
   ============================================================ */
</style>
</head>
<body>
<div id="storyMap"></div>
<div id="storyWrap">
  <div class="story-bar">
    <button class="back" aria-label="返回" onclick="history.length>1?history.back():location.href='me.html'">←</button>
    <div class="title">旅程叙事</div>
    <select id="tripSel"></select>
  </div>
  <div id="cards"></div>
</div>
<div class="story-nav" id="storyNav">
  <button class="sn-btn" id="snPrev" aria-label="上一站">‹</button>
  <div class="sn-info"><b id="snTitle"></b><span id="snSub"></span></div>
  <button class="sn-btn" id="snNext" aria-label="下一站">›</button>
</div>
<script src="vendor/leaflet/leaflet.js"></script>
<script src="geo.js"></script>
<script src="icons.js"></script>
<script src="ui.js"></script>
<script src="travel-notes.js"></script>
<script>
/* 滚动叙事地图：滚动卡片，地图跟随飞至对应节点 */
function esc(s){return window.UI.esc(s);}
/* GCJ-02 纠偏：与全站一致——默认高德街道瓦片（国内可达、无需代理），数据坐标经 GCJ 纠偏后对齐 */
function _tlat(lng, lat) { return window.Geo._tlat(lng, lat); }
function _tlng(lng, lat) { return window.Geo._tlng(lng, lat); }
function gcj02Of(lat, lng) { return window.Geo.gcj02Of(lat, lng); }
function gxy(lat,lng){ return gcj02Of(lat,lng); }
var GAP=3*24*3600*1000;
var notes=[], trips=[], curTrip='all', cards=[];
var map=L.map('storyMap',{zoomControl:false,attributionControl:true,scrollWheelZoom:false}).setView([35,104],4);
L.control.zoom({position:'bottomleft'}).addTo(map);
/* 高德街道默认（国内可达）；OSM 兜底仅当高德不可用时自动切换 */
var amapStreet=L.tileLayer('https://wprd0{s}.is.autonavi.com/appmaptile?lang=zh_cn&size=1&style=7&x={x}&y={y}&z={z}',{subdomains:'1234',maxZoom:18,attribution:'© 高德地图'}).addTo(map);
var osmLayer=L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:18,attribution:'© OpenStreetMap'});
amapStreet.on('tileerror',function(){
  if(!map.hasLayer(osmLayer)){ try{ amapStreet.remove(); }catch(e){} osmLayer.addTo(map); }
});
var routeLayer=L.layerGroup().addTo(map);

function groupTrips(list){
  var sorted=list.slice().sort(function(a,b){return a.ts-b.ts;});
  var out=[];
  sorted.forEach(function(n){
    var last=out[out.length-1];
    if(last && n.ts-last.end<=GAP){ last.notes.push(n); last.end=n.ts; }
    else out.push({start:n.ts,end:n.ts,notes:[n]});
  });
  return out;
}
function renderSel(){
  var sel=document.getElementById('tripSel');
  sel.innerHTML='<option value="all">全部旅程</option>'+trips.map(function(t,i){
    return '<option value="'+i+'">'+TravelNotes.dayText(t.notes[0])+' ~ '+TravelNotes.dayText(t.notes[t.notes.length-1])+'（'+t.notes.length+' 篇）</option>';
  }).join('');
}
/* 批次33-D：这一屏的日期行要带时分。批次 31 把显示收成单点之后，日卡和翻页条只剩 dayText，
   同一程里「早上落笔」和「深夜补记」看着是同一天——旅程叙事最需要的正是这个先后。
   拼串仍只从两个单点出口读（dayText 给日、fmtClock 给时分），不开第三份解析；
   这个定义本身含 2 次单点调用，下面两处调用点改调它 ⇒ §46 登记的 story.html 计数仍是 4。 */
function dayClock(n){ return [TravelNotes.dayText(n), TravelNotes.fmtClock(n.ts)].filter(Boolean).join(' · '); }
function render(){
  notes=(window.TravelNotes?TravelNotes.list():[]);
  /* 没坐标的游记进不了路线，但它们在库里、在游记屏里看得见。改前这里是静默 filter（实测 20 篇里有
     3 篇没位置，屏上没有任何一句说明，用户只会以为「丢了」）——数目单记一笔，末尾交代。 */
  var withLoc=notes.filter(function(n){return n.lat!=null&&n.lng!=null;});
  var skipped=notes.length-withLoc.length;
  trips=groupTrips(withLoc);
  renderSel();
  var list = curTrip==='all' ? trips.reduce(function(a,t){return a.concat(t.notes);},[]) : (trips[+curTrip]?trips[+curTrip].notes:[]);
  cards=list.slice().sort(function(a,b){return a.ts-b.ts;});
  var box=document.getElementById('cards');
  if(!cards.length){ box.innerHTML='<div class="story-empty"><svg class="empty-art" viewBox="0 0 120 100" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" role="img" aria-label="足迹线稿"><ellipse cx="34" cy="66" rx="6" ry="9" transform="rotate(-15 34 66)"/><circle cx="30" cy="52" r="2"/><circle cx="36" cy="49" r="1.6"/><circle cx="42" cy="52" r="1.4"/><ellipse cx="66" cy="42" rx="5.4" ry="8" transform="rotate(10 66 42)"/><circle cx="63" cy="30" r="1.8"/><circle cx="69" cy="28" r="1.5"/><circle cx="74" cy="30" r="1.3"/><ellipse cx="96" cy="20" rx="4.4" ry="6.4" transform="rotate(-8 96 20)" opacity=".5"/><path d="M14 84 Q60 76 108 12" stroke-dasharray="3 5" opacity=".3"/></svg><b>还没有带坐标的游记</b><span>先在地图上记录几篇，<br>这里会把它们讲成一段旅程。</span>'+(skipped?'<span style="display:block;margin-top:14px">另有 '+skipped+' 篇没填位置，进不了路线</span>':'')+'</div>'; return; }
  /* 批次7-C 旅程开篇：竖排题签取首站地名，横排一句卷首语（数据全来自 cards，不编） */
  var _f=cards[0];
  /* 卷首语的跨度只拿有 ts 的那几站算：没填时间戳的游记会把手上的减法打成 NaN，而「跨 NaN 天」是会上屏的 */
  var _sp=cards.map(function(n){return n.ts;}).filter(function(t){return typeof t==='number'&&isFinite(t);});
  var _days=_sp.length>1?Math.max(1,Math.round((Math.max.apply(null,_sp)-Math.min.apply(null,_sp))/86400000)+1):1;
  var _op='<div class="vrow"><span class="vtitle">'+esc(String(_f.siteName||_f.title||'此程').slice(0,10))+'</span>'
    +'<p class="vlead">自这里落笔 · 共 '+cards.length+' 站 · 跨 '+_days+' 天</p></div>';
  box.innerHTML=_op+cards.map(function(n,i){
    var pics=(n.photos&&n.photos.length)?'<div class="sc-pics">'+n.photos.map(function(p,pi){return '<img loading="lazy" decoding="async" src="'+esc(p)+'" onerror="window.UI&&UI.imgFail(this)" onclick="TravelNotes.zoomPhotoIdx(\x27'+n.id+'\x27,'+pi+')" alt="">';}).join('')+'</div>':'';
    var tags=(n.tags&&n.tags.length)?'<div class="sc-tags">'+n.tags.map(function(t){return '<span>#'+esc(t)+'</span>';}).join('')+'</div>':'';
    return '<div class="story-card" data-i="'+i+'">'
      +'<div class="sc-date">'+esc(dayClock(n))+'</div>'
      +'<div class="sc-place">'+esc(n.title||n.siteName||'未命名')+'</div>'
      +'<div class="sc-meta">'+esc(n.siteName||'')+(n.weather?' · '+esc(n.weather):'')+'</div>'
      +'<div class="sc-txt">'+esc(n.text||n.raw)+'</div>'+pics+tags+'</div>';
  }).join('')+(skipped?'<div class="sc-skip">另有 '+skipped+' 篇没填位置，不进路线</div>':'');
  setActive(0,true);
  fitBounds();
}
/* 进屏取景：全部站点一次框进来（含没讲到的），地图从一开始就是「这一段旅程的全貌」。
   站与站重合或只有 1 站时，fitBounds 会一路顶到最大缩放档，实测只剩一个点占满屏——那不如给个可读的街景档。 */
function fitBounds(){
  var pts=cards.map(function(n){var p=gxy(n.lat,n.lng);return [p[0],p[1]];});
  if(!pts.length) return;
  var b=L.latLngBounds(pts);
  if(pts.length>1 && b.getNorth()!==b.getSouth() && b.getEast()!==b.getWest()) map.fitBounds(b,{padding:[30,30]});
  else map.setView(pts[0],10);
}
/* 分镜（批次 38-C）：全程的点线一进场就在，讲到哪一档靠粗细与大小区分。
   改前是「讲到哪画到哪」：进屏恰好是最坏的一档——1 个点、0 条线，另一座城完全不在视野里，
   要翻到末站才第一次看见全程。跨城的连线不冒充走过的路：按城市断开，城与城之间用最淡的点线搭一下。 */
function placeKey(n){ return n.city || n.province || n.siteName || ''; }
function drawRoute(upto){
  routeLayer.clearLayers();
  for(var k=1;k<cards.length;k++){
    var done=k<=upto;
    var same=placeKey(cards[k-1])!=='' && placeKey(cards[k-1])===placeKey(cards[k]);
    var st=same
      ? {color:'#AE5738',weight:done?3:2,opacity:done?.6:.22,dashArray:done?null:'6 6',lineCap:'round'}
      : {color:'#9C9A92',weight:done?2:1.5,opacity:done?.45:.28,dashArray:'2 7',lineCap:'round'};
    L.polyline([gxy(cards[k-1].lat,cards[k-1].lng),gxy(cards[k].lat,cards[k].lng)],st).addTo(routeLayer);
  }
  for(var k=0;k<cards.length;k++){
    var p=gxy(cards[k].lat,cards[k].lng), cur=(k===upto), past=(k<upto);
    var sz=cur?16:(past?10:8), col=cur?'#AE5738':(past?'rgba(174,87,56,.7)':'#9C9A92'), bd=cur?3:2;
    var mk=L.marker(p,{icon:L.divIcon({className:'',html:'<div style="width:'+sz+'px;height:'+sz+'px;border-radius:50%;background:'+col+';border:'+bd+'px solid #fff;box-shadow:0 2px 8px rgba(0,0,0,.3)"></div>',iconSize:[sz,sz],iconAnchor:[sz/2,sz/2]})}).addTo(routeLayer);
    if(window.UI) UI.markerLabel(mk,(cards[k].title||cards[k].siteName||'第 '+(k+1)+' 站')+(cur?'，正讲到这一站':''));
  }
}
function updateNav(i){
  var n=cards[i]; if(!n) return;
  document.getElementById('snTitle').textContent=(n.title||n.siteName||'未命名');
  document.getElementById('snSub').textContent='第 '+(i+1)+' / '+cards.length+' 站 · '+dayClock(n);
  document.getElementById('snPrev').disabled=(i<=0);
  document.getElementById('snNext').disabled=(i>=cards.length-1);
}
function setActive(i,initial){
  var els=document.querySelectorAll('.story-card');
  els.forEach(function(e){e.classList.remove('active');});
  if(els[i]) els[i].classList.add('active');
  var n=cards[i]; if(!n) return;
  drawRoute(i);
  /* 翻页不再飞站、不再改缩放档：地图进屏就给全貌，讲到大同不用跳到太原。
     只有当前站跑到视野外才平移（用户自己拖/缩过之后才会发生），zoom 恒不动。 */
  if(!initial) keepInView(gxy(n.lat,n.lng));
  updateNav(i);
}
function keepInView(p){
  var ll=L.latLng(p[0],p[1]);
  if(map.getBounds().pad(-0.05).contains(ll)) return;
  map.panTo(ll,{duration:.5});
}
function goStep(dir){
  var i=lastActive<0?0:lastActive;
  var j=i+dir;
  if(j<0||j>=cards.length) return;
  lastActive=j; setActive(j);
  var el=document.querySelectorAll('.story-card')[j];
  if(el) focusCard(el);
}
/* 可读带＝顶栏下缘到翻页条上缘。顶栏是 sticky：地图（44vh）还露着时它压在地图下面，滚过地图
   之后钉回 0，同一条带上缘在两个滚动态里是两个值——所以这里收滚动态当参数，两侧（落点与 spy）
   都从这一个式子读数，不写死像素；翻页条吃 env(safe-area-inset-bottom)，装了导航栏的机器上还会上移，
   那个数只能现量。 */
function geo(){
  var mp=document.getElementById('storyMap').offsetHeight;
  var barH=document.querySelector('.story-bar').offsetHeight;
  var navTop=document.getElementById('storyNav').getBoundingClientRect().top;
  return {mp:mp,barH:barH,navTop:navTop};
}
function bandAt(y){
  var g=geo();
  return {top:Math.max(g.mp-y,0)+g.barH,bottom:g.navTop};
}
/* 落点按可读带算，不按整屏算。改前这里 scrollIntoView({block:'center'}) 是往视口正中放，
   而视口正中上下各有一条带压着（实测翻页条带 557–619）：产品自己翻到的那一站，当前卡的正文被
   这条半透明条糊住最多 1.75 行，照片条整个在带外按中心点不着（实测 tools/out/b39-probe-backlog.txt）。
   带高随滚动态变（地图未让开时只有 176，让开后 494），所以这里一次算清文档坐标，不混用两种态。
   「卡片整张落在带内」对应的滚动态是一段区间，区间中点正好＝「卡片中心落在带中心」那一档，取它：
   下面那个 scroll-spy 判的也是带中心，落点与判据同一点，翻到的这一站才不会被立刻判给邻站
   （贴带上缘落点就会——当前卡中心在 163、带中心在 310，离带中心最近的反而是下一张）。
   比整条带还高的卡没法整张都露出来——那只能贴带上缘，读到哪算哪，
   而这种卡必须先把地图让开（带只有 176 那一档时贴顶照样被翻页条切），所以取 max(地图高, 贴顶)。 */
function focusCard(el){
  var g=geo();
  var h=el.offsetHeight;
  var D=window.scrollY+el.getBoundingClientRect().top;
  var y=(h>g.navTop-g.barH)?Math.max(g.mp,D-g.barH):D+h/2-(g.barH+g.navTop)/2;
  window.scrollTo({top:Math.max(0,Math.min(y,document.documentElement.scrollHeight-window.innerHeight)),behavior:UI.scrollBehavior()});
}
/* scroll-spy：以卡片相对可读带中位判断激活（与上面落点同一个带，否则翻页刚落定就被判给别人） */
var _spyTimer=null;
function onScroll(){
  if(_spyTimer) return;
  _spyTimer=setTimeout(function(){
    _spyTimer=null;
    var els=document.querySelectorAll('.story-card');
    var best=-1,bestD=1e9;
    var bd=bandAt(window.scrollY);
    var mid=(bd.top+bd.bottom)/2;
    els.forEach(function(e,i){
      var r=e.getBoundingClientRect();
      var d=Math.abs((r.top+r.height/2)-mid);
      if(d<bestD){bestD=d;best=i;}
    });
    if(best>=0 && best!==lastActive){ lastActive=best; setActive(best); }
  },120);
}
var lastActive=-1;
window.addEventListener('scroll',onScroll,{passive:true});
document.getElementById('tripSel').onchange=function(){ curTrip=this.value; lastActive=-1; render(); };
document.getElementById('snPrev').onclick=function(){ goStep(-1); };
document.getElementById('snNext').onclick=function(){ goStep(1); };
window.TravelNotes._onReady=render;
window.TravelNotes._afterSave=render;
TravelNotes.init({});
setTimeout(function(){ map.invalidateSize(); },300);
</script>
