<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>旅程叙事 · 行迹</title>
<link rel="manifest" href="manifest.webmanifest">
<script src="theme.js"></script>
<link rel="stylesheet" href="design.css">
<link rel="stylesheet" href="vendor/leaflet/leaflet.css">
<style>
  html,body{height:100%;margin:0;font-family:var(--font-sans);background:var(--color-bg);color:var(--color-ink)}
  #storyMap{position:sticky;top:0;height:44vh;z-index:50;background:var(--map-bg)}
  #storyWrap{position:relative;z-index:60;background:var(--color-bg)}
  .story-bar{position:sticky;top:0;z-index:70;display:flex;align-items:center;gap:8px;padding:calc(env(safe-area-inset-top,0px)+8px) 14px 10px;background:rgba(250,248,243,.92);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);border-bottom:1px solid var(--color-line)}
  .story-bar .back{width:34px;height:34px;border:1px solid var(--color-line);border-radius:50%;background:var(--color-bg-soft);color:var(--color-ink);font-size:15px;display:flex;align-items:center;justify-content:center;cursor:pointer;flex:0 0 auto}
  .story-bar .title{flex:1;font-family:var(--font-serif);font-weight:400;font-size:17px;color:var(--color-ink)}
  .story-bar select{flex:0 0 auto;max-width:140px;height:34px;border:1px solid var(--color-line);border-radius:999px;background:var(--color-surface);color:var(--color-ink);font-size:12px;padding:0 10px}
  #cards{padding:10px 16px 60px}
  .story-card{background:var(--color-surface);border:1px solid var(--color-line);border-radius:18px;box-shadow:var(--shadow-soft);padding:18px 18px 16px;margin-bottom:14px;transition:box-shadow .3s}
  .story-card.active{box-shadow:0 0 0 2px var(--color-primary)}
  .story-card .sc-date{font-size:0.7188rem;color:var(--color-muted);letter-spacing:.06em}
  .story-card .sc-place{font-family:var(--font-serif);font-size:22px;font-weight:400;color:var(--color-ink);margin-top:6px;line-height:1.3}
  .story-card .sc-meta{font-size:0.75rem;color:var(--color-muted);margin-top:5px}
  .story-card .sc-txt{font-family:var(--font-serif);font-size:0.875rem;line-height:1.9;color:var(--color-ink-soft);margin-top:10px;white-space:pre-wrap}
  .story-card .sc-pics{display:flex;gap:6px;margin-top:10px;overflow-x:auto}
  .story-card .sc-pics img{width:90px;height:90px;object-fit:cover;border-radius:10px;flex:0 0 auto}
  .story-card .sc-tags{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
  .story-card .sc-tags span{font-size:11px;color:var(--color-primary-dark);background:var(--color-primary-soft);padding:2px 9px;border-radius:999px}
  .story-empty{padding:70px 20px;text-align:center;color:var(--color-muted)}
  .story-empty img{width:200px;height:auto;max-width:70vw;display:block;margin:0 auto 18px}
  .story-empty b{display:block;font-family:var(--font-serif);font-size:18px;font-weight:400;color:var(--color-ink);margin-bottom:8px}
  .story-empty span{font-size:13px;line-height:1.8}

/* ============================================================
   TRACE 深色模式补丁（覆盖内联浅色浮层/控件 — 跨页面保持深色）
   ============================================================ */
.theme-dark .topbar,.theme-dark .tripbar{background:rgba(29,28,25,.92);border-bottom-color:var(--color-line)}
.theme-dark .t-row .back{background:var(--color-bg-soft);border-color:var(--color-line);color:var(--color-ink)}
.theme-dark .t-row .title,.theme-dark .t-row .title small{color:var(--color-ink)}
.theme-dark .t-row .act,.theme-dark .t-row .act.sec{background:rgba(255,255,255,.06);color:var(--color-ink-soft);border-color:var(--color-line-strong)}
.theme-dark .bottom-nav,.theme-dark .tabbar{background:#1a1a17;border-top-color:var(--color-line)}
.theme-dark .bottom-nav__item,.theme-dark .tabbar button{color:var(--color-muted)}
.theme-dark .bottom-nav__item.active,.theme-dark .tabbar button.on{color:var(--color-ink);background:rgba(255,255,255,.06)}
.theme-dark .chips button{background:var(--color-surface);border-color:var(--color-line-strong);color:var(--color-ink-soft)}
.theme-dark .chips button.on{background:var(--color-primary);color:#fff;border-color:var(--color-primary)}
.theme-dark .search-bar,.theme-dark .hero__search{background:var(--color-surface);border-color:var(--color-line)}
.theme-dark .search-bar input,.theme-dark .hero__search input{color:var(--color-ink)}
.theme-dark .search-bar input::placeholder{color:var(--color-faint)}
.theme-dark .btn-secondary{background:var(--color-surface);border-color:var(--color-line-strong);color:var(--color-ink-soft)}
.theme-dark .btn-primary{background:var(--color-primary);color:#fff}
.theme-dark .text-link{color:var(--color-ink)}
.theme-dark .sheet__handle{background:rgba(239,233,220,.2)}
.theme-dark .ls-place,.theme-dark .ls-loc,.theme-dark .arrive-place{color:var(--color-ink)}
.theme-dark .ls-desc,.theme-dark .ls-hist,.theme-dark .arrive-eyebrow,.theme-dark .arrive-ask{color:var(--color-ink-soft)}
.theme-dark .ls-img{background:var(--color-bg-soft)}
.theme-dark .arrive-card{background:rgba(29,28,25,.94);border-color:var(--color-line);color:var(--color-ink)}
.theme-dark .tr-ring{opacity:.4}
.theme-dark .fab{background:var(--color-primary);color:#fff;border-color:transparent}
.theme-dark .ctl,.theme-dark .ctl button{background:rgba(29,28,25,.92);color:var(--color-ink-soft);border-color:var(--color-line)}
.theme-dark .laymenu{background:rgba(29,28,25,.97);border-color:var(--color-line)}
.theme-dark .laymenu .li{color:var(--color-ink-soft)}
.theme-dark .laymenu .li.on{background:var(--color-primary-soft);color:var(--color-primary-dark)}
.theme-dark .stat{background:rgba(29,28,25,.92);border-color:var(--color-line);color:var(--color-ink)}
.theme-dark .statOpen{background:rgba(29,28,25,.92);border-color:var(--color-line);color:var(--color-ink-soft)}
.theme-dark .statClose{background:rgba(255,255,255,.08);color:var(--color-muted)}
.theme-dark .story-item{color:var(--color-ink)}
.theme-dark .story-item__title{color:var(--color-ink)}
.theme-dark .story-item__desc{color:var(--color-ink-soft)}
.theme-dark .home-end{color:var(--color-ink-soft)}
.theme-dark .empty{color:var(--color-ink-soft)}
.theme-dark .empty b{color:var(--color-ink)}
.theme-dark .empty .em{color:var(--color-faint)}
.theme-dark .section-title{color:var(--color-ink)}
.theme-dark .eyebrow{color:var(--color-muted)}
.theme-dark .data-acts .data-danger{color:var(--color-primary-dark);border-color:var(--color-line-strong)}
.theme-dark .data-acts .data-danger:active{background:var(--color-primary-soft)}
.theme-dark .group{background:var(--color-surface);border-color:var(--color-line)}
.theme-dark .group-title{color:var(--color-ink)}
.theme-dark .group-sub,.theme-dark .row-label{color:var(--color-muted)}
.theme-dark input[type=text],.theme-dark input[type=password]{background:var(--color-bg-soft);border-color:var(--color-line);color:var(--color-ink)}
.theme-dark .storage,.theme-dark .voice-diag{color:var(--color-ink-soft)}
.theme-dark .switchrow .sw-label{color:var(--color-ink)}
.theme-dark .switchrow .sw-sub{color:var(--color-muted)}
.theme-dark .legend{background:rgba(29,28,25,.92);border-color:var(--color-line);color:var(--color-ink)}
.theme-dark .legend .lh{color:var(--color-muted)}
.theme-dark .legend .lt{color:var(--color-ink-soft)}
.theme-dark .legend .lc{color:var(--color-primary)}
.theme-dark .sp-topic,.theme-dark .sp-note{color:var(--color-ink-soft)}
.theme-dark .sp-topic{color:var(--color-primary-dark)}
.theme-dark .home-end__cta,.theme-dark .hero__cta{color:var(--color-ink)}
.theme-dark .trip-empty{color:var(--color-ink-soft)}
.theme-dark .trip-feature__title,.theme-dark .trip-feature__dates{color:var(--color-ink)}
.theme-dark .trip-feature__meta{color:var(--color-muted)}
.theme-dark .tn-item{background:var(--color-surface);border-color:var(--color-line)}
.theme-dark .tn-item h4{color:var(--color-ink)}
.theme-dark .tn-item .tm,.theme-dark .tn-item .tx{color:var(--color-ink-soft)}
.theme-dark .tn-item .tags span{background:var(--color-primary-soft);color:var(--color-primary-dark)}
.theme-dark .md-item{background:var(--color-surface);border-color:var(--color-line)}
.theme-dark .md-item h3{color:var(--color-ink)}
.theme-dark .md-item .loc,.theme-dark .md-item .meta{color:var(--color-muted)}
.theme-dark .md-item .foot{color:var(--color-primary-dark)}
.theme-dark .md-item .tags span{background:var(--color-primary-soft);color:var(--color-primary-dark)}
.theme-dark .fm-card{background:var(--color-bg-soft);border-color:var(--color-line)}
.theme-dark .fm-card dt{color:var(--color-muted)}
.theme-dark .fm-card dd,.theme-dark .md-body{color:var(--color-ink-soft)}
.theme-dark .fm-card .tags-r span{background:var(--color-primary-soft);color:var(--color-primary-dark)}
.theme-dark .footer a{color:var(--color-muted)}
.theme-dark .cal-card{background:var(--color-surface);border-color:var(--color-line)}
.theme-dark .cal-head b{color:var(--color-ink)}
.theme-dark .cal-head .nav button{background:var(--color-bg-soft);border-color:var(--color-line);color:var(--color-muted)}
.theme-dark .cal-cell{color:var(--color-ink-soft)}
.theme-dark .cal-cell.has{background:var(--color-primary-soft);color:var(--color-primary-dark)}
.theme-dark .moodrow button{background:var(--color-surface);border-color:var(--color-line-strong);color:var(--color-ink-soft)}
.theme-dark .story-card{background:var(--color-surface);border-color:var(--color-line)}
.theme-dark .story-card .sc-date,.theme-dark .story-card .sc-place{color:var(--color-ink)}
.theme-dark .story-card .sc-meta,.theme-dark .story-card .sc-txt{color:var(--color-ink-soft)}
.theme-dark .story-card .sc-tags span{background:var(--color-primary-soft);color:var(--color-primary-dark)}
.theme-dark .provcard,.theme-dark .review-card{background:var(--color-surface);border-color:var(--color-line);color:var(--color-ink-soft)}
.theme-dark .provbtn{background:var(--color-surface);border-color:var(--color-line-strong);color:var(--color-primary-dark)}
.theme-dark .provbtn:active{background:var(--color-primary-soft)}
</style>
</head>
<body>
<div id="storyMap"></div>
<div id="storyWrap">
  <div class="story-bar">
    <button class="back" aria-label="返回" onclick="history.length>1?history.back():location.href='settings.html'">←</button>
    <div class="title">旅程叙事</div>
    <select id="tripSel"></select>
  </div>
  <div id="cards"></div>
</div>
<script src="vendor/leaflet/leaflet.js"></script>
<script src="geo.js"></script>
<script src="travel-notes.js"></script>
<script>
/* 滚动叙事地图：滚动卡片，地图跟随飞至对应节点 */
function esc(s){return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
/* GCJ-02 纠偏：与全站一致——默认高德街道瓦片（国内可达、无需代理），数据坐标经 GCJ 纠偏后对齐 */
function _tlat(lng, lat) { return window.Geo._tlat(lng, lat); }
function _tlng(lng, lat) { return window.Geo._tlng(lng, lat); }
function gcj02Of(lat, lng) { return window.Geo.gcj02Of(lat, lng); }
function gxy(lat,lng){ return gcj02Of(lat,lng); }
var GAP=3*24*3600*1000;
var notes=[], trips=[], curTrip='all', cards=[];
var map=L.map('storyMap',{zoomControl:false,attributionControl:true,scrollWheelZoom:false}).setView([35,104],4);
L.control.zoom({position:'bottomleft'}).addTo(map);
/* 高德街道默认（国内可达）；OSM 兜底仅当高德不可用时自动切换 */
var amapStreet=L.tileLayer('https://wprd0{s}.is.autonavi.com/appmaptile?lang=zh_cn&size=1&style=7&x={x}&y={y}&z={z}',{subdomains:'1234',maxZoom:18,attribution:'© 高德地图'}).addTo(map);
var osmLayer=L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:18,attribution:'© OpenStreetMap'});
amapStreet.on('tileerror',function(){
  if(!map.hasLayer(osmLayer)){ try{ amapStreet.remove(); }catch(e){} osmLayer.addTo(map); }
});
var curMarker=null;

function groupTrips(list){
  var sorted=list.slice().sort(function(a,b){return a.ts-b.ts;});
  var out=[];
  sorted.forEach(function(n){
    var last=out[out.length-1];
    if(last && n.ts-last.end<=GAP){ last.notes.push(n); last.end=n.ts; }
    else out.push({start:n.ts,end:n.ts,notes:[n]});
  });
  return out;
}
function renderSel(){
  var sel=document.getElementById('tripSel');
  sel.innerHTML='<option value="all">全部旅程</option>'+trips.map(function(t,i){
    return '<option value="'+i+'">'+(t.notes[0].date||'').slice(0,10)+' ~ '+(t.notes[t.notes.length-1].date||'').slice(0,10)+'（'+t.notes.length+' 篇）</option>';
  }).join('');
}
function render(){
  notes=(window.TravelNotes?TravelNotes.list():[]);
  trips=groupTrips(notes.filter(function(n){return n.lat!=null&&n.lng!=null;}));
  renderSel();
  var list = curTrip==='all' ? trips.reduce(function(a,t){return a.concat(t.notes);},[]) : (trips[+curTrip]?trips[+curTrip].notes:[]);
  cards=list.slice().sort(function(a,b){return a.ts-b.ts;});
  var box=document.getElementById('cards');
  if(!cards.length){ box.innerHTML='<div class="story-empty"><img src="art/empty-memory.svg" alt=""><b>还没有带坐标的游记</b><span>先在地图上记录几篇，<br>这里会把它们讲成一段旅程。</span></div>'; return; }
  box.innerHTML=cards.map(function(n,i){
    var pics=(n.photos&&n.photos.length)?'<div class="sc-pics">'+n.photos.map(function(p){return '<img src="'+esc(p)+'" onerror="this.remove()">';}).join('')+'</div>':'';
    var tags=(n.tags&&n.tags.length)?'<div class="sc-tags">'+n.tags.map(function(t){return '<span>#'+esc(t)+'</span>';}).join('')+'</div>':'';
    return '<div class="story-card" data-i="'+i+'">'
      +'<div class="sc-date">'+esc(n.date||'')+'</div>'
      +'<div class="sc-place">'+esc(n.title||n.siteName||'未命名')+'</div>'
      +'<div class="sc-meta">'+esc(n.siteName||'')+(n.weather?' · '+esc(n.weather):'')+'</div>'
      +'<div class="sc-txt">'+esc(n.text||n.raw)+'</div>'+pics+tags+'</div>';
  }).join('');
  fitBounds();
  setActive(0);
}
function fitBounds(){
  var pts=cards.map(function(n){var p=gxy(n.lat,n.lng);return [p[0],p[1]];});
  if(pts.length) map.fitBounds(pts,{padding:[30,30]});
}
function setActive(i){
  var els=document.querySelectorAll('.story-card');
  els.forEach(function(e){e.classList.remove('active');});
  if(els[i]) els[i].classList.add('active');
  var n=cards[i]; if(!n) return;
  if(curMarker) map.removeLayer(curMarker);
  var _p=gxy(n.lat,n.lng);
  curMarker=L.marker(_p,{icon:L.divIcon({className:'',html:'<div style="width:16px;height:16px;border-radius:50%;background:#C86D4B;border:3px solid #fff;box-shadow:0 2px 8px rgba(0,0,0,.3)"></div>',iconSize:[16,16],iconAnchor:[8,8]})}).addTo(map);
  map.flyTo(_p,Math.max(map.getZoom(),10),{duration:.7});
}
/* scroll-spy：以卡片相对视口中位判断激活 */
var _spyTimer=null;
function onScroll(){
  if(_spyTimer) return;
  _spyTimer=setTimeout(function(){
    _spyTimer=null;
    var els=document.querySelectorAll('.story-card');
    var best=-1,bestD=1e9;
    var mid=window.innerHeight*0.55;
    els.forEach(function(e,i){
      var r=e.getBoundingClientRect();
      var d=Math.abs((r.top+r.height/2)-mid);
      if(d<bestD){bestD=d;best=i;}
    });
    if(best>=0 && best!==lastActive){ lastActive=best; setActive(best); }
  },120);
}
var lastActive=-1;
window.addEventListener('scroll',onScroll,{passive:true});
document.getElementById('tripSel').onchange=function(){ curTrip=this.value; lastActive=-1; render(); };
window.TravelNotes._onReady=render;
window.TravelNotes._afterSave=render;
TravelNotes.init({});
setTimeout(function(){ map.invalidateSize(); },300);
</script>
</body>
</html>
