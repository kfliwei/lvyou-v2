function normType(t){
  if(t.includes("彩塑"))return "寺观彩塑";
  if(t.includes("壁画"))return "寺观壁画";
  if(t.includes("长城")||t.includes("关隘")||t.includes("边堡"))return "长城关隘";
  if(t.includes("名城")||t.includes("名镇")||t.includes("名村"))return "名城名镇";
  if(t.includes("楼阁")||t.includes("牌坊"))return "楼阁牌坊";
  if(t.includes("衙署")||t.includes("民居"))return "衙署民居";
  if(t.includes("戏台"))return "古戏台";
  if(t.includes("塔"))return "古塔";
  if(t.includes("石窟"))return "石窟寺";
  if(t.includes("陵")||t.includes("墓"))return "陵寝墓葬";
  if(t.includes("道观"))return "道观";
  if(t.includes("神祠"))return "神祠";
  return "佛寺";
}

const map = L.map('map',{scrollWheelZoom:true}).setView([37.4,112.0],7);
// 高德街道瓦片（国内可达、无需代理）+ tileerror 兜底 OSM
const _amap = L.tileLayer('https://wprd0{s}.is.autonavi.com/appmaptile?lang=zh_cn&size=1&style=7&x={x}&y={y}&z={z}',{subdomains:'1234',maxZoom:18,attribution:'© 高德地图'}).addTo(map);
const _osm = L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,attribution:'© OpenStreetMap'});
_amap.on('tileerror', function () { if (!map.hasLayer(_osm)) { try { _amap.remove(); } catch (e) {} _osm.addTo(map); } });

const markers = {};
let state = {q:'', dy:new Set(), ty:new Set(), city:'', dist:''};
let userPos = null;

const dynIdx = x => { const i=DYN_ORDER.indexOf(x); return i<0?999:i; };
const dyList = [...new Set(DATA.map(d=>d.dy))].sort((a,b)=>dynIdx(a)-dynIdx(b));
const tyList = [...new Set(DATA.map(d=>normType(d.ty)))];
const cityList = [...new Set(DATA.map(d=>d.city))];

document.getElementById('stats').innerHTML =
  `<div><b>${DATA.length}</b>处古建（精选扩充）</div>`+
  `<div><b>${dyList.length}</b>个朝代</div>`+
  `<div><b>${tyList.length}</b>种类型</div>`+
  `<div><b>${cityList.length}</b>个地级市</div>`;

const dynF = document.getElementById('dynFilter');
dyList.forEach(d=>{
  const b=document.createElement('span');b.className='chip';b.textContent=d;
  b.style.borderColor=DYN[d]||'#ccc';
  b.onclick=()=>{state.dy.has(d)?state.dy.delete(d):state.dy.add(d);b.classList.toggle('on');render();};
  dynF.appendChild(b);
});
const typF = document.getElementById('typeFilter');
tyList.forEach(t=>{
  const b=document.createElement('span');b.className='chip';
  b.textContent=(TYP[t]||'')+' '+t;
  b.onclick=()=>{state.ty.has(t)?state.ty.delete(t):state.ty.add(t);b.classList.toggle('on');render();};
  typF.appendChild(b);
});
const citySel=document.getElementById('cityFilter');
cityList.forEach(c=>{const o=document.createElement('option');o.value=c;o.textContent=c;citySel.appendChild(o);});
citySel.onchange=()=>{state.city=citySel.value;render();};

const distSel=document.getElementById('distFilter');
distSel.innerHTML='<option value="">距离排序：关</option>';
cityList.forEach(c=>{const o=document.createElement('option');o.value=c;o.textContent='距 '+c+' 中心';distSel.appendChild(o);});
const geoOpt=document.createElement('option');geoOpt.value='__geo__';geoOpt.textContent='距我的位置（GPS）';distSel.appendChild(geoOpt);
distSel.onchange=()=>{state.dist=distSel.value; if(state.dist==='__geo__'){getGeo();} else {render();}};

document.getElementById('search').addEventListener('input',e=>{state.q=e.target.value.trim();render();});

document.getElementById('legend').innerHTML = dyList.map(d=>
  `<span><i class="dot" style="background:${DYN[d]}"></i>${d}</span>`).join('');

function haversine(a,b,c,d){
  const R=6371,toR=x=>x*Math.PI/180;
  const dLat=toR(c-a),dLng=toR(d-b);
  const s=Math.sin(dLat/2)**2+Math.cos(toR(a))*Math.cos(toR(c))*Math.sin(dLng/2)**2;
  return Math.round(R*2*Math.atan2(Math.sqrt(s),Math.sqrt(1-s)));
}
function getGeo(){
  if(!navigator.geolocation){render();return;}
  navigator.geolocation.getCurrentPosition(p=>{userPos=[p.coords.latitude,p.coords.longitude];render();},
    ()=>{alert('无法获取定位，已按城市中心排序');render();},{timeout:8000});
}

function match(d){
  if(state.city && d.city!==state.city) return false;
  if(state.dy.size && !state.dy.has(d.dy)) return false;
  const nt=normType(d.ty);
  if(state.ty.size && !state.ty.has(nt)) return false;
  if(state.q){
    const hay=(d.name+d.county+d.city+d.dy+d.ty+d.desc).toLowerCase();
    if(!hay.includes(state.q.toLowerCase())) return false;
  }
  return true;
}

// 维基图片懒加载
const io = ('IntersectionObserver' in window) ? new IntersectionObserver((es)=>{
  es.forEach(e=>{ if(e.isIntersecting){ loadPhoto(e.target.dataset.name, e.target); io.unobserve(e.target);} });
},{rootMargin:'200px'}) : null;

function loadPhoto(name, card){
  const img=card.querySelector('.photo'); const ph=card.querySelector('.ph');
  const url='https://zh.wikipedia.org/api/rest_v1/page/summary/'+encodeURIComponent(name);
  fetch(url).then(r=>r.ok?r.json():Promise.reject()).then(j=>{
    const t=j.thumbnail&&j.thumbnail.source;
    if(t){ img.src=t; img.style.display='block'; ph.style.display='none'; }
  }).catch(()=>{});
}

function makeCard(d){
  const nt=normType(d.ty);
  const card=document.createElement('div');card.className='card';
  card.style.borderLeftColor=DYN[d.dy]||'#999';
  let km='';
  if(state.dist && d._km!=null) km=`<span class="badge km">${d._km} km</span>`;
  card.innerHTML=`<div class="thumb">
      <div class="ph" style="background:${DYN[d.dy]||'#999'}">${TYP[nt]||'🏛️'}</div>
      <img class="photo" alt="${d.name}">
    </div>
    <div class="body">
      <h3><span class="ic">${TYP[nt]||'🏛️'}</span>${d.name}</h3>
      <div class="badges">
        <span class="badge dy" style="background:${DYN[d.dy]}">${d.dy}</span>
        <span class="badge ty">${nt}</span>
        <span class="badge">${d.city}·${d.county}</span>${km}
      </div>
      <p class="desc">${d.desc}</p>
    </div>`;
  card.dataset.name=d.name;
  card.onclick=()=>focusSite(d);
  if(io) io.observe(card); else loadPhoto(d.name, card);
  d._el=card;
  return card;
}

function render(){
  let list=DATA.filter(match);
  if(state.dist){
    let origin=null;
    if(state.dist==='__geo__' && userPos) origin=userPos;
    else if(state.dist!=='__geo__'){
      // 城市中心近似：取该市第一个点的经纬度
      const ref=DATA.find(d=>d.city===state.dist);
      if(ref) origin=[ref.lat,ref.lng];
    }
    if(origin){
      list.forEach(d=>{ d._km=haversine(origin[0],origin[1],d.lat,d.lng); });
      list.sort((a,b)=>a._km-b._km);
    }
  }
  document.getElementById('count').textContent=`共 ${list.length} 处`+(state.dist?'（按距离排序）':'');
  const box=document.getElementById('list');box.innerHTML='';
  Object.values(markers).forEach(m=>map.removeLayer(m));for(const k in markers)delete markers[k];
  list.forEach(d=>{
    const card=makeCard(d);
    box.appendChild(card);
    const m=L.marker([d.lat,d.lng]).addTo(map)
      .bindPopup(`<b>${d.name}</b><br>${d.dy} · ${normType(d.ty)}<br>${d.city}${d.county}`);
    m.on('click',()=>highlight(d));
    markers[d.name]=m;
  });
  if(list.length===1) focusSite(list[0]);
}
function focusSite(d){
  map.flyTo([d.lat,d.lng],12,{duration:.8});
  const m=markers[d.name]; if(m) setTimeout(()=>m.openPopup(),400);
  highlight(d);
}
function highlight(d){
  document.querySelectorAll('.card').forEach(c=>c.classList.remove('active'));
  if(d._el){d._el.classList.add('active');d._el.scrollIntoView({behavior:'smooth',block:'center'});}
}

// 时间轴
function renderTimeline(){
  const box=document.getElementById('tlContent');box.innerHTML='';
  dyList.forEach(era=>{
    const items=DATA.filter(d=>d.dy===era);
    if(!items.length) return;
    const sec=document.createElement('div');
    sec.innerHTML=`<div class="tl-era" style="background:${DYN[era]}">${era}<small>${items.length} 处</small></div>`;
    const grid=document.createElement('div');grid.className='tl-grid';
    items.forEach(d=>{
      const nt=normType(d.ty);
      const c=document.createElement('div');c.className='tl-card';c.style.borderTopColor=DYN[era];
      c.innerHTML=`<b>${d.name}</b><div class="m">${nt} · ${d.city}·${d.county}</div>`;
      c.onclick=()=>{switchView('explore'); setTimeout(()=>focusSite(d),100);};
      grid.appendChild(c);
    });
    sec.appendChild(grid);box.appendChild(sec);
  });
}

// 路线
const ROUTES=[
  {title:"① 晋北古建朝圣线（大同—朔州—忻州，2–3天）",meta:"早期木构 + 辽金巨刹 + 唐代双璧",
   steps:["大同：云冈石窟 → 华严寺 → 善化寺 → 九龙壁 → 大同古城墙","浑源：悬空寺 → 永安寺 → 圆觉寺塔","应县：应县木塔 → 净土寺","五台：佛光寺 → 南禅寺 → 显通寺 → 塔院寺（大白塔）"],
   note:"这是'中国古建第一课'。佛光寺、南禅寺是中国仅存的四座半唐代木构中的两座；应县木塔是世界最高木塔。建议租车或包车，五台周边山路多。"},
  {title:"② 晋中大院与平遥线（太原—晋中，2天）",meta:"明清县城 + 五代彩塑 + 晋商豪宅",
   steps:["太原：晋祠（圣母殿）→ 永祚寺双塔 → 纯阳宫 → 龙山石窟","平遥：平遥古城 → 镇国寺（五代）→ 双林寺（彩塑）","祁县 / 太谷：乔家大院 → 渠家大院 → 曹家大院（三多堂）"],
   note:"镇国寺万佛殿是五代北汉遗构（全国仅三座五代木构之一），双林寺2000余尊彩塑堪称'东方彩塑宝库'。平遥可住一晚看夜景。"},
  {title:"③ 晋南唐构与壁画线（运城—临汾，2–3天）",meta:"元代壁画巅峰 + 唐代小木构 + 琉璃宝塔",
   steps:["芮城：永乐宫（朝元图）→ 广仁王庙（唐构）","万荣：飞云楼 → 后土祠（秋风楼）","新绛：龙兴寺 → 福胜寺 → 绛州大堂 → 稷益庙","洪洞：广胜寺（飞虹塔 + 水神庙壁画）"],
   note:"永乐宫《朝元图》是元代壁画巅峰；广仁王庙是唐构之一；广胜寺飞虹塔为'中国第一琉璃塔'。运城—临汾间高铁+租车灵活。"},
  {title:"④ 晋东南彩塑与早期木构线（长治—晋城，3天）",meta:"宋塑之冠 + 二十八宿 + 明代悬塑 + 古堡群",
   steps:["长治/平顺：龙门寺（七朝木构）→ 大云院（五代壁画）→ 天台庵 → 原起寺 → 崇庆寺 → 法兴寺","晋城/高平：玉皇庙（二十八宿）→ 青莲寺 → 开化寺（宋壁画）→ 铁佛寺 → 定林寺 → 崇明寺","陵川/阳城：西溪二仙庙 → 崔府君庙 → 湘峪古堡 → 郭峪古城 → 皇城相府 → 砥洎城"],
   note:"晋东南是中国早期木构最密集区，长治、晋城两线各花1.5天。玉皇庙二十八宿、铁佛寺二十四诸天、隰县小西天（临汾，可并入③）都是《黑神话》取景地。"}
];
document.getElementById('routeList').innerHTML = ROUTES.map(r=>
  `<div class="route"><h3>${r.title}</h3><div class="meta">${r.meta}</div>
   <ol>${r.steps.map(s=>`<li>${s}</li>`).join('')}</ol>
   <div class="note">💡 ${r.note}</div></div>`).join('');

// tabs
function switchView(v){
  document.querySelectorAll('.tab').forEach(x=>x.classList.remove('on'));
  document.querySelector(`.tab[data-view="${v}"]`).classList.add('on');
  document.getElementById('explore').classList.toggle('hidden',v!=='explore');
  document.getElementById('timeline').classList.toggle('hidden',v!=='timeline');
  document.getElementById('routes').classList.toggle('hidden',v!=='routes');
  if(v==='explore') setTimeout(()=>map.invalidateSize(),50);
  if(v==='timeline') renderTimeline();
}
document.querySelectorAll('.tab').forEach(t=>t.onclick=()=>switchView(t.dataset.view));

document.getElementById('footer').innerHTML=
  '数据说明：本指南按《山西古建筑地图》（田芳、李博，山西科学技术出版社，2021）框架大幅扩充，收录全省 11 市国保级古建<b>精选约 '+DATA.length+' 处</b>'+
  '（山西国保古建筑实际共 421 处、含古建类的国保 531 处中的主体）。原书 449 处国保古建的完整逐条清单请以纸质书为准。'+
  '朝代含少量史前/春秋/汉/隋/新石器遗址类条目以便成体系。照片来自维基共享资源（中文维基条目摘要图），自动加载，未命中则显示类型占位图。'+
  '坐标为概览级（多数取市/县中心或已知点位），实地探访请以官方导航与开放信息为准。';

render();
