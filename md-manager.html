<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>MD 库 · 行迹</title>
<link rel="stylesheet" href="design.css">
<link rel="manifest" href="manifest.webmanifest">
<script src="theme.js"></script>
<style>
  html,body{height:100%;margin:0;font-family:var(--font-sans);background:var(--color-bg);color:var(--color-ink)}
  .page{max-width:560px;margin:0 auto;min-height:100dvh;padding-bottom:60px}
  .content{padding:16px 16px 40px}
  /* 统计条 */
  .stats{display:flex;gap:0;margin:2px 0 14px;background:var(--color-surface);border:1px solid var(--color-line);border-radius:18px;box-shadow:var(--shadow-soft);overflow:hidden}
  .stats div{flex:1;text-align:center;padding:12px 2px}
  .stats b{display:block;font-family:var(--font-serif);font-size:20px;font-weight:400;color:var(--color-ink)}
  .stats span{font-size:10.5px;color:var(--color-muted);letter-spacing:.06em}
  /* 搜索 */
  .search-bar{display:flex;align-items:center;gap:10px;height:46px;padding:0 14px;border:1px solid var(--color-line);border-radius:14px;background:var(--color-surface);margin-bottom:12px}
  .search-bar input{flex:1;min-width:0;border:0;outline:0;background:transparent;font-size:14px;color:var(--color-ink);font-family:var(--font-sans)}
  .search-bar input::placeholder{color:var(--color-faint)}
  .search-bar svg{flex:0 0 auto;color:var(--color-muted)}
  /* 标签筛选 */
  .chips{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
  .chips button{padding:6px 14px;border:1px solid var(--color-line-strong);border-radius:999px;background:var(--color-surface);color:var(--color-ink-soft);font-size:12px;cursor:pointer;font-family:var(--font-sans)}
  .chips button.on{background:var(--color-primary);border-color:var(--color-primary);color:#fff;font-weight:600;box-shadow:0 3px 12px rgba(200,109,75,.22)}
  /* 月份分组 */
  .month{display:flex;align-items:baseline;gap:10px;margin:20px 2px 10px}
  .month:first-child{margin-top:2px}
  .month b{font-family:var(--font-serif);font-size:17px;font-weight:400;color:var(--color-ink)}
  .month span{font-size:11px;color:var(--color-muted);letter-spacing:.04em}
  .month::after{content:"";flex:1;height:1px;background:var(--color-line)}
  /* 列表项（杂志式卡片） */
  .md-item{display:block;width:100%;text-align:left;background:var(--color-surface);border:1px solid var(--color-line);border-radius:18px;box-shadow:var(--shadow-soft);padding:16px 16px 14px;margin-bottom:12px;cursor:pointer;box-sizing:border-box;transition:transform var(--duration-fast) var(--ease-standard)}
  .md-item:active{transform:scale(.985)}
  .md-item h3{margin:0;font-family:var(--font-serif);font-size:19px;font-weight:400;line-height:1.35;color:var(--color-ink)}
  .md-item .loc{margin-top:5px;font-size:11.5px;color:var(--color-muted);letter-spacing:.05em}
  .md-item .meta{display:flex;align-items:center;gap:10px;margin-top:9px;font-size:11.5px;color:var(--color-ink-soft)}
  .md-item .meta .dot{width:3px;height:3px;border-radius:50%;background:var(--color-faint)}
  .md-item .tags{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
  .md-item .tags span{font-size:11px;color:var(--color-primary-dark);background:var(--color-primary-soft);padding:2px 9px;border-radius:999px}
  .md-item .foot{margin-top:10px;font-size:12px;color:var(--color-primary-dark);letter-spacing:.03em}
  .md-item .thumbs{display:flex;gap:6px;margin-top:11px;overflow:hidden}
  .md-item .thumbs img{width:46px;height:46px;object-fit:cover;border-radius:10px;flex:0 0 auto}
  /* 空态 */
  .empty{text-align:center;padding:56px 20px}
  .empty .em{font-family:var(--font-serif);font-size:52px;color:var(--color-faint);line-height:1}
  .empty .em img{width:210px;height:auto;max-width:70vw;display:block;margin:0 auto}
  .empty b{display:block;margin-top:16px;font-family:var(--font-serif);font-size:19px;font-weight:400;color:var(--color-ink)}
  .empty span{display:block;margin-top:8px;font-size:13px;color:var(--color-muted);line-height:1.8}
  /* 底部操作 */
  .footbar{position:fixed;left:50%;transform:translateX(-50%);bottom:14px;width:min(calc(100% - 28px),528px);z-index:90;display:flex;gap:10px}
  .footbar .btn-primary,.footbar .btn-secondary{flex:1;min-height:48px;border-radius:999px;font-size:14px;font-family:var(--font-sans)}
  .footbar .btn-primary{box-shadow:0 10px 28px rgba(200,109,75,.3)}
  body{padding-bottom:90px}
  /* ---------- 详情视图 ---------- */
  .detail-bar{position:sticky;top:0;z-index:90;background:rgba(250,248,243,.94);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);border-bottom:1px solid rgba(32,32,29,.06);padding:calc(env(safe-area-inset-top,0px)+8px) 14px 10px}
  .article{padding:22px 20px 30px}
  .article h1.art-title{margin:0;font-family:var(--font-serif);font-size:27px;font-weight:400;line-height:1.35;color:var(--color-ink);letter-spacing:-.01em}
  .article .art-meta{margin-top:10px;font-size:12px;color:var(--color-muted);letter-spacing:.04em}
  /* frontmatter 属性卡 */
  .fm-card{margin-top:18px;background:var(--color-bg-soft);border:1px solid var(--color-line);border-radius:16px;padding:14px 16px;display:grid;grid-template-columns:auto 1fr;gap:7px 14px}
  .fm-card dt{font-size:11px;color:var(--color-muted);letter-spacing:.08em;padding-top:2px}
  .fm-card dd{margin:0;font-size:13px;color:var(--color-ink);line-height:1.5}
  .fm-card .tags-r{display:inline-flex;gap:6px;flex-wrap:wrap}
  .fm-card .tags-r span{font-size:11px;color:var(--color-primary-dark);background:var(--color-primary-soft);padding:2px 9px;border-radius:999px}
  /* 正文渲染 */
  .md-body{margin-top:22px;font-family:var(--font-serif);font-size:15.5px;line-height:1.95;color:var(--color-ink-soft)}
  .md-body h1,.md-body h2{font-size:20px;font-weight:400;color:var(--color-ink);margin:26px 0 10px}
  .md-body h3{font-size:16.5px;font-weight:400;color:var(--color-ink);margin:22px 0 8px}
  .md-body p{margin:0 0 14px}
  .md-body p.gap{height:4px;margin:0}
  .md-body b{font-weight:600;color:var(--color-ink)}
  .md-body blockquote{margin:14px 0;padding:10px 14px;border-left:2.5px solid var(--color-primary);background:var(--color-bg-soft);border-radius:0 10px 10px 0;color:var(--color-ink-soft);font-size:14.5px}
  .md-body ul{margin:0 0 14px;padding-left:20px}
  .md-body li{margin-bottom:6px}
  .md-body img{max-width:100%;border-radius:12px;display:block;margin:14px 0}
  .md-body a{color:var(--color-primary-dark)}
  .md-body code{font-family:ui-monospace,SFMono-Regular,Consolas,monospace;font-size:13px;background:var(--color-bg-soft);padding:2px 6px;border-radius:6px;color:var(--color-primary-dark)}
  .md-body audio{width:100%;margin:14px 0;height:44px}
  /* 照片墙 */
  .photo-wall{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:20px}
  .photo-wall img{width:100%;aspect-ratio:1;object-fit:cover;border-radius:12px;cursor:pointer}
  /* 源码视图 */
  .src-box{margin-top:18px;background:#23231f;border-radius:14px;padding:16px;overflow-x:auto}
  .src-box pre{margin:0;font-family:ui-monospace,SFMono-Regular,Consolas,monospace;font-size:12px;line-height:1.7;color:#e8e5dc;white-space:pre-wrap;word-break:break-word}
  /* 照片放大 */
  .zoom-mask{position:fixed;inset:0;background:rgba(20,20,18,.94);z-index:9800;display:flex;align-items:center;justify-content:center;animation:znIn .25s var(--ease-standard)}
  .zoom-mask img{max-width:94vw;max-height:88vh;border-radius:10px;object-fit:contain}
  @keyframes znIn{from{opacity:0}to{opacity:1}}
  /* 详情操作条 */
  .detail-acts{display:flex;gap:10px;margin-top:24px;padding-bottom:20px}
  .detail-acts button{flex:1;min-height:46px;border-radius:999px;font-size:13.5px;font-family:var(--font-sans);cursor:pointer}
  .d-copy{background:var(--color-surface);border:1px solid var(--color-line-strong);color:var(--color-ink-soft)}
  .d-exp{background:var(--color-primary);border:0;color:#fff;font-weight:600;box-shadow:0 8px 22px rgba(200,109,75,.26)}
  .d-del{background:transparent;border:1px solid var(--color-line-strong);color:var(--color-primary-dark)}
  .d-src{background:var(--color-ink);border:0;color:#fff}
  .theme-dark .d-src{background:var(--color-primary);color:#fff}
  .art-edit{width:100%;min-height:44px;border:1px solid var(--color-line);border-radius:12px;padding:0 14px;font-size:14px;background:var(--color-bg-soft);color:var(--color-ink);outline:0;box-sizing:border-box;font-family:var(--font-sans);margin-top:18px}
  .art-edit:focus{border-color:var(--color-primary)}
  textarea.art-edit{min-height:120px;padding:12px 14px;line-height:1.7;resize:vertical}
  .ed-save{margin-top:10px;width:100%;min-height:46px;border-radius:999px;background:var(--color-primary);border:0;color:#fff;font-size:14px;font-weight:600;font-family:var(--font-sans);cursor:pointer}
  /* 编辑徽标 */
  .edit-chip{margin-top:14px;display:inline-flex;align-items:center;gap:6px;font-size:12px;color:var(--color-muted);background:var(--color-bg-soft);border:1px dashed var(--color-line-strong);padding:6px 12px;border-radius:999px;cursor:pointer}
  .edit-chip:active{background:var(--color-primary-soft)}
  .hide{display:none!important}
</style>
</head>
<body>
<div class="page">

  <!-- ============ 列表视图 ============ -->
  <header class="topbar" id="barList">
    <div class="t-row">
      <button class="back" aria-label="返回" onclick="history.length>1?history.back():location.href='settings.html'">←</button>
      <div class="title">MD 库 <small id="statLabel"></small></div>
    </div>
  </header>

  <div class="content" id="viewList">
    <div class="stats">
      <div><b id="stCount">0</b><span>篇游记</span></div>
      <div><b id="stLoc">0</b><span>地点</span></div>
      <div><b id="stPhoto">0</b><span>照片</span></div>
      <div><b id="stWords">0</b><span>字数</span></div>
    </div>

    <div class="search-bar">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="11" cy="11" r="7"/><path d="M20 20 L16.5 16.5" stroke-linecap="round"/></svg>
      <input id="inSearch" type="search" placeholder="搜索标题 / 地点 / 正文 / 标签" autocomplete="off">
    </div>
    <div class="chips" id="chipsTag"></div>
    <div id="listBody"></div>
  </div>

  <!-- ============ 详情视图 ============ -->
  <div id="viewDetail" class="hide">
    <div class="detail-bar">
      <div class="t-row">
        <button class="back" aria-label="返回列表" onclick="goList()">←</button>
        <div class="title" id="dTitle">游记</div>
        <button class="back" aria-label="切换源码" onclick="toggleSrc()" style="font-size:12px;letter-spacing:.05em" id="btnSrc">源码</button>
      </div>
    </div>
    <div class="article" id="artBox"></div>
  </div>

  <!-- 底部操作（列表） -->
  <div class="footbar" id="footList">
    <button class="btn-secondary" onclick="importMd()">导入 MD 文件</button>
    <button class="btn-secondary" onclick="openExternalList()" id="btnExt">外部 MD</button>
    <button class="btn-primary" onclick="exportAll()">导出整库</button>
  </div>
  <input type="file" id="fileMd" accept=".md,.markdown,.txt" multiple style="display:none">

  <!-- 底部操作（详情） -->
  <div class="footbar hide" id="footDetail">
    <button class="btn-primary" onclick="exportOne()">导出这篇</button>
  </div>
</div>

<script src="vault.js"></script>
<script src="ui.js"></script>
<script>
(function () {
  'use strict';
  /* ============================================================
     MD 库管理页：IndexedDB(gujian-notes/notes) 读取全部游记，
     用 Vault.mdFor 实时生成标准 Markdown，支持列表/搜索/筛选/
     详情预览(渲染+源码)/复制/导出/删除/编辑，并可导入本地 .md 浏览。
     ============================================================ */
  var KEY = 'travelNotes';
  var EXT_KEY = 'travelExtMds';   // 外部导入 MD 持久化（刷新后保持）
  var notes = [];          // 全部游记
  var externals = [];      // 导入的外部 MD（仅浏览，不入库）
  var tagFilter = '', kw = '';
  var cur = null;          // 当前详情对象 {note|ext, raw}
  var curSource = 'internal';
  var srcMode = false;

  /* ---------- IDB（与 travel-notes.js 同一库，只读/删除/更新单条） ---------- */
  function openDB(cb) {
    if (!window.indexedDB) { cb(null); return; }
    try {
      var req = indexedDB.open('gujian-notes', 1);
      req.onsuccess = function (e) { cb(e.target.result); };
      req.onerror = function () { cb(null); };
    } catch (e) { cb(null); }
  }
  function loadNotes(cb) {
    openDB(function (db) {
      if (!db) { loadLS(cb); return; }
      try {
        var tx = db.transaction('notes', 'readonly');
        var req = tx.objectStore('notes').getAll();
        req.onsuccess = function () { notes = req.result || []; cb(); };
        req.onerror = function () { loadLS(cb); };
      } catch (e) { loadLS(cb); }
    });
  }
  function loadLS(cb) {
    try { notes = JSON.parse(localStorage.getItem(KEY) || '[]'); } catch (e) { notes = []; }
    cb();
  }
  function delNote(id, cb) {
    openDB(function (db) {
      if (db) {
        try {
          var tx = db.transaction('notes', 'readwrite');
          tx.objectStore('notes').delete(id);
          tx.oncomplete = function () { cb && cb(true); };
          tx.onerror = function () { cb && cb(true); };
        } catch (e) { cb && cb(true); }
      } else cb && cb(true);
    });
    try { // localStorage 兜底同步删
      var arr = JSON.parse(localStorage.getItem(KEY) || '[]');
      arr = arr.filter(function (x) { return x.id !== id; });
      localStorage.setItem(KEY, JSON.stringify(arr));
    } catch (e) {}
  }
  function putNote(n, cb) {
    openDB(function (db) {
      if (db) {
        try {
          var tx = db.transaction('notes', 'readwrite');
          tx.objectStore('notes').put(n);
          tx.oncomplete = function () { cb && cb(); };
          tx.onerror = function () { cb && cb(); };
        } catch (e) { cb && cb(); }
      } else cb && cb();
    });
    try {
      var arr = JSON.parse(localStorage.getItem(KEY) || '[]');
      var hit = arr.filter(function (x) { return x.id === n.id; })[0];
      if (hit) { arr[arr.indexOf(hit)] = n; } else arr.push(n);
      localStorage.setItem(KEY, JSON.stringify(arr));
    } catch (e) {}
  }

  /* ---------- 外部 MD 持久化（刷新后保持） ---------- */
  function saveExt() {
    try { localStorage.setItem(EXT_KEY, JSON.stringify(externals)); }
    catch (e) { toast('外部 MD 存储空间不足，未完整保存'); }
  }
  function loadExt() {
    try { externals = JSON.parse(localStorage.getItem(EXT_KEY) || '[]') || []; }
    catch (e) { externals = []; }
  }
  function updateExtBtn() {
    var b = document.getElementById('btnExt');
    if (b) b.textContent = externals.length ? ('外部 MD (' + externals.length + ')') : '外部 MD';
  }

  /* ---------- 工具 ---------- */
  function esc(s) { return window.UI.esc(s); }
  function escHtml(s) { return esc(s); }
  function pad(n) { return (n < 10 ? '0' : '') + n; }
  function fmtDay(ts) { var d = new Date(ts); return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()); }
  function ymOf(n) { var d = (n.day || (n.date || '').slice(0, 10) || fmtDay(n.ts || Date.now())).slice(0, 7); return d || '未知'; }
  function wordsOf(n) { return String(n.text || n.raw || '').length; }
  function toast(msg) {
    var d = document.createElement('div');
    d.style.cssText = 'position:fixed;top:calc(env(safe-area-inset-top,0px)+14px);left:50%;transform:translateX(-50%);background:rgba(32,32,29,.92);color:#fff;padding:12px 22px;border-radius:999px;font-size:13px;z-index:9999;box-shadow:0 8px 24px rgba(30,30,28,.18);white-space:nowrap;max-width:88vw;overflow:hidden;text-overflow:ellipsis';
    d.textContent = msg; document.body.appendChild(d);
    setTimeout(function () { d.remove(); }, 2200);
  }
  function copyText(t, okMsg) {
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(t).then(function () { toast(okMsg || '已复制'); },
        function () { fallbackCopy(t, okMsg); });
    } else fallbackCopy(t, okMsg);
  }
  function fallbackCopy(t, okMsg) {
    try {
      var ta = document.createElement('textarea');
      ta.value = t; ta.style.position = 'fixed'; ta.style.opacity = '0';
      document.body.appendChild(ta); ta.select();
      document.execCommand('copy'); ta.remove();
      toast(okMsg || '已复制');
    } catch (e) { toast('复制失败，请长按选择复制'); }
  }
  function downloadText(name, content) {
    var a = document.createElement('a');
    a.href = 'data:text/markdown;charset=utf-8,' + encodeURIComponent(content);
    a.download = name;
    document.body.appendChild(a); a.click();
    setTimeout(function () { a.remove(); }, 400);
  }
  function zoomPhoto(src) {
    var m = document.createElement('div');
    m.className = 'zoom-mask';
    var img = document.createElement('img');
    img.src = src;
    m.appendChild(img);
    m.onclick = function () { m.remove(); };
    document.body.appendChild(m);
  }

  /* ---------- Markdown 渲染（轻量，正文来自本库，安全转义） ---------- */
  function mdRender(src) {
    var lines = String(src || '').split('\n');
    var out = [], inList = false;
    lines.forEach(function (line) {
      var t = escHtml(line);
      t = t.replace(/!\[([^\]]*)\]\(([^)]+)\)/g, function (_, alt, s) {
        if (/^audio-/.test(s)) return '';
        if (/^(data:|blob:|https?:|\/)/.test(s)) return '<img src="' + esc(s) + '" alt="' + esc(alt) + '" loading="lazy">';
        return '';
      });
      t = t.replace(/\[([^\]]+)\]\(([^)]+)\)/g, function (_, txt, url) { return '<a href="' + esc2url(url) + '" target="_blank" rel="noopener">' + txt + '</a>'; });
      t = t.replace(/\*\*([^*]+)\*\*/g, '<b>$1</b>').replace(/\*([^*]+)\*/g, '<i>$1</i>').replace(/`([^`]+)`/g, '<code>$1</code>');
      t = t.replace(/#([^\s#]+)/g, function (m, tag) { return '<a class="md-tag">#' + tag + '</a>'; });
      if (/^###\s/.test(t)) { out.push('<h3>' + t.replace(/^###\s/, '') + '</h3>'); }
      else if (/^##\s/.test(t)) { out.push('<h2>' + t.replace(/^##\s/, '') + '</h2>'); }
      else if (/^#\s/.test(t)) { out.push('<h1>' + t.replace(/^#\s/, '') + '</h1>'); }
      else if (/^>\s?/.test(t)) { out.push('<blockquote>' + t.replace(/^>\s?/, '') + '</blockquote>'); }
      else if (/^\s*[-*]\s+/.test(t)) { if (!inList) { out.push('<ul>'); inList = true; } out.push('<li>' + t.replace(/^\s*[-*]\s+/, '') + '</li>'); }
      else {
        if (inList) { out.push('</ul>'); inList = false; }
        if (t.trim() === '') out.push('<p class="gap"></p>');
        else out.push('<p>' + t + '</p>');
      }
    });
    if (inList) out.push('</ul>');
    return out.join('');
  }
  function esc2url(u) { return esc(String(u).replace(/"/g, '%22')); }

  /* ---------- 统计 ---------- */
  function refreshStats() {
    var locs = {}, photos = 0, words = 0;
    notes.forEach(function (n) {
      if (n.lat != null && n.lng != null) locs[n.lat.toFixed(4) + ',' + n.lng.toFixed(4)] = 1;
      else if (n.siteName) locs['s:' + n.siteName] = 1;
      photos += (n.photos || []).length;
      words += wordsOf(n);
    });
    document.getElementById('stCount').textContent = notes.length;
    document.getElementById('stLoc').textContent = Object.keys(locs).length;
    document.getElementById('stPhoto').textContent = photos;
    document.getElementById('stWords').textContent = words.toLocaleString();
    document.getElementById('statLabel').textContent = notes.length ? notes.length + ' 篇' : '';
  }

  /* ---------- 标签筛选 ---------- */
  function renderChips() {
    var tags = {};
    notes.forEach(function (n) { (n.tags || []).forEach(function (t) { tags[t] = 1; }); });
    var box = document.getElementById('chipsTag');
    var arr = Object.keys(tags);
    if (!arr.length) { box.style.display = 'none'; return; }
    box.style.display = 'flex';
    box.innerHTML = '';
    function mk(t, label, on) {
      var b = document.createElement('button');
      b.textContent = label;
      if (on) b.className = 'on';
      b.onclick = function () { tagFilter = tagFilter === t ? '' : t; renderChips(); renderList(); };
      box.appendChild(b);
    }
    mk('', '全部', !tagFilter);
    arr.forEach(function (t) { mk(t, '#' + t, tagFilter === t); });
  }

  /* ---------- 列表 ---------- */
  function renderList() {
    var body = document.getElementById('listBody');
    var kw2 = (document.getElementById('inSearch').value || '').trim().toLowerCase();
    var list = notes.slice().sort(function (a, b) { return (b.ts || 0) - (a.ts || 0); });
    if (kw2) list = list.filter(function (n) {
      return (String(n.title || '') + ' ' + String(n.siteName || '') + ' ' + String(n.text || n.raw || '') + ' ' + (n.tags || []).join(' ')).toLowerCase().indexOf(kw2) >= 0;
    });
    if (tagFilter) list = list.filter(function (n) { return (n.tags || []).indexOf(tagFilter) >= 0; });
    if (!notes.length) {
      body.innerHTML = '<div class="empty"><div class="em"><img src="art/empty-md.svg" alt=""></div><b>还没有游记</b><span>去地图或景点页记录几篇，<br>这里会自动生成 Markdown 库。</span></div>';
      return;
    }
    if (!list.length) {
      body.innerHTML = '<div class="empty"><div class="em"><img src="art/empty-md.svg" alt=""></div><b>没有匹配的游记</b><span>换个关键词或标签试试</span></div>';
      return;
    }
    /* 月份分组 */
    var groups = {};
    list.forEach(function (n) { var ym = ymOf(n); (groups[ym] = groups[ym] || []).push(n); });
    body.innerHTML = '';
    Object.keys(groups).sort().reverse().forEach(function (ym) {
      var g = el('div', 'month', '<b>' + ym.replace('-', ' 年 ') + ' 月</b><span>' + groups[ym].length + ' 篇</span>');
      body.appendChild(g);
      groups[ym].forEach(function (n) {
        body.appendChild(itemFor(n));
      });
    });
  }
  function el(tag, cls, html) { var d = document.createElement(tag); if (cls) d.className = cls; if (html != null) d.innerHTML = html; return d; }
  function itemFor(n) {
    var it = el('div', 'md-item');
    var tags = (n.tags && n.tags.length) ? '<div class="tags">' + n.tags.map(function (t) { return '<span>#' + esc(t) + '</span>'; }).join('') + '</div>' : '';
    var thumbs = (n.photos && n.photos.length) ? '<div class="thumbs">' + n.photos.slice(0, 3).map(function (p) { return '<img src="' + esc(p) + '">'; }).join('') + '</div>' : '';
    it.innerHTML =
      '<h3>' + esc(n.title || n.siteName || '未命名') + '</h3>' +
      (n.siteName && n.siteName !== n.title ? '<div class="loc">' + esc(n.siteName) + '</div>' : '') +
      '<div class="meta"><span>' + esc((n.date || '').slice(0, 10) || '') + '</span><span class="dot"></span><span>' + wordsOf(n) + ' 字</span>' + ((n.photos || []).length ? '<span class="dot"></span><span>' + n.photos.length + ' 张照片</span>' : '') + '</div>' +
      tags + thumbs +
      '<div class="foot">查看 Markdown →</div>';
    it.onclick = function () { openDetail(n); };
    return it;
  }

  /* ---------- 详情 ---------- */
  function openDetail(n) {
    cur = n; curSource = 'internal';
    srcMode = false;
    document.getElementById('btnSrc').textContent = '源码';
    showView('detail');
    renderDetail();
  }
  function renderDetail() {
    var n = cur;
    var box = document.getElementById('artBox');
    var md = (window.Vault && Vault.mdFor) ? Vault.mdFor(n) : '';
    document.getElementById('dTitle').textContent = n.title || n.siteName || '游记';
    if (srcMode) {
      box.innerHTML = '<div class="src-box"><pre>' + esc(md) + '</pre></div>';
      return;
    }
    /* frontmatter 属性卡 */
    var rows = [];
    if (n.date) rows.push(['日期', n.date.slice(0, 10)]);
    if (n.siteName) rows.push(['地点', n.siteName]);
    if (n.weather) rows.push(['天气', n.weather]);
    if (n.style) rows.push(['风格', n.style]);
    if (n.province) rows.push(['省份', n.province]);
    if (n.city) rows.push(['城市', n.city]);
    if (n.lat != null) rows.push(['坐标', n.lat.toFixed(4) + ', ' + n.lng.toFixed(4)]);
    var fmHtml = rows.length ? '<dl class="fm-card">' + rows.map(function (r) {
      return '<dt>' + esc(r[0]) + '</dt><dd>' + esc(r[1]) + '</dd>';
    }).join('') +
      ((n.tags && n.tags.length) ? '<dt>标签</dt><dd><span class="tags-r">' + n.tags.map(function (t) { return '<span>#' + esc(t) + '</span>'; }).join('') + '</span></dd>' : '') +
      '</dl>' : '';
    /* 正文 */
    var bodyHtml = '<div class="md-body">' + mdRender(n.text || n.raw || '*（这篇游记没有文字内容）*') + '</div>';
    /* 原声 */
    var audioHtml = n.audio ? '<audio controls preload="none" src="' + esc(n.audio) + '"></audio>' : '';
    /* 照片墙 */
    var wallHtml = (n.photos && n.photos.length) ? '<div class="photo-wall">' + n.photos.map(function (p) { return '<img src="' + esc(p) + '" onclick="zoomPhoto(this.src)">'; }).join('') + '</div>' : '';
    box.innerHTML =
      '<h1 class="art-title">' + esc(n.title || n.siteName || '未命名') + '</h1>' +
      '<div class="art-meta">' + esc((n.date || '').slice(0, 10) || '') + (n.siteName && n.siteName !== n.title ? ' · ' + esc(n.siteName) : '') + '</div>' +
      fmHtml + bodyHtml + audioHtml + wallHtml +
      '<div class="edit-chip" onclick="toggleEdit()">✎ 编辑这篇游记（改标题/正文/标签）</div>' +
      '<div id="editBox" class="hide">' +
        '<input class="art-edit" id="edTitle" placeholder="标题">' +
        '<textarea class="art-edit" id="edText" placeholder="正文"></textarea>' +
        '<input class="art-edit" id="edTags" placeholder="标签（空格分隔）">' +
        '<button class="ed-save" onclick="saveEdit()">保存修改</button>' +
      '</div>' +
      '<div class="detail-acts">' +
        '<button class="d-copy" onclick="copyCur()">复制 MD</button>' +
        '<button class="d-exp" onclick="exportOne()">导出</button>' +
        '<button class="d-del" onclick="delCur()">删除</button>' +
      '</div>';
  }
  function toggleSrc() {
    srcMode = !srcMode;
    document.getElementById('btnSrc').textContent = srcMode ? '渲染' : '源码';
    renderDetail();
  }
  function goList() {
    if (curSource === 'external' && extMode) { refreshStats2(); renderExtList(); showView('list'); return; }
    showView('list'); renderList();
  }
  function showView(v) {
    var isList = v === 'list';
    document.getElementById('viewList').classList.toggle('hide', !isList);
    document.getElementById('viewDetail').classList.toggle('hide', isList);
    document.getElementById('barList').classList.toggle('hide', !isList);
    document.getElementById('footList').classList.toggle('hide', !isList);
    document.getElementById('footDetail').classList.toggle('hide', isList);
  }

  /* ---------- 详情操作 ---------- */
  function copyCur() {
    if (!cur) return;
    var md = (window.Vault && Vault.mdFor) ? Vault.mdFor(cur) : '';
    copyText(md, '已复制 Markdown');
  }
  function exportOne() {
    if (!cur) return;
    if (window.Vault && Vault.exportOne) { Vault.exportOne(cur); return; }
    var md = (window.Vault && Vault.mdFor) ? Vault.mdFor(cur) : '';
    var base = (cur.title || cur.siteName || '游记').replace(/[\\/:*?"<>|]/g, ' ');
    downloadText(base + '.md', md);
    toast('已下载 ' + base + '.md');
  }
  function delCur() {
    if (!cur) return;
    UI.confirm({ title: '删除游记', text: '确定删除这篇游记？\n' + (cur.title || cur.siteName || ''), okText: '删除', danger: true }, function (ok) {
      if (!ok) return;
      delNote(cur.id, function () {
        notes = notes.filter(function (x) { return x.id !== cur.id; });
        cur = null;
        refreshStats(); renderChips(); goList();
        toast('已删除');
      });
    });
  }
  function toggleEdit() {
    var box = document.getElementById('editBox');
    box.classList.toggle('hide');
    if (!box.classList.contains('hide')) {
      document.getElementById('edTitle').value = cur.title || '';
      document.getElementById('edText').value = cur.text || cur.raw || '';
      document.getElementById('edTags').value = (cur.tags || []).join(' ');
    }
  }
  function saveEdit() {
    if (!cur) return;
    cur.title = document.getElementById('edTitle').value.trim() || cur.siteName || '未命名';
    cur.text = document.getElementById('edText').value.trim();
    cur.tags = document.getElementById('edTags').value.trim().split(/\s+/).filter(Boolean);
    putNote(cur, function () {
      refreshStats(); renderChips();
      renderDetail();
      toast('已保存');
    });
  }

  /* ---------- 导入本地 .md 浏览 ---------- */
  function importMd() { document.getElementById('fileMd').click(); }
  function onFile(e) {
    var files = e.target.files;
    if (!files || !files.length) return;
    var done = 0, total = files.length, added = 0;
    Array.prototype.forEach.call(files, function (f) {
      var r = new FileReader();
      r.onload = function () {
        try {
          var obj = parseExternalMd(f.name, r.result);
          if (obj) { externals.unshift(obj); added++; }
        } catch (err) {}
        done++;
        if (done === total) {
          if (added) { saveExt(); updateExtBtn(); openExternalList(); }
          else toast('没有可识别的 .md 文件');
          e.target.value = '';
        }
      };
      r.readAsText(f, 'utf-8');
    });
  }
  function parseExternalMd(name, text) {
    var fm = {}, body = text, curListKey = null;
    var m = /^---\r?\n([\s\S]*?)\r?\n---\r?\n?/.exec(text);
    if (m) {
      body = text.slice(m[0].length);
      var lines = m[1].split('\n');
      for (var li = 0; li < lines.length; li++) {
        var line = lines[li];
        var mm = /^([A-Za-z\u4e00-\u9fa5_-]+):\s*(.*)$/.exec(line.trim());
        if (mm) {
          var k = mm[1].trim(), v = mm[2].trim().replace(/^"|"$/g, '');
          if (k === 'tags') { fm.tags = v ? v.split(/[\s,，]+/).filter(Boolean) : []; curListKey = 'tags'; }
          else { fm[k] = v; curListKey = null; }
        } else if (curListKey === 'tags') {
          /* YAML 列表项：  - 回程 */
          var tm = /^-\s*(.*)$/.exec(line.trim());
          if (tm && tm[1].trim()) { fm.tags = fm.tags || []; fm.tags.push(tm[1].trim()); }
        } else {
          curListKey = null;
        }
      }
    }
    return {
      id: 'ext_' + Date.now() + '_' + Math.random().toString(36).slice(2, 6),
      title: fm.title || name.replace(/\.md$/i, '').replace(/\.markdown$/i, ''),
      date: fm.date || '',
      siteName: fm.place || fm.location || '',
      text: body.trim(),
      tags: fm.tags || [],
      weather: fm.weather || '', style: fm.style || '',
      province: fm.province || '', city: fm.city || '',
      ext: true, fname: name
    };
  }
  /* 外部 MD 列表（临时覆盖列表区） */
  var extMode = false;
  function openExternalList() {
    extMode = true; tagFilter = ''; kw = '';
    document.getElementById('inSearch').value = '';
    showView('list');
    refreshStats2();
    renderExtList();
  }
  function refreshStats2() {
    var words = 0;
    externals.forEach(function (n) { words += wordsOf(n); });
    document.getElementById('stCount').textContent = externals.length;
    document.getElementById('stLoc').textContent = '—';
    document.getElementById('stPhoto').textContent = '—';
    document.getElementById('stWords').textContent = words.toLocaleString();
    document.getElementById('statLabel').textContent = '外部 ' + externals.length + ' 篇';
    updateExtBtn();
  }
  function renderExtList() {
    var body = document.getElementById('listBody');
    var chips = document.getElementById('chipsTag');
    chips.style.display = 'none';
    var kw2 = (document.getElementById('inSearch').value || '').trim().toLowerCase();
    var list = externals.slice();
    if (kw2) list = list.filter(function (n) { return (String(n.title) + ' ' + String(n.text) + ' ' + (n.tags || []).join(' ')).toLowerCase().indexOf(kw2) >= 0; });
    body.innerHTML = '';
    if (!list.length) {
      body.innerHTML = '<div class="empty"><div class="em"><img src="art/empty-md.svg" alt=""></div><b>没有外部 MD</b><span>点下方「导入 MD 文件」选择<br>本地的 .md 文件来浏览</span></div>';
      return;
    }
    list.forEach(function (n) {
      var it = el('div', 'md-item');
      it.innerHTML = '<h3>' + esc(n.title || '未命名') + '</h3>' +
        '<div class="meta"><span>' + esc(n.fname) + '</span><span class="dot"></span><span>' + wordsOf(n) + ' 字</span></div>' +
        '<div class="foot">浏览外部文件 →</div>';
      it.onclick = function () { openExternalDetail(n); };
      body.appendChild(it);
    });
  }
  function openExternalDetail(n) {
    cur = n; curSource = 'external';
    srcMode = false;
    document.getElementById('btnSrc').textContent = '源码';
    showView('detail');
    var box = document.getElementById('artBox');
    document.getElementById('dTitle').textContent = n.title || '外部文件';
    var rows = [];
    if (n.date) rows.push(['日期', n.date]);
    if (n.siteName) rows.push(['地点', n.siteName]);
    var fmHtml = rows.length ? '<dl class="fm-card">' + rows.map(function (r) { return '<dt>' + esc(r[0]) + '</dt><dd>' + esc(r[1]) + '</dd>'; }).join('') + '</dl>' : '';
    box.innerHTML =
      '<h1 class="art-title">' + esc(n.title || '未命名') + '</h1>' +
      '<div class="art-meta">外部文件 · ' + esc(n.fname) + '</div>' +
      fmHtml +
      '<div class="md-body">' + mdRender(n.text) + '</div>' +
      '<div class="detail-acts">' +
        '<button class="d-copy" onclick="copyCur()">复制 MD</button>' +
        '<button class="d-exp" onclick="expExt()">导出文件</button>' +
        '<button class="d-del" onclick="delExt()">移除</button>' +
      '</div>';
  }
  function expExt() {
    if (!cur || curSource !== 'external') return;
    downloadText(cur.fname || (cur.title + '.md'), window.Vault ? Vault.mdFor(cur) : ('# ' + cur.title + '\n\n' + cur.text));
    toast('已下载 ' + (cur.fname || cur.title + '.md'));
  }
  function delExt() {
    if (!cur || curSource !== 'external') return;
    externals = externals.filter(function (x) { return x.id !== cur.id; });
    cur = null;
    saveExt(); updateExtBtn();
    if (externals.length) { refreshStats2(); renderExtList(); showView('list'); }
    else { extMode = false; refreshStats(); renderChips(); renderList(); showView('list'); }
    toast('已移除');
  }

  /* ---------- 导出整库 ---------- */
  function exportAll() {
    if (!notes.length) { toast('还没有游记可导出'); return; }
    if (window.Vault && Vault.exportVault) Vault.exportVault(notes);
  }

  /* ---------- 事件绑定 ---------- */
  document.getElementById('inSearch').addEventListener('input', function () {
    if (extMode) renderExtList(); else renderList();
  });
  document.getElementById('fileMd').addEventListener('change', onFile);

  /* ---------- 启动 ---------- */
  loadNotes(function () {
    refreshStats();
    renderChips();
    renderList();
  });
  loadExt(); updateExtBtn();

  window.__mdManager = {
    goList: goList, toggleSrc: toggleSrc, copyCur: copyCur, exportOne: exportOne,
    delCur: delCur, toggleEdit: toggleEdit, saveEdit: saveEdit,
    importMd: importMd, expExt: expExt, delExt: delExt, exportAll: exportAll,
    openExternalList: openExternalList,
    zoomPhoto: zoomPhoto
  };
})();
</script>
<script>
  /* 轻量外部引用（详情里的 onclick 走全局） */
  function goList(){ window.__mdManager && __mdManager.goList(); }
  function toggleSrc(){ window.__mdManager && __mdManager.toggleSrc(); }
  function copyCur(){ window.__mdManager && __mdManager.copyCur(); }
  function exportOne(){ window.__mdManager && __mdManager.exportOne(); }
  function delCur(){ window.__mdManager && __mdManager.delCur(); }
  function toggleEdit(){ window.__mdManager && __mdManager.toggleEdit(); }
  function saveEdit(){ window.__mdManager && __mdManager.saveEdit(); }
  function importMd(){ window.__mdManager && __mdManager.importMd(); }
  function openExternalList(){ window.__mdManager && __mdManager.openExternalList(); }
  function expExt(){ window.__mdManager && __mdManager.expExt(); }
  function delExt(){ window.__mdManager && __mdManager.delExt(); }
  function exportAll(){ window.__mdManager && __mdManager.exportAll(); }
  function zoomPhoto(src){ window.__mdManager && __mdManager.zoomPhoto(src); }
</script>
</body>
</html>
