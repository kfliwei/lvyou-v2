<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>想去清单 · 行迹</title>
<link rel="stylesheet" href="design.css">
<link rel="manifest" href="manifest.webmanifest">
<script src="theme.js"></script>
<link rel="stylesheet" href="vendor/leaflet/leaflet.css">
<script src="vendor/leaflet/leaflet.js"></script>
<link rel="stylesheet" href="map.css">
<style>
  html,body{min-height:100%;margin:0;font-family:var(--font-sans);background:var(--color-bg);color:var(--color-ink)}
  .topbar{position:sticky;top:0;z-index:100;background:rgba(250,248,243,.92);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);border-bottom:1px solid rgba(32,32,29,.07);padding:calc(env(safe-area-inset-top,0px)+8px) 14px 10px}
  .t-row{display:flex;align-items:center;gap:8px;height:42px}
  .t-row .back{width:40px;height:40px;border:1px solid var(--color-line);border-radius:50%;background:var(--color-bg-soft);color:var(--color-ink);font-size:15px;display:flex;align-items:center;justify-content:center;flex:0 0 auto;cursor:pointer}
  .t-row .back:active{transform:scale(.92)}
  .t-row .title{flex:1;min-width:0;font-family:var(--font-serif);font-weight:400;font-size:18px;color:var(--color-ink);letter-spacing:.02em}
  .t-row .title small{font-family:var(--font-sans);font-weight:400;font-size:11px;color:var(--color-muted);margin-left:6px;letter-spacing:.06em}
  .wrap{padding:20px 16px 120px;max-width:520px;margin:0 auto}
  .wl-empty{text-align:center;padding:70px 20px;color:var(--color-faint)}
  .wl-empty .em{font-family:var(--font-serif);font-size:22px;color:var(--color-ink-soft);line-height:1.8}
  .wl-empty p{font-size:0.8125rem;margin-top:10px;line-height:1.8}
  .wl-empty a{color:var(--color-primary-dark);font-size:14px;font-weight:600}
  .wl-item{display:flex;align-items:center;gap:12px;padding:16px 4px;border-bottom:1px solid var(--color-line)}
  .wl-item:last-child{border-bottom:0}
  .wl-dot{width:10px;height:10px;border-radius:50%;flex:0 0 auto}
  .wl-main{flex:1;min-width:0}
  .wl-main b{font-family:var(--font-serif);font-size:16.5px;font-weight:400;color:var(--color-ink);display:block}
  .wl-main small{font-size:11.5px;color:var(--color-muted);display:block;margin-top:3px}
  .wl-main .wl-tag{display:inline-block;font-size:10.5px;color:var(--color-primary-dark);background:var(--color-primary-soft);border-radius:999px;padding:1px 8px;margin-top:6px}
  .wl-main .wl-done-tag{background:#ECEFEA;color:var(--color-green)}
  .wl-acts{display:flex;gap:8px;flex:0 0 auto}
  .wl-btn{min-height:36px;padding:0 14px;border-radius:999px;font-size:12.5px;border:1px solid var(--color-line-strong);background:var(--color-surface);color:var(--color-ink-soft);cursor:pointer;white-space:nowrap}
  .wl-btn:active{transform:scale(.95)}
  .wl-btn.primary{background:var(--color-primary);border-color:var(--color-primary);color:#fff;font-weight:600}
  .wl-btn.done{background:#ECEFEA;border-color:transparent;color:var(--color-green)}
  .wl-remove{width:40px;height:40px;border:0;border-radius:50%;background:transparent;color:var(--color-faint);font-size:14px;cursor:pointer;flex:0 0 auto}
  .wl-remove:active{background:var(--color-bg-soft)}
  /* 省分组 */
  .wl-group-head{display:flex;align-items:center;gap:8px;padding:11px 4px 7px;cursor:pointer;user-select:none;-webkit-user-select:none}
  .wl-group:not(:first-child) .wl-group-head{border-top:1px solid var(--color-line)}
  .wl-group-name{font-family:var(--font-serif);font-size:15px;color:var(--color-ink);flex:1}
  .wl-group-cnt{font-size:11px;color:var(--color-muted);background:var(--color-bg-soft);border-radius:999px;padding:2px 10px;flex:0 0 auto}
  .wl-group-arr{color:var(--color-faint);font-size:12px;flex:0 0 auto}
  .wl-mv{width:32px;height:32px;border:1px solid var(--color-line);border-radius:8px;background:var(--color-bg-soft);color:var(--color-muted);font-size:13px;cursor:pointer;flex:0 0 auto;padding:0;line-height:1}
  .theme-dark .topbar{background:rgba(29,28,25,.92)}
  .theme-dark .wl-item{border-bottom-color:var(--color-line)}
  .theme-dark .wl-main b{color:var(--color-ink)}
  .theme-dark .wl-btn{background:var(--color-surface);border-color:var(--color-line-strong);color:var(--color-ink-soft)}
  /* 覆盖 map.css 的全屏地图页 body 锁定（本页为普通滚动页，body 不可被 overflow:hidden 裁剪） */
  html,body{height:auto;min-height:100%}
  body{display:block;overflow:auto}
  /* 顶栏按钮防挤压：固定宽度不收缩，标题区自适应 */
  .t-row .wl-btn{flex:0 0 auto;white-space:nowrap}
</style>
</head>
<body>
<header class="topbar">
  <div class="t-row">
    <button class="back" onclick="history.length>1?history.back():location.href='index.html'" aria-label="返回">←</button>
    <div class="title">想去清单 <small id="cntLabel"></small></div>
    <button class="wl-btn" style="min-height:34px" id="wlMapBtn">地图</button>
    <button class="wl-btn" style="min-height:34px;margin-left:6px" id="wlPlanBtn">规划行程</button>
    <button class="wl-btn" style="min-height:34px;margin-left:6px" onclick="location.href='explore-map.html'">去探索</button>
  </div>
</header>
<div class="wrap">
  <div id="wlMap" style="display:none;height:60vh;height:60dvh;border-radius:18px;overflow:hidden;border:1px solid var(--color-line)"></div>
  <div id="wlPlan" style="display:none"></div>
  <div id="wlBody"></div>
  <div class="wl-empty" id="wlEmpty" style="display:none">
    <div class="em">想去的地方，<br>先记在这里。</div>
    <p>在专题地图或全国地图点开景点详情，<br>点「♡ 想去」就会出现在这里。<br>到了之后一键打卡，直接开始语音游记。</p>
    <a href="explore-map.html">去地图看看 →</a>
  </div>
</div>

<script src="wishlist.js"></script>
<script src="travel-notes.js"></script>
<script src="ui.js"></script>
<script>
(function () {
  var body = document.getElementById('wlBody');
  var empty = document.getElementById('wlEmpty');
  var cnt = document.getElementById('cntLabel');
  function esc(s) { return String(s == null ? '' : s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
  function themeColor(t) {
    var map = { '高原湖泊':'#5F6D76','雪山冰川':'#9C9A92','名山大川':'#71806C','峡谷天堑':'#8A5A44','江河瀑布':'#5F6D76','古建寺院':'#A9563B','古城古镇':'#8A5A44','古城遗址':'#7E7663','红色遗迹':'#C86D4B','民族风情':'#C86D4B','城市地标':'#6D7D88','溶洞奇观':'#8C7B66','森林草原':'#71806C','森林山川':'#71806C','宗教圣地':'#A9563B','遗址陵墓':'#7E7663','温泉康养':'#C86D4B','石窟艺术':'#A9563B','丹霞地貌':'#BA7517','雅丹地貌':'#BA7517','沙漠戈壁':'#BA7517','草原湿地':'#639922','石窟寺':'#A9563B','佛寺':'#A9563B','古塔':'#7E7663','楼阁牌坊':'#8A5A44','名城名镇':'#8A5A44','壁画彩塑':'#C86D4B','关隘长城':'#993C1D','窑洞民居':'#BA7517','庙宇道观':'#A9563B','文庙书院':'#A9563B','陵墓':'#7E7663','桥梁':'#6D7D88','教堂会馆':'#6D7D88' };
    return map[t] || '#B4AFA4';
  }
  function fmt(ts) { var d = new Date(ts); function p(n){return (n<10?'0':'')+n;} return d.getFullYear()+'.'+p(d.getMonth()+1)+'.'+p(d.getDate()); }

  /* ---------- 地图视图 ---------- */
  var map = null, mapOn = false, planLayer = null;
  var DAY_COLORS = ['#C86D4B', '#71806C', '#6D7D88', '#8A6D3B', '#7E7663', '#5F6D76'];
  function initMap() {
    if (map) return;
    map = L.map('wlMap', { zoomControl: false }).setView([34.5, 105], 5);
    L.control.zoom({ position: 'bottomright' }).addTo(map);
    var wlLayer = L.tileLayer('https://wprd0{s}.is.autonavi.com/appmaptile?lang=zh_cn&size=1&style=7&x={x}&y={y}&z={z}', { subdomains: '1234', maxZoom: 18, attribution: '? 高德' }).addTo(map);
    UI.tileWarn(wlLayer, '地图');
    planLayer = L.layerGroup().addTo(map);
  }
  function clearMarkers() {
    map.eachLayer(function (l) { if (l instanceof L.Marker) map.removeLayer(l); });
  }
  function renderMap() {
    var list = window.Wish.list().filter(function (x) { return x.lat != null; });
    initMap();
    map.invalidateSize();
    clearMarkers();
    planLayer.clearLayers();
    if (!list.length) return;
    var bnd = [];
    list.forEach(function (x) {
      var m = L.marker([x.lat, x.lng], {
        icon: L.divIcon({ className: '', html: '<div style="position:relative;width:26px;height:26px"><span style="position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:12px;height:12px;border-radius:50%;background:' + (x.visited ? '#9C9A92' : '#C86D4B') + ';border:2.5px solid #fff;box-shadow:0 2px 8px rgba(0,0,0,.25)"></span>' + (x.visited ? '' : '<span style="position:absolute;right:-2px;top:-2px;width:9px;height:9px;border-radius:50%;background:#FF7A50;border:1.5px solid #fff"></span>') + '</div>', iconSize: [26, 26], iconAnchor: [13, 13] })
      });
      m.bindPopup('<b>' + x.label + '</b><br>' + (x.region || '') + (x.city ? ' · ' + x.city : '') + (x.visited ? '<br><span style="color:#9C9A92">已打卡</span>' : ''));
      map.addLayer(m);
      bnd.push([x.lat, x.lng]);
    });
    if (bnd.length > 1) map.fitBounds(bnd, { padding: [40, 40] });
    else if (bnd.length === 1) map.setView(bnd[0], 9);
  }
  /* 行程计划地图：每日同色标记 + 路线连线 */
  function renderPlanMap() {
    var days = window.__planDays || [];
    if (!days.length) return;
    var box = document.getElementById('wlMap');
    box.style.display = 'block';   /* 先显示容器，再初始化/计算尺寸（否则 Leaflet 按 0 尺寸 fitBounds，标记全在视野外） */
    initMap();
    map.invalidateSize();
    clearMarkers();
    planLayer.clearLayers();
    mapOn = true;
    document.getElementById('wlMapBtn').textContent = '列表';
    var bnd = [];
    days.forEach(function (d, di) {
      var col = DAY_COLORS[di % DAY_COLORS.length];
      var pts = [];
      d.forEach(function (s, i) {
        if (s.lat == null) return;
        var m = L.marker([s.lat, s.lng], {
          icon: L.divIcon({ className: '', html: '<div style="position:relative;width:28px;height:28px"><span style="position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);min-width:20px;height:20px;line-height:20px;text-align:center;border-radius:10px;background:' + col + ';color:#fff;font-size:11px;font-weight:700;border:2px solid #fff;box-shadow:0 2px 6px rgba(0,0,0,.3)">' + (i + 1) + '</span></div>', iconSize: [28, 28], iconAnchor: [14, 14] })
        });
        m.bindPopup('<b>D' + (di + 1) + ' · ' + esc(s.label) + '</b><br>' + esc(s.region || ''));
        planLayer.addLayer(m);
        pts.push([s.lat, s.lng]);
        bnd.push([s.lat, s.lng]);
      });
      if (pts.length > 1) planLayer.addLayer(L.polyline(pts, { color: col, weight: 3, opacity: .85 }));
    });
    if (bnd.length > 1) map.fitBounds(bnd, { padding: [40, 40] });
    else if (bnd.length === 1) map.setView(bnd[0], 9);
  }

  /* ---------- 跨专题行程规划（贪心：每天 ≤6 站、单日 ≤260km）---------- */
  function havKm(aLat, aLng, bLat, bLng) {
    var R = 6371, r = Math.PI / 180;
    var dLa = (bLat - aLat) * r, dLo = (bLng - aLng) * r;
    var a = Math.sin(dLa / 2) * Math.sin(dLa / 2) + Math.cos(aLat * r) * Math.cos(bLat * r) * Math.sin(dLo / 2) * Math.sin(dLo / 2);
    return 2 * R * Math.asin(Math.min(1, Math.sqrt(a)));
  }
  function planTrip() {
    var list = window.Wish.list().filter(function (x) { return !x.visited && x.lat != null; });
    var box = document.getElementById('wlPlan');
    if (list.length < 2) { UI.toast('至少需要 2 个未打卡的心愿节点才能规划行程'); return; }
    var maxPerDay = parseInt(document.getElementById('planStations') ? document.getElementById('planStations').value : '6', 10) || 6;
    var maxKm = parseInt(document.getElementById('planKm') ? document.getElementById('planKm').value : '260', 10) || 260;
    /* 最近邻贪心分日 */
    var pts = list.map(function (x) { return x; });
    var days = [], cur = null, dayDist = 0;
    while (pts.length) {
      var idx = 0, bestD = 1e12;
      for (var k = 0; k < pts.length; k++) {
        var d = cur ? havKm(cur.lat, cur.lng, pts[k].lat, pts[k].lng) : 0;
        if (d < bestD) { bestD = d; idx = k; }
      }
      var next = pts.splice(idx, 1)[0];
      if (!cur) { cur = next; days.push([next]); dayDist = 0; continue; }
      if (days[days.length - 1].length >= maxPerDay || dayDist + bestD > maxKm) { days.push([next]); dayDist = 0; }
      else { days[days.length - 1].push(next); dayDist += bestD; }
      cur = next;
    }
    /* 渲染计划（可调） */
    window.__planDays = days;
    renderPlan(list.length);
    renderPlanMap();
  }
  /* 每天里程：D2+ 含跨天衔接段（上一天终点 → 本天首站） */
  function dayKm(d, prevEnd) {
    var k = 0, last = prevEnd || d[0];
    for (var i = 0; i < d.length; i++) { k += havKm(last.lat, last.lng, d[i].lat, d[i].lng); last = d[i]; }
    return k;
  }
  function renderPlan(total) {
    var box = document.getElementById('wlPlan');
    var days = window.__planDays || [];
    var totalKm = days.reduce(function (s, d, di) { return s + dayKm(d, di > 0 ? days[di - 1][days[di - 1].length - 1] : null); }, 0);
    var html = '<div style="background:var(--color-surface);border:1px solid var(--color-line);border-radius:18px;box-shadow:var(--shadow-soft);padding:16px;margin-bottom:14px">' +
      '<div style="font-family:var(--font-serif);font-size:17px;margin-bottom:4px">行程计划 · ' + days.length + ' 天 / ' + total + ' 站 · 约 ' + Math.round(totalKm) + ' km</div>' +
      '<div style="font-size:12px;color:var(--color-muted);margin-bottom:10px">按地理邻近自动分日，跨天从上一天终点继续；每天可一键导航，可上下调整顺序</div>' +
      '<div style="display:flex;gap:8px;align-items:center;margin-bottom:12px;font-size:12.5px">' +
      '<span style="color:var(--color-muted)">每天</span><input id="planStations" type="number" min="1" max="12" value="6" style="width:52px;height:34px;border:1px solid var(--color-line-strong);border-radius:8px;background:var(--color-surface);color:var(--color-ink);text-align:center;font-size:13px">' +
      '<span style="color:var(--color-muted)">站 · ≤</span><input id="planKm" type="number" min="30" max="800" step="10" value="260" style="width:64px;height:34px;border:1px solid var(--color-line-strong);border-radius:8px;background:var(--color-surface);color:var(--color-ink);text-align:center;font-size:13px">' +
      '<span style="color:var(--color-muted)">km/天</span>' +
      '<button class="wl-btn" style="margin-left:auto" onclick="replan()">重新规划</button></div>';
    days.forEach(function (d, di) {
      var prevEnd = di > 0 ? days[di - 1][days[di - 1].length - 1] : null;
      var km = dayKm(d, prevEnd);
      html += '<div style="border-top:1px solid var(--color-line);padding:8px 0 4px;display:flex;align-items:center;gap:8px">' +
        '<b style="font-family:var(--font-serif);font-weight:400;color:' + DAY_COLORS[di % DAY_COLORS.length] + '">D' + (di + 1) + '</b>' +
        '<span style="font-size:11.5px;color:var(--color-muted);flex:1">' + d.length + ' 站 · 约 ' + Math.round(km) + ' km' + (prevEnd ? '（含衔接段）' : '') + '</span>' +
        '<button class="wl-btn" style="min-height:30px;padding:0 12px;font-size:12px" onclick="navDay(' + di + ')">🚗 导航</button></div>';
      d.forEach(function (s, i) {
        var from = i === 0 ? prevEnd : d[i - 1];
        var seg = from ? Math.round(havKm(from.lat, from.lng, s.lat, s.lng)) : null;
        if (i === 0 && prevEnd) {
          /* 跨天衔接：起点行 = 上一天终点（本天从此出发） */
          html += '<div style="display:flex;gap:8px;align-items:center;padding:4px 0 2px">' +
            '<span style="flex:0 0 20px;text-align:center;color:var(--color-faint);font-size:0.75rem">起</span>' +
            '<span style="flex:1;min-width:0;font-size:0.75rem;color:var(--color-muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis">' + esc(prevEnd.label) + '（D' + di + ' 终点 · 本天出发地）</span>' +
            '<span style="font-size:0.6875rem;color:var(--color-faint);flex:0 0 auto">0km</span></div>';
        }
        html += '<div style="display:flex;gap:8px;align-items:center;padding:5px 0">' +
          '<span style="flex:0 0 20px;text-align:center;color:var(--color-faint);font-size:0.75rem">' + (i + 1) + '</span>' +
          '<span style="flex:1;min-width:0;font-size:0.8438rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">' + esc(s.label) + '</span>' +
          '<span style="font-size:0.6875rem;color:var(--color-muted);flex:0 0 auto">' + esc(s.region || '') + '</span>' +
          (seg != null ? '<span style="font-size:0.6875rem;color:var(--color-faint);flex:0 0 auto">' + seg + 'km</span>' : '') +
          '<button class="wl-mv" aria-label="上移" onclick="movePlanSite(' + di + ',' + i + ',-1)">↑</button>' +
          '<button class="wl-mv" aria-label="下移" onclick="movePlanSite(' + di + ',' + i + ',1)">↓</button></div>';
      });
    });
    html += '<div style="display:flex;gap:10px;margin-top:14px"><button class="wl-btn" style="flex:1;justify-content:center" onclick="window.__exportPlan()">导出 GPX</button><button class="wl-btn" style="flex:1;justify-content:center" id="wlPlanClose">收起计划</button></div></div>';
    box.innerHTML = html;
    box.style.display = 'block';
    document.getElementById('planStations').value = window.__planStations || 6;
    document.getElementById('planKm').value = window.__planKm || 260;
    document.getElementById('wlPlanClose').onclick = function () { box.style.display = 'none'; document.getElementById('wlMap').style.display = 'none'; mapOn = false; document.getElementById('wlMapBtn').textContent = '地图'; };
  }
  window.replan = function () {
    window.__planStations = parseInt(document.getElementById('planStations').value, 10) || 6;
    window.__planKm = parseInt(document.getElementById('planKm').value, 10) || 260;
    planTrip();
  };
  /* 每天导航：起点 = 上一天终点（跨天衔接）或本天首站，途经中间站，终点 = 本天末站 */
  window.navDay = function (di) {
    var days = window.__planDays || [];
    var d = days[di]; if (!d || !d.length) { UI.toast('没有可导航的站点'); return; }
    var prevEnd = di > 0 ? days[di - 1][days[di - 1].length - 1] : null;
    var gcj = function (p) {
      if (!p) return null;
      if (p.gcj) return [p.lng, p.lat];
      try { var g = window.Geo && Geo.gcj02Of ? Geo.gcj02Of(p.lat, p.lng) : null; return g ? [g[1], g[0]] : [p.lng, p.lat]; } catch (e) { return [p.lng, p.lat]; }
    };
    var startP = prevEnd || d[0];
    var start = gcj(startP), dest = gcj(d[d.length - 1]);
    if (!start || !dest) { UI.toast('站点缺少坐标，无法导航'); return; }
    var ways = (prevEnd ? d.slice(0, -1) : d.slice(1, -1)).map(gcj).filter(Boolean);
    var sName = (prevEnd ? '昨日终点·' : '') + startP.label;
    var dName = d[d.length - 1].label;
    var deep = 'amapuri://route/plan/?sourceApplication=' + encodeURIComponent('行迹') +
      '&slat=' + start[1] + '&slon=' + start[0] + '&sname=' + encodeURIComponent(sName) +
      '&dlat=' + dest[1] + '&dlon=' + dest[0] + '&dname=' + encodeURIComponent(dName) + '&dev=0&t=0';
    if (ways.length) deep += '&vian=' + ways.length + '&vialons=' + ways.map(function (w) { return w[0]; }).join('|') + '&vialats=' + ways.map(function (w) { return w[1]; }).join('|') + '&vianames=' + ways.map(function (w) { return ''; }).join('|');
    var web = 'https://uri.amap.com/navigation?from=' + start[0] + ',' + start[1] + ',' + encodeURIComponent(sName) +
      '&to=' + dest[0] + ',' + dest[1] + ',' + encodeURIComponent(dName) + '&mode=car&policy=1&src=' + encodeURIComponent('行迹') + '&coordinate=gaode&callnative=1';
    if (ways.length) web += '&waypoints=' + ways.map(function (w) { return w[0] + ',' + w[1]; }).join(';');
    if (/GuJianApp/.test(navigator.userAgent)) { window.location.href = deep; return; }
    var t0 = Date.now(); window.location.href = deep;
    setTimeout(function () { if (Date.now() - t0 < 2200) window.location.href = web; }, 1900);
  };
  /* 调整站序：dir=-1 上移、1 下移；边界时自动跨天 */
  window.movePlanSite = function (di, si, dir) {
    var days = window.__planDays; if (!days || !days[di]) return;
    var d = days[di];
    var to = si + dir;
    if (to >= 0 && to < d.length) {
      var t = d[si]; d[si] = d[to]; d[to] = t;
    } else if (dir < 0 && di > 0) {
      days[di - 1].push(d.splice(si, 1)[0]);
    } else if (dir > 0 && di < days.length - 1) {
      days[di + 1].unshift(d.splice(si, 1)[0]);
    } else { return; }
    window.__planDays = days.filter(function (x) { return x.length; });
    renderPlan(window.Wish.list().filter(function (x) { return !x.visited && x.lat != null; }).length);
  };
  window.__exportPlan = function () {
    var days = window.__planDays; if (!days || !days.length) { flash('请先规划行程'); return; }
    var pts = [];
    days.forEach(function (d) { d.forEach(function (s) { pts.push(s); }); });
    var gpx = '<?xml version="1.0" encoding="UTF-8"?>' +
      '<gpx version="1.1" creator="行迹 TRACE" xmlns="http://www.topografix.com/GPX/1/1">' +
      '<metadata><name>行迹行程计划</name><time>' + new Date().toISOString() + '</time></metadata><trk><name>行程计划</name><trkseg>' +
      pts.map(function (s) { return '<trkpt lat="' + s.lat + '" lon="' + s.lng + '"><name>' + s.label + '</name></trkpt>'; }).join('') +
      '</trkseg></trk>';
    days.forEach(function (d, di) { d.forEach(function (s) { gpx += '<wpt lat="' + s.lat + '" lon="' + s.lng + '"><name>D' + (di + 1) + ' ' + s.label + '</name></wpt>'; }); });
    gpx += '</gpx>';
    var fname = '行迹行程计划_' + new Date().toISOString().slice(0, 10) + '.gpx';
    /* App 壳：保存到系统下载目录（MediaStore，免权限）；回调确认保存结果 */
    if (window.AndroidVoice && AndroidVoice.saveTextFile) {
      try {
        window.__tnSaveDone = function (st) {
          if (st === 'need_perm') flash('需要存储权限，请在系统设置中允许后重试');
          else flash('GPX 已保存到下载目录 ✓');
        };
        AndroidVoice.saveTextFile(fname, gpx);
        setTimeout(function () { flash('GPX 已保存到下载目录 ✓'); }, 1500);
        return;
      } catch (e) { flash('导出失败，请重试'); return; }
    }
    try {
      var blob = new Blob([gpx], { type: 'application/gpx+xml' });
      var a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = fname;
      document.body.appendChild(a); a.click(); a.remove();
      flash('GPX 已导出 ✓');
    } catch (e) { flash('导出失败，请用其他方式'); }
  };

  /* 按钮绑定 */
  document.getElementById('wlMapBtn').onclick = function () {
    mapOn = !mapOn;
    document.getElementById('wlMap').style.display = mapOn ? 'block' : 'none';
    document.getElementById('wlPlan').style.display = 'none';
    this.textContent = mapOn ? '列表' : '地图';
    if (mapOn) renderMap();
  };
  var pc = document.getElementById('wlPlanClose');
  if (pc) pc.onclick = function () { document.getElementById('wlPlan').style.display = 'none'; document.getElementById('wlMapBtn').textContent = '地图'; };
  document.getElementById('wlPlanBtn').onclick = function () {
    document.getElementById('wlMap').style.display = 'none';
    document.getElementById('wlMapBtn').textContent = '地图';
    planTrip();
  };

  function itemHtml(w, i) {
    var done = !!w.visited;
    var loc = [w.region, w.city].filter(Boolean).join(' · ');
    return '<div class="wl-item">' +
      '<span class="wl-dot" style="background:' + themeColor(w.theme) + '"></span>' +
      '<div class="wl-main">' +
        '<b>' + esc(w.label) + '</b>' +
        '<small>' + esc(loc || '未定位区域') + (w.theme ? ' · ' + esc(w.theme) : '') + '</small>' +
        (w.theme ? '<span class="wl-tag' + (done ? ' wl-done-tag' : '') + '">' + (done ? '已打卡 · ' + fmt(w.visited) : esc(w.theme)) + '</span>' : '') +
      '</div>' +
      '<div class="wl-acts">' +
        (done
          ? '<button class="wl-btn done" onclick="undoCheckin(' + i + ')">撤销打卡</button>'
          : '<button class="wl-btn primary" onclick="doCheckin(' + i + ')">打卡并记录</button>') +
      '</div>' +
      '<button class="wl-remove" aria-label="移除" onclick="doRemove(' + i + ')">✕</button>' +
    '</div>';
  }
  /* 省分组渲染：未打卡按省折叠分组，已打卡单独一组 */
  var wlCollapsed = {};
  window.toggleGroup = function (r) { wlCollapsed[r] = !wlCollapsed[r]; render(); };
  function render() {
    var list = window.Wish.list();
    curList = list;
    cnt.textContent = list.length ? list.length + ' 处' : '';
    empty.style.display = list.length ? 'none' : 'block';
    var pend = list.filter(function (w) { return !w.visited; });
    var done = list.filter(function (w) { return w.visited; });
    var groups = {};
    pend.forEach(function (w) { var r = w.region || '未分类'; (groups[r] = groups[r] || []).push(w); });
    var html = '';
    Object.keys(groups).sort(function (a, b) { return groups[b].length - groups[a].length; }).forEach(function (r) {
      var arr = groups[r];
      html += '<div class="wl-group">' +
        '<div class="wl-group-head" onclick=\'toggleGroup(' + JSON.stringify(r) + ')\'>' +
        '<span class="wl-group-name">' + esc(r) + '</span><span class="wl-group-cnt">' + arr.length + ' 处</span>' +
        '<span class="wl-group-arr">' + (wlCollapsed[r] ? '▸' : '▾') + '</span></div>' +
        (wlCollapsed[r] ? '' : arr.map(function (w) { return itemHtml(w, list.indexOf(w)); }).join('')) +
        '</div>';
    });
    if (done.length) {
      var k = '__done';
      html += '<div class="wl-group">' +
        '<div class="wl-group-head" onclick=\'toggleGroup(' + JSON.stringify(k) + ')\'>' +
        '<span class="wl-group-name">已打卡</span><span class="wl-group-cnt">' + done.length + ' 处</span>' +
        '<span class="wl-group-arr">' + (wlCollapsed[k] ? '▸' : '▾') + '</span></div>' +
        (wlCollapsed[k] ? '' : done.map(function (w) { return itemHtml(w, list.indexOf(w)); }).join('')) +
        '</div>';
    }
    body.innerHTML = html;
  }
  /* 打卡：标记已访问 + 直接打开语音游记面板（在景点坐标上） */
  function doCheckin(i) {
    var w = window.Wish.list()[i]; if (!w) return;
    window.Wish.checkin(w);
    render();
    flash('已打卡 · ' + w.label + '，可以开始记录啦');
    try { window.TravelNotes.openPanel({ label: w.label, lat: w.lat, lng: w.lng }); } catch (e) {}
  }
  /* 撤销打卡：恢复为未打卡 */
  function undoCheckin(i) {
    var w = window.Wish.list()[i]; if (!w) return;
    window.Wish.uncheckin(w);
    render();
    flash('已撤销打卡 · ' + w.label);
  }
  var curList = [];
  function doRemove(i) {
    var w = curList[i] || window.Wish.list()[i]; if (!w) return;
    UI.confirm({ title: '移除心愿', text: '确定从想去清单移除「' + w.label + '」？', okText: '移除', danger: true }, function (ok) {
      if (!ok) return;
      window.Wish.remove(w.id || String(w.label + '|' + w.lat + '|' + w.lng));
      render();
      UI.toast('已移除「' + w.label + '」');
    });
  }
  /* 内联 onclick 在全局作用域执行：必须挂 window，否则点击 ReferenceError 无响应 */
  window.doCheckin = doCheckin;
  window.undoCheckin = undoCheckin;
  window.doRemove = doRemove;
  function flash(msg) {
    var d = document.createElement('div');
    d.style.cssText = 'position:fixed;top:calc(env(safe-area-inset-top,0px)+14px);left:50%;transform:translateX(-50%);background:var(--color-primary);color:#fff;padding:11px 20px;border-radius:999px;font-size:13px;z-index:9600;box-shadow:0 6px 24px rgba(0,0,0,.3);white-space:nowrap;max-width:90vw;overflow:hidden;text-overflow:ellipsis';
    d.textContent = msg; document.body.appendChild(d);
    setTimeout(function () { d.remove(); }, 2400);
  }
  window.TravelNotes._onReady = function () { render(); };
  TravelNotes.init({});
  window.TravelNotes._afterSave = function () { render(); };
  render();
})();
</script>
</body>
