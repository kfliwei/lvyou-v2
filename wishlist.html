<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>想去清单 · 行迹</title>
<link rel="stylesheet" href="design.css">
<link rel="manifest" href="manifest.webmanifest">
<script src="theme.js"></script>
<link rel="stylesheet" href="vendor/leaflet/leaflet.css">
<script src="vendor/leaflet/leaflet.js"></script>
<link rel="stylesheet" href="map.css">
<style>
  html,body{min-height:100%;margin:0;font-family:var(--font-sans);background:var(--color-bg);color:var(--color-ink)}
  .wrap{padding:20px 16px 120px;max-width:520px;margin:0 auto}
  .wl-empty{text-align:center;padding:70px 20px;color:var(--color-faint)}
  .wl-empty .em{font-family:var(--font-serif);font-size:22px;color:var(--color-ink-soft);line-height:1.8}
  .wl-empty p{font-size:0.8125rem;margin-top:10px;line-height:1.8}
  .wl-empty a{color:var(--color-primary-dark);font-size:14px;font-weight:600}
  .wl-item{display:flex;align-items:center;gap:12px;padding:16px 4px;border-bottom:1px solid var(--color-line)}
  .wl-item:last-child{border-bottom:0}
  .wl-dot{width:10px;height:10px;border-radius:50%;flex:0 0 auto}
  .wl-main{flex:1;min-width:0}
  .wl-main b{font-family:var(--font-serif);font-size:16.5px;font-weight:400;color:var(--color-ink);display:block}
  .wl-main small{font-size:11.5px;color:var(--color-muted);display:block;margin-top:3px}
  .wl-main .wl-tag{display:inline-block;font-size:10.5px;color:var(--color-primary-dark);background:var(--color-primary-soft);border-radius:999px;padding:1px 8px;margin-top:6px}
  .wl-main .wl-done-tag{background:#ECEFEA;color:var(--color-green)}
  .wl-acts{display:flex;gap:8px;flex:0 0 auto}
  .wl-btn{min-height:36px;padding:0 14px;border-radius:999px;font-size:12.5px;border:1px solid var(--color-line-strong);background:var(--color-surface);color:var(--color-ink-soft);cursor:pointer;white-space:nowrap}
  .wl-btn:active{transform:scale(.95)}
  .wl-btn.primary{background:var(--color-primary);border-color:var(--color-primary);color:#fff;font-weight:600}
  .wl-btn.done{background:#ECEFEA;border-color:transparent;color:var(--color-green)}
  .wl-remove{width:40px;height:40px;border:0;border-radius:50%;background:transparent;color:var(--color-faint);font-size:14px;cursor:pointer;flex:0 0 auto}
  .wl-remove:active{background:var(--color-bg-soft)}
  /* 省分组 */
  .wl-group-head{display:flex;align-items:center;gap:8px;padding:11px 4px 7px;cursor:pointer;user-select:none;-webkit-user-select:none}
  .wl-group:not(:first-child) .wl-group-head{border-top:1px solid var(--color-line)}
  .wl-group-name{font-family:var(--font-serif);font-size:15px;color:var(--color-ink);flex:1}
  .wl-group-cnt{font-size:11px;color:var(--color-muted);background:var(--color-bg-soft);border-radius:999px;padding:2px 10px;flex:0 0 auto}
  .wl-group-arr{color:var(--color-faint);font-size:12px;flex:0 0 auto}
  .wl-mv{width:32px;height:32px;border:1px solid var(--color-line);border-radius:8px;background:var(--color-bg-soft);color:var(--color-muted);font-size:13px;cursor:pointer;flex:0 0 auto;padding:0;line-height:1}
  .theme-dark .wl-item{border-bottom-color:var(--color-line)}
  .theme-dark .wl-main b{color:var(--color-ink)}
  .theme-dark .wl-btn{background:var(--color-surface);border-color:var(--color-line-strong);color:var(--color-ink-soft)}
  /* 覆盖 map.css 的全屏地图页 body 锁定（本页为普通滚动页，body 不可被 overflow:hidden 裁剪） */
  html,body{height:auto;min-height:100%}
  body{display:block;overflow:auto}
  /* 顶栏按钮防挤压：固定宽度不收缩，标题区自适应 */
  .t-row .wl-btn{flex:0 0 auto;white-space:nowrap;padding:0 10px}
</style>
</head>
<body>
<header class="topbar">
  <div class="t-row">
    <button class="back" onclick="history.length>1?history.back():location.href='index.html'" aria-label="返回">←</button>
    <div class="title">想去清单 <small id="cntLabel"></small></div>
    <button class="wl-btn" style="min-height:34px" id="wlMapBtn">地图</button>
    <a class="wl-btn" style="min-height:34px;margin-left:6px;display:inline-flex;align-items:center;text-decoration:none" href="planner.html?from=wish">规划行程</a>
    <button class="wl-btn" style="min-height:34px;margin-left:6px" onclick="window.copyWishlist()">复制清单</button>
    <button class="wl-btn" style="min-height:34px;margin-left:6px" onclick="location.href='explore-map.html'">去探索</button>
  </div>
</header>
<div class="wrap">
  <div id="wlMap" style="display:none;height:60vh;height:60dvh;border-radius:18px;overflow:hidden;border:1px solid var(--color-line)"></div>
  <div id="wlBody"></div>
  <div class="wl-empty" id="wlEmpty" style="display:none">
    <div class="em">想去的地方，<br>先记在这里。</div>
    <p>在专题地图或全国地图点开景点详情，<br>点「♡ 想去」就会出现在这里。<br>到了之后一键打卡，直接开始语音游记。</p>
    <a href="explore-map.html">去地图看看 →</a>
  </div>
</div>

<script src="geo.js"></script>
<script src="wishlist.js"></script>
<script src="travel-notes.js"></script>
<script src="ui.js"></script>
<script>
(function () {
  var body = document.getElementById('wlBody');
  var empty = document.getElementById('wlEmpty');
  var cnt = document.getElementById('cntLabel');
  function esc(s) { return window.UI.esc(s); }
  function themeColor(t) {
    var map = { '高原湖泊':'#5F6D76','雪山冰川':'#9C9A92','名山大川':'#71806C','峡谷天堑':'#8A5A44','江河瀑布':'#5F6D76','古建寺院':'#A9563B','古城古镇':'#8A5A44','古城遗址':'#7E7663','红色遗迹':'#C86D4B','民族风情':'#C86D4B','城市地标':'#6D7D88','溶洞奇观':'#8C7B66','森林草原':'#71806C','森林山川':'#71806C','宗教圣地':'#A9563B','遗址陵墓':'#7E7663','温泉康养':'#C86D4B','石窟艺术':'#A9563B','丹霞地貌':'#BA7517','雅丹地貌':'#BA7517','沙漠戈壁':'#BA7517','草原湿地':'#639922','石窟寺':'#A9563B','佛寺':'#A9563B','古塔':'#7E7663','楼阁牌坊':'#8A5A44','名城名镇':'#8A5A44','壁画彩塑':'#C86D4B','关隘长城':'#993C1D','窑洞民居':'#BA7517','庙宇道观':'#A9563B','文庙书院':'#A9563B','陵墓':'#7E7663','桥梁':'#6D7D88','教堂会馆':'#6D7D88' };
    return map[t] || '#B4AFA4';
  }
  function fmt(ts) { var d = new Date(ts); function p(n){return (n<10?'0':'')+n;} return d.getFullYear()+'.'+p(d.getMonth()+1)+'.'+p(d.getDate()); }

  /* ---------- 地图视图 ---------- */
  var map = null, mapOn = false, planLayer = null;
  var DAY_COLORS = ['#C86D4B', '#71806C', '#6D7D88', '#8A6D3B', '#7E7663', '#5F6D76'];
  function initMap() {
    if (map) return;
    map = L.map('wlMap', { zoomControl: false }).setView([34.5, 105], 5);
    L.control.zoom({ position: 'bottomright' }).addTo(map);
    var wlLayer = L.tileLayer('https://wprd0{s}.is.autonavi.com/appmaptile?lang=zh_cn&size=1&style=7&x={x}&y={y}&z={z}', { subdomains: '1234', maxZoom: 18, attribution: '? 高德' }).addTo(map);
    UI.tileWarn(wlLayer, '地图');
    planLayer = L.layerGroup().addTo(map);
  }
  function clearMarkers() {
    map.eachLayer(function (l) { if (l instanceof L.Marker) map.removeLayer(l); });
  }
  function renderMap() {
    var list = window.Wish.list().filter(function (x) { return x.lat != null; });
    initMap();
    map.invalidateSize();
    clearMarkers();
    planLayer.clearLayers();
    if (!list.length) return;
    var bnd = [];
    list.forEach(function (x) {
      var m = L.marker([x.lat, x.lng], {
        icon: L.divIcon({ className: '', html: '<div style="position:relative;width:26px;height:26px"><span style="position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:12px;height:12px;border-radius:50%;background:' + (x.visited ? '#9C9A92' : '#C86D4B') + ';border:2.5px solid #fff;box-shadow:0 2px 8px rgba(0,0,0,.25)"></span>' + (x.visited ? '' : '<span style="position:absolute;right:-2px;top:-2px;width:9px;height:9px;border-radius:50%;background:#FF7A50;border:1.5px solid #fff"></span>') + '</div>', iconSize: [26, 26], iconAnchor: [13, 13] })
      });
      m.bindPopup('<b>' + x.label + '</b><br>' + (x.region || '') + (x.city ? ' · ' + x.city : '') + (x.visited ? '<br><span style="color:#9C9A92">已打卡</span>' : ''));
      map.addLayer(m);
      bnd.push([x.lat, x.lng]);
    });
    if (bnd.length > 1) map.fitBounds(bnd, { padding: [40, 40] });
    else if (bnd.length === 1) map.setView(bnd[0], 9);
  }
  /* ---------- 跨专题行程规划（贪心：每天 ≤6 站、单日 ≤260km）---------- */
  /* 复制文本（剪贴板 + execCommand 兜底） */
  function copyText(txt) {
    function legacy() {
      try {
        var ta = document.createElement('textarea');
        ta.value = txt; ta.style.position = 'fixed'; ta.style.opacity = '0';
        document.body.appendChild(ta); ta.select();
        document.execCommand('copy');
        ta.remove(); UI.toast('已复制');
      } catch (e) { UI.toast('复制失败'); }
    }
    if (navigator.clipboard && window.isSecureContext) {
      navigator.clipboard.writeText(txt).then(function () { UI.toast('已复制'); }, legacy);
    } else legacy();
  }
  /* ④ 想去清单文本分享 */
  window.copyWishlist = function () {
    var list = window.Wish ? Wish.list() : [];
    if (!list.length) { UI.toast('清单是空的'); return; }
    var txt = '⭐ 想去清单（行迹 TRACE）\n';
    list.forEach(function (w, i) { txt += (i + 1) + '. ' + w.label + (w.city ? '（' + w.city + '）' : '') + '\n'; });
    copyText(txt);
  };

  /* 按钮绑定 */
  document.getElementById('wlMapBtn').onclick = function () {
    mapOn = !mapOn;
    document.getElementById('wlMap').style.display = mapOn ? 'block' : 'none';
    this.textContent = mapOn ? '列表' : '地图';
    if (mapOn) renderMap();
  };

  function itemHtml(w, i) {
    var done = !!w.visited;
    var loc = [w.region, w.city].filter(Boolean).join(' · ');
    return '<div class="wl-item">' +
      '<span class="wl-dot" style="background:' + themeColor(w.theme) + '"></span>' +
      '<div class="wl-main">' +
        '<b>' + esc(w.label) + '</b>' +
        '<small>' + esc(loc || '未定位区域') + (w.theme ? ' · ' + esc(w.theme) : '') + '</small>' +
        (w.theme ? '<span class="wl-tag' + (done ? ' wl-done-tag' : '') + '">' + (done ? '已打卡 · ' + fmt(w.visited) : esc(w.theme)) + '</span>' : '') +
      '</div>' +
      '<div class="wl-acts">' +
        (done
          ? '<button class="wl-btn done" onclick="undoCheckin(' + i + ')">撤销打卡</button>'
          : '<button class="wl-btn primary" onclick="doCheckin(' + i + ')">打卡并记录</button>') +
      '</div>' +
      '<button class="wl-remove" aria-label="移除" onclick="doRemove(' + i + ')">✕</button>' +
    '</div>';
  }
  /* 省分组渲染：未打卡按省折叠分组，已打卡单独一组 */
  var wlCollapsed = {};
  window.toggleGroup = function (r) { wlCollapsed[r] = !wlCollapsed[r]; render(); };
  function render() {
    var list = window.Wish.list();
    curList = list;
    cnt.textContent = list.length ? list.length + ' 处' : '';
    empty.style.display = list.length ? 'none' : 'block';
    var pend = list.filter(function (w) { return !w.visited; });
    var done = list.filter(function (w) { return w.visited; });
    var groups = {};
    pend.forEach(function (w) { var r = w.region || '未分类'; (groups[r] = groups[r] || []).push(w); });
    var html = '';
    Object.keys(groups).sort(function (a, b) { return groups[b].length - groups[a].length; }).forEach(function (r) {
      var arr = groups[r];
      html += '<div class="wl-group">' +
        '<div class="wl-group-head" onclick=\'toggleGroup(' + JSON.stringify(r) + ')\'>' +
        '<span class="wl-group-name">' + esc(r) + '</span><span class="wl-group-cnt">' + arr.length + ' 处</span>' +
        '<span class="wl-group-arr">' + (wlCollapsed[r] ? '▸' : '▾') + '</span></div>' +
        (wlCollapsed[r] ? '' : arr.map(function (w) { return itemHtml(w, list.indexOf(w)); }).join('')) +
        '</div>';
    });
    if (done.length) {
      var k = '__done';
      html += '<div class="wl-group">' +
        '<div class="wl-group-head" onclick=\'toggleGroup(' + JSON.stringify(k) + ')\'>' +
        '<span class="wl-group-name">已打卡</span><span class="wl-group-cnt">' + done.length + ' 处</span>' +
        '<span class="wl-group-arr">' + (wlCollapsed[k] ? '▸' : '▾') + '</span></div>' +
        (wlCollapsed[k] ? '' : done.map(function (w) { return itemHtml(w, list.indexOf(w)); }).join('')) +
        '</div>';
    }
    body.innerHTML = html;
  }
  /* 打卡：标记已访问 + 直接打开语音游记面板（在景点坐标上） */
  function doCheckin(i) {
    var w = window.Wish.list()[i]; if (!w) return;
    window.Wish.checkin(w);
    render();
    flash('已打卡 · ' + w.label + '，可以开始记录啦');
    try { window.TravelNotes.openPanel({ label: w.label, lat: w.lat, lng: w.lng }); } catch (e) {}
  }
  /* 撤销打卡：恢复为未打卡 */
  function undoCheckin(i) {
    var w = window.Wish.list()[i]; if (!w) return;
    window.Wish.uncheckin(w);
    render();
    flash('已撤销打卡 · ' + w.label);
  }
  var curList = [];
  function doRemove(i) {
    var w = curList[i] || window.Wish.list()[i]; if (!w) return;
    UI.confirm({ title: '移除心愿', text: '确定从想去清单移除「' + w.label + '」？', okText: '移除', danger: true }, function (ok) {
      if (!ok) return;
      window.Wish.remove(w.id || String(w.label + '|' + w.lat + '|' + w.lng));
      render();
      UI.toast('已移除「' + w.label + '」');
    });
  }
  /* 内联 onclick 在全局作用域执行：必须挂 window，否则点击 ReferenceError 无响应 */
  window.doCheckin = doCheckin;
  window.undoCheckin = undoCheckin;
  window.doRemove = doRemove;
  function flash(msg) {
    if (window.UI) { UI.toast(msg); return; }
    var d = document.createElement('div');
    d.style.cssText = 'position:fixed;top:calc(env(safe-area-inset-top,0px)+14px);left:50%;transform:translateX(-50%);background:var(--color-primary);color:#fff;padding:11px 20px;border-radius:999px;font-size:13px;z-index:9600;box-shadow:0 6px 24px rgba(0,0,0,.3);white-space:nowrap;max-width:90vw;overflow:hidden;text-overflow:ellipsis';
    d.textContent = msg; document.body.appendChild(d);
    setTimeout(function () { d.remove(); }, 2400);
  }
  window.TravelNotes._onReady = function () { render(); };
  TravelNotes.init({});
  window.TravelNotes._afterSave = function () { render(); };
  render();
})();
</script>
<div id="bnav"></div><script src="nav.js" data-active="wishlist"></script>
</body>
</html>
