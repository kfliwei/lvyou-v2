<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>行迹 TRACE · 省份专题</title>
<link rel="stylesheet" href="design.css">
<link rel="stylesheet" href="vendor/leaflet/leaflet.css">
<link rel="stylesheet" href="map.css?v=20260813">
<link rel="manifest" href="manifest.webmanifest">
<script src="theme.js"></script>
<style>.pop{max-width:200px;font-size:12px}.pop .pscroll{max-height:30vh;overflow-y:auto;padding:8px 10px}
.pop .pm{color:var(--color-muted);margin-top:6px;font-size:0.6875rem}.pop .pfoot{margin-top:10px;display:flex;gap:8px}
.pop .pa{line-height:1.6}
@media (min-width:760px){.pop{max-width:280px}}</style>
</head>
<body>
<header class="topbar">
  <div class="t-row">
    <button class="back" onclick="location.href='index.html'" title="返回地图集">←</button>
    <div class="title"><small id="totalTag"></small></div>
    <button class="act" onclick="__tnAnywhere()" title="用当前 GPS 位置随手语音记录">随手记</button>
    <button class="act sec" onclick="TravelNotes.openList()">游记</button>
  </div>
  <div class="s-row">
    <div class="search">🔍<input id="search" placeholder="搜名称 / 城市 / 类型 / 简介…"></div>
    <div class="sort"><select id="sortSel"></select></div>
  </div>
  <div class="chip-row" id="dynChips"></div>
</header>
<main>
  <section id="map" class="view active">
    <div id="mapEl"><div id="mapSkel" style="position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:var(--color-bg,#F7F5EF);z-index:5;font-size:13px;color:var(--color-muted)">景点数据加载中…</div></div>
    <button id="locBtn" class="fab" title="定位我的位置">📍</button>
    <div class="routeBanner" id="routeBanner"></div>
    <div class="legend" id="legend">
      <button class="tg" id="legTg" title="关闭图例">✕</button>
      <h4>景观类型色谱</h4>
      <div class="body" id="legBody"></div>
    </div>
    <button id="legOpen" class="legOpen" title="显示图例">🗂 图例</button>
    <div class="ctl">
      <button id="layBtn" title="切换图层"><span class="layicon"><span class="a"></span><span class="b"></span></span></button>
      <div class="sep"></div>
      <button id="zoomIn" title="放大"><span class="zoomplus">+</span></button>
      <div class="sep"></div>
      <button id="zoomOut" title="缩小"><span class="zoomminus"></span></button>
    </div>
    <div class="laymenu" id="layMenu"></div>
    <button class="dayLegendBtn" id="dayLegendBtn" title="展开 / 收起每日轨迹色" style="display:none">🎨 每日色</button>
    <div class="dayLegend" id="dayLegend" style="display:none"></div>
    <div class="pickHint" id="pickHint" style="display:none">📍 点击地图任意位置，设为「我的位置」</div>
    <button class="tripfab" id="tripFab">🧭<span class="badge" id="tripBadge">0</span></button>
    <div class="tripbar" id="tripBar">
      <div class="th"><span class="tt">我的行程</span><span class="cnt" id="tripCnt">0</span><button class="clr" id="tripClear">清空</button><button class="cls" id="tripClose">✕</button></div>
      <div class="row" id="tripRow"></div>
      <button class="sortb" id="tripSort">帮我排一下顺序</button>
      <button class="go" id="tripGo">开始今天的旅行</button>
    </div>
  </section>
  <section id="list" class="view">
    <div class="cntbar" id="listCnt"></div>
    <div class="grid" id="grid"></div>
    <div class="empty" id="listEmpty" style="display:none">没有匹配的结果，试试放宽筛选条件。</div>
  </section>
  <section id="theme" class="view">
    <div class="tl" id="tl"></div>
  </section>
  <section id="route" class="view">
    <div class="routeSelBar">
      <select id="routeSel"><option value="">🧭 选择一条路线</option></select>
    </div>
    <div class="routes" id="routes"></div>
  </section>
  <section id="food" class="view">
    <div class="foodbar">
      <input id="foodSearch" placeholder="搜美食 / 县市 / 特色…">
      <select id="foodProv"><option value="">全部省份</option></select>
      <select id="foodCity"><option value="">全部城市</option></select>
      <select id="foodType"><option value="">全部类型</option></select>
    </div>
    <div class="fcount" id="foodCnt"></div>
    <div class="fgrid" id="foodGrid"></div>
  </section>
</main>
<!-- TRACE v2 到达卡片 -->
<div id="arriveDlg" onclick="if(event.target===this)window.TopicEngine&&window.TopicEngine._closeArrive&&window.TopicEngine._closeArrive()">
  <div class="arrive-card">
    <div class="arrive-eyebrow">You Arrived</div>
    <div class="arrive-place" id="arPlace">—</div>
    <div class="arrive-sub" id="arSub"></div>
    <div class="arrive-ask">想留下些什么？</div>
    <div class="arrive-acts">
      <button class="btn-primary" id="arVoice">说两句</button>
      <button class="btn-secondary" id="arGo">去导航</button>
    </div>
    <div class="arrive-nav" onclick="window.TopicEngine&&window.TopicEngine._closeArrive&&window.TopicEngine._closeArrive()">直接收起</div>
  </div>
</div>
<!-- TRACE v2 Location Sheet -->
<div class="location-sheet" id="locSheet">
  <div class="sheet__handle" onclick="window.TopicEngine&&window.TopicEngine.closeSheet()"></div>
  <div id="lsBody"></div>
</div>
<nav class="tabbar">
  <button data-tab="map" class="on"><span class="ic"><svg width="20" height="20" viewBox="0 0 24 24" fill="none"><circle cx="12" cy="12" r="7" stroke="currentColor" stroke-width="1.6"/><circle cx="12" cy="12" r="2.2" fill="currentColor"/></svg></span>地图</button>
  <button data-tab="list"><span class="ic"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><path d="M9 6 H20"/><path d="M9 12 H20"/><path d="M9 18 H20"/><circle cx="4.5" cy="6" r="1.2" fill="currentColor" stroke="none"/><circle cx="4.5" cy="12" r="1.2" fill="currentColor" stroke="none"/><circle cx="4.5" cy="18" r="1.2" fill="currentColor" stroke="none"/></svg></span>列表</button>
  <button data-tab="theme"><span class="ic"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><rect x="4" y="4" width="7" height="7" rx="1.5"/><rect x="13" y="4" width="7" height="7" rx="1.5"/><rect x="4" y="13" width="7" height="7" rx="1.5"/><rect x="13" y="13" width="7" height="7" rx="1.5"/></svg></span>主题</button>
  <button data-tab="route"><span class="ic"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19 L10 9 L14 13 L20 5"/><circle cx="4" cy="19" r="2" fill="currentColor" stroke="none"/><circle cx="20" cy="5" r="2" fill="currentColor" stroke="none"/></svg></span>路线</button>
  <button data-tab="food"><span class="ic"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M5 8 H19 V11 C19 15 16 18 12 18 C8 18 5 15 5 11 Z"/><path d="M12 18 V21"/></svg></span>美食</button>
</nav>
<script src="vendor/leaflet/leaflet.js?v=20260813"></script>
<script src="node-lod.js?v=20260813"></script>
<script src="geo.js"></script>
<script src="tiles.js?v=20260813"></script>
<script src="quotes.js?v=20260813"></script>
<script src="travel-notes.js?v=20260813"></script>
<script src="results.js?v=20260813"></script>
<script src="vault.js?v=20260813"></script>
<script src="topic-meta.js?v=20260813"></script>
<script src="wishlist.js?v=20260813"></script>
<script src="topic-common.js?v=20260813"></script>
<script>
/* 启动器：?p=sc → 载入 sc-data.js(+sc-food.js) → TopicEngine.init() */
(function () {
  /* 缓存策略：sw.js 版本化治理后不再注销 SW，依赖 CACHE bump + ?v= 版本号刷新 */
  var p = (location.search.match(/[?&]p=([^&]+)/) || [])[1] || 'sc';
  var cfg = window.TOPIC_REGISTRY[p] || window.TOPIC_REGISTRY.sc;
  if (!cfg) { document.body.innerHTML = '<div style="padding:40px;text-align:center">未知专题：' + p + '</div>'; return; }
  window.TOPIC_META = cfg;
  document.title = cfg.title;
  var titleEl = document.querySelector('.title');
  if (titleEl) titleEl.insertAdjacentHTML('afterbegin', '<span class="topic-title">' + cfg.title + '</span>');
  if (!cfg.foodEnabled) { var ft = document.querySelector('.tabbar button[data-tab="food"]'); if (ft) ft.style.display = 'none'; }
  function loadScript(src, cb) { var s = document.createElement('script'); s.src = src; s.onload = cb; s.onerror = cb; document.head.appendChild(s); }
  function boot() {
    /* 全国页 dl=1：加载完成后下载当前视野离线瓦片（设置页「下载当前区域」入口） */
    if (location.search.indexOf('dl=1') >= 0 && window.Tiles && window.Tiles.downloadView) {
      try {
        setTimeout(function () {
          var mp = document.getElementById('mapEl');
          var toast = function (msg) { var d = document.createElement('div'); d.style.cssText = 'position:fixed;top:calc(env(safe-area-inset-top,0px)+14px);left:50%;transform:translateX(-50%);background:rgba(32,32,29,.92);color:#fff;padding:11px 20px;border-radius:999px;font-size:13px;z-index:9800;white-space:nowrap'; d.textContent = msg; document.body.appendChild(d); setTimeout(function () { d.remove(); }, 2600); };
          Tiles.downloadView(window.TopicEngine._map || null, [10, 11, 12], function (ok, total) { if (ok % 40 === 0 || ok === total) toast('离线瓦片下载中 ' + ok + '/' + total); }, function (ok, total, cancelled) { toast(cancelled ? '已取消' : '当前区域瓦片下载完成 ' + ok + ' 张'); });
        }, 1800);
      } catch (e) {}
    }

    // 到 Sheet / 到达卡片的面板关闭钩子
    window.TopicEngine._closeArrive = function () { var d = document.getElementById('arriveDlg'); if (d) d.classList.remove('show'); };
    window.TopicEngine.init();
    var _sk = document.getElementById('mapSkel'); if (_sk) { setTimeout(function () { _sk.style.display = 'none'; }, 300); }
  }
  loadScript(cfg.dataJs, function () {
    if (cfg.routesKey) { loadScript('routes-data.js', function () { R = window.TOPIC_ROUTES || {}; if (cfg.foodJs) loadScript(cfg.foodJs, boot); else boot(); }); }
    else if (cfg.foodJs) loadScript(cfg.foodJs, boot);
    else boot();
  });
})();
</script>

<script>
(function(){
  if(window.Wish && Wish.checkNearby){
    setTimeout(function(){
      Wish.checkNearby(function(near){
        var s = near[0];
        var d = document.createElement('div');
        d.style.cssText='position:fixed;left:14px;right:14px;bottom:calc(env(safe-area-inset-bottom,0px)+76px);z-index:9500;background:rgba(32,32,29,.94);color:#fff;border-radius:16px;padding:13px 16px;font-size:13px;display:flex;align-items:center;gap:12px;box-shadow:0 8px 28px rgba(0,0,0,.3)';
        d.innerHTML='<span style="flex:1">你已在 <b>'+s.label+'</b> 附近（3km 内），记录一下？</span><button id="tnNGo" style="flex:0 0 auto;border:0;border-radius:999px;background:#C86D4B;color:#fff;padding:8px 16px;font-size:12.5px;cursor:pointer">去打卡</button>';
        document.body.appendChild(d);
        document.getElementById('tnNGo').onclick=function(){ d.remove(); location.href='wishlist.html'; };
        setTimeout(function(){ d.remove(); }, 10000);
      });
    }, 3500);
  }
})();
</script>
</body>
</html>
