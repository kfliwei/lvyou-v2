<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>探索地图 · 行迹</title>
<link rel="stylesheet" href="design.css">
<script src="theme.js"></script>
<style>
  html,body{min-height:100%;margin:0;font-family:var(--font-sans);background:var(--color-bg);color:var(--color-ink)}
  /* Hero 地图纹理 */
  .hero{position:relative;overflow:hidden;padding:28px 20px 22px;background:var(--map-bg)}
  .hero__map{position:absolute;inset:-6%;opacity:.14;pointer-events:none}
  .hero__map svg{width:100%;height:100%}
  .hero__title{position:relative;font-family:var(--font-serif);font-size:30px;font-weight:400;color:var(--color-ink);letter-spacing:.02em}
  .hero__sub{position:relative;margin-top:8px;font-size:13px;color:var(--color-muted);line-height:1.7}
  /* 专题地图：杂志式列表（与首页「附近故事」同语言） */
  .maps{padding:24px 20px 140px}
  .story-list{display:flex;flex-direction:column}
  .story-item{display:flex;align-items:center;gap:14px;padding:17px 2px;text-decoration:none;border-bottom:1px solid var(--color-line);transition:padding var(--duration-fast) var(--ease-standard)}
  .story-item:last-child{border-bottom:0}
  .story-item:active{padding-left:8px}
  .story-item__stamp{width:56px;height:56px;border-radius:14px;display:grid;place-items:center;font-family:var(--font-serif);font-size:17px;flex:0 0 auto;overflow:hidden;position:relative;background:var(--color-bg-soft);color:var(--color-ink-soft)}
  .story-item__stamp img{width:100%;height:100%;object-fit:cover;display:block}
  .story-item__stamp span{position:absolute;right:4px;bottom:2px;font-size:10.5px;line-height:1;font-weight:700;color:#fff;text-shadow:0 1px 3px rgba(0,0,0,.4);opacity:.92}
  .story-item__main{flex:1;min-width:0}
  .story-item__title{font-family:var(--font-serif);font-size:17px;font-weight:400;color:var(--color-ink);letter-spacing:.01em}
  .story-item__loc{font-size:0.6875rem;color:var(--color-muted);margin-top:4px;letter-spacing:.04em}
  .story-item__desc{font-size:0.75rem;color:var(--color-ink-soft);margin-top:5px;line-height:1.7;font-family:var(--font-sans)}
  .story-item__arr{color:var(--color-faint);display:grid;place-items:center;flex:0 0 auto;margin-left:8px}
  /* 我的地图：文字链接 */
  .mine{display:flex;align-items:baseline;gap:8px;padding:22px 2px 8px;text-decoration:none}
  .mine .text-link{font-size:15px;font-weight:500;color:var(--color-primary-dark)}
  .mine .mine-sub{font-size:0.75rem;color:var(--color-muted)}
  .sect-title{font-family:var(--font-serif);font-size:17px;font-weight:400;color:var(--color-ink);margin:6px 2px 8px}
  .eyebrow{font-size:11px;color:var(--color-muted);letter-spacing:.28em;text-transform:uppercase;margin:0 2px 6px}

  /* v3 CINEMATIC LAYER */
  .hero{background:linear-gradient(165deg,color-mix(in srgb,var(--color-primary-soft) 60%,var(--color-map-bg)),var(--color-map-bg) 82%)}
  .hero__title{font-size:32px}
  .eyebrow{display:flex;align-items:center;gap:9px;color:var(--color-gold-bright)}
  .eyebrow::before{content:"";width:14px;height:2px;border-radius:2px;background:var(--grad-gold-line)}
  .sect-title{font-size:19px;font-weight:600;display:flex;align-items:center;gap:9px}
  .sect-title::before{content:"";width:4px;height:17px;border-radius:2px;background:var(--grad-primary)}
  .story-item{padding:16px 4px}
  .story-item__stamp{border-radius:16px;box-shadow:var(--shadow-soft)}
  .story-item__arr{width:28px;height:28px;border-radius:50%;background:var(--color-bg-soft)}
  .mine .text-link{color:var(--color-ember-deep)}


</style>
</head>
<body>
  <header class="topbar">
    <div class="t-row">
      <button class="back" onclick="history.length>1?history.back():location.href='index.html'" aria-label="返回首页">←</button>
      <div class="title">探索地图 <small>Pick a Map</small></div>
    </div>
  </header>

  <section class="hero">
    <div class="hero__map">
      <svg viewBox="0 0 400 160" fill="none" stroke="var(--color-ink)" stroke-width=".6">
        <circle cx="80" cy="70" r="24" opacity=".5"/><circle cx="200" cy="55" r="18" opacity=".4"/><circle cx="300" cy="85" r="26" opacity=".5"/>
        <path d="M80 70 L200 55 L300 85" opacity=".35"/>
        <circle cx="120" cy="110" r="12" opacity=".3"/><circle cx="260" cy="120" r="15" opacity=".35"/>
      </svg>
    </div>
    <h1 class="hero__title">今天，想去哪里？</h1>
    <p class="hero__sub">三十四省，七千余处风景。选一张地图，走进去。</p>
    <a href="search.html" style="display:flex;align-items:center;gap:8px;margin:14px 2px 2px;background:var(--color-surface);border:1.5px solid var(--color-line);border-radius:999px;padding:13px 18px;font-size:13.5px;color:var(--color-muted);box-shadow:var(--shadow-soft)"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" style="flex:0 0 auto"><circle cx="11" cy="11" r="7"/><path d="M20 20 L16.5 16.5"/></svg><span style="flex:1">搜索全部景点（7833 处）</span><span style="color:var(--color-faint)">›</span></a>
  </section>

  <div class="maps">
    <p class="eyebrow">Featured Maps</p>
    <h2 class="sect-title">专题地图</h2>
<div class="story-list" id="topicList"></div>
    <a class="mine" href="travel-map.html">
      <span class="text-link">我的游记地图 <span class="arr">→</span></span>
      <span class="mine-sub">你留下的每一段声音与照片</span>
    </a>
    <a class="mine" href="wishlist.html">
      <span class="text-link">想去清单 <span class="arr">→</span></span>
      <span class="mine-sub">把想去的远方先记下来</span>
    </a>
  </div>
  <div id="bnav"></div>
  <script src="topic-catalog.js"></script>
  <script>
  /* 专题列表：由 topic-catalog.js 数据渲染（与 index.html 精选共用一份目录） */
  (function () {
    var ARR = '<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6 L15 12 L9 18"/></svg>';
    var box = document.getElementById('topicList');
    if (!box || !window.TOPIC_CATALOG) return;
    box.innerHTML = window.TOPIC_CATALOG.map(function (t) {
      var main = '<div class="story-item__title">' + t.title + '</div>' +
        '<div class="story-item__loc">' + t.loc + '</div>' +
        '<div class="story-item__desc">' + t.desc + '</div>';
      if (t.nation) {
        return '<a class="story-item" href="topic.html?p=nation" style="margin-top:12px;border:1px solid var(--color-line);border-radius:16px;padding:14px 12px;background:var(--color-surface);box-shadow:var(--shadow-soft)">' +
          '<span class="story-item__stamp" style="background:var(--color-primary-soft);color:var(--color-primary-dark)">' + t.ch + '</span>' +
          '<span class="story-item__main">' + main + '</span>' +
          '<span class="story-item__arr">' + ARR + '</span></a>';
      }
      return '<a class="story-item" href="topic.html?p=' + t.id + '">' +
        '<span class="story-item__stamp" style="box-shadow:inset 0 0 0 1.5px ' + t.ring + '"><img src="art/' + t.img + '.svg" alt=""><span>' + t.ch + '</span></span>' +
        '<span class="story-item__main">' + main + '</span>' +
        '<span class="story-item__arr">' + ARR + '</span></a>';
    }).join('');
  })();
  </script>
  <script src="nav.js" data-active="explore-map"></script>
</body>
</html>
