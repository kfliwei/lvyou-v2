<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>成果工坊 · 行迹 TRACE</title>
<link rel="stylesheet" href="design.css">
<link rel="manifest" href="manifest.webmanifest">
<script src="theme.js"></script>
<style>
  html,body{min-height:100%;margin:0;font-family:var(--font-sans);background:var(--color-bg);color:var(--color-ink)}
  /* 顶栏（与专题页同款 .t-row） */
  .topbar{position:sticky;top:0;z-index:100;background:rgba(250,248,243,.88);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);border-bottom:1px solid rgba(32,32,29,.07);box-shadow:0 6px 24px rgba(30,30,28,.05);padding:calc(env(safe-area-inset-top,0px)+8px) 14px 10px}
  .t-row{display:flex;align-items:center;gap:8px;height:42px}
  .t-row .back{width:34px;height:34px;border:0;border-radius:50%;background:var(--color-bg-soft);color:var(--color-ink);border:1px solid var(--color-line);font-size:15px;display:flex;align-items:center;justify-content:center;flex:0 0 auto;cursor:pointer}
  .t-row .back:active{transform:scale(.92)}
  .t-row .title{flex:1;min-width:0;font-family:var(--font-serif);font-weight:400;font-size:17px;color:var(--color-ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;letter-spacing:.02em}
  /* 主内容 */
  .page{width:min(100%,560px);margin:0 auto;padding:30px 20px 60px}
  .eyebrow{font-size:11px;color:var(--color-muted);letter-spacing:.28em;text-transform:uppercase;margin:0 2px 8px}
  .sect-title{font-family:var(--font-serif);font-size:24px;font-weight:400;color:var(--color-ink);margin:0 2px 6px;letter-spacing:.01em}
  .sect-sub{font-size:13px;color:var(--color-muted);line-height:1.7;margin:0 2px 18px;font-family:var(--font-sans)}
  /* 统计行：杂志式文字（非数据卡片墙） */
  .stats{display:flex;gap:22px;padding:14px 2px 20px;border-bottom:1px solid var(--color-line)}
  .stat b{display:block;font-family:var(--font-serif);font-size:20px;font-weight:400;color:var(--color-primary-dark)}
  .stat span{font-size:11px;color:var(--color-muted);letter-spacing:.06em}
  /* 入口列表：与首页「附近故事」/ explore-map 同语言（无卡片墙、无按钮感） */
  .story-list{display:flex;flex-direction:column;margin-top:8px}
  .story-item{display:flex;align-items:center;gap:14px;padding:18px 2px;text-decoration:none;border-bottom:1px solid var(--color-line);cursor:pointer;transition:padding var(--duration-fast) var(--ease-standard);background:none;border-left:0;border-right:0;border-top:0;text-align:left;width:100%;font-family:var(--font-sans)}
  .story-item:last-child{border-bottom:0}
  .story-item:active{padding-left:8px}
  .story-item__stamp{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;font-family:var(--font-serif);font-size:17px;flex:0 0 auto}
  .story-item__main{flex:1;min-width:0}
  .story-item__title{font-family:var(--font-serif);font-size:17px;font-weight:400;color:var(--color-ink);letter-spacing:.01em}
  .story-item__desc{font-size:12.5px;color:var(--color-muted);margin-top:5px;line-height:1.7;font-family:var(--font-sans)}
  .story-item__arr{color:var(--color-faint);display:grid;place-items:center;flex:0 0 auto;margin-left:8px}
  /* 空状态 */
  .empty{padding:60px 20px;text-align:center}
  .empty .em{font-family:var(--font-serif);font-size:38px;color:var(--color-primary);margin-bottom:12px}
  .empty b{font-family:var(--font-serif);font-weight:400;font-size:16px;color:var(--color-ink)}
  .empty p{font-size:13px;color:var(--color-muted);line-height:1.9;margin:8px 0 18px;font-family:var(--font-sans)}
  .empty a{color:var(--color-primary-dark);font-size:13px;text-decoration:none;border-bottom:1px solid currentColor;padding-bottom:2px}
  /* 底部说明 */
  .note{margin-top:34px;font-size:11.5px;color:var(--color-faint);text-align:center;line-height:1.8;font-family:var(--font-sans)}

/* ============================================================
   TRACE 深色模式补丁（覆盖内联浅色浮层/控件 — 跨页面保持深色）
   ============================================================ */
.theme-dark .topbar,.theme-dark .tripbar{background:rgba(29,28,25,.92);border-bottom-color:var(--color-line)}
.theme-dark .t-row .back{background:var(--color-bg-soft);border-color:var(--color-line);color:var(--color-ink)}
.theme-dark .t-row .title,.theme-dark .t-row .title small{color:var(--color-ink)}
.theme-dark .t-row .act,.theme-dark .t-row .act.sec{background:rgba(255,255,255,.06);color:var(--color-ink-soft);border-color:var(--color-line-strong)}
.theme-dark .bottom-nav,.theme-dark .tabbar{background:#1a1a17;border-top-color:var(--color-line)}
.theme-dark .bottom-nav__item,.theme-dark .tabbar button{color:var(--color-muted)}
.theme-dark .bottom-nav__item.active,.theme-dark .tabbar button.on{color:var(--color-ink);background:rgba(255,255,255,.06)}
.theme-dark .chips button{background:var(--color-surface);border-color:var(--color-line-strong);color:var(--color-ink-soft)}
.theme-dark .chips button.on{background:var(--color-primary);color:#fff;border-color:var(--color-primary)}
.theme-dark .search-bar,.theme-dark .hero__search{background:var(--color-surface);border-color:var(--color-line)}
.theme-dark .search-bar input,.theme-dark .hero__search input{color:var(--color-ink)}
.theme-dark .search-bar input::placeholder{color:var(--color-faint)}
.theme-dark .btn-secondary{background:var(--color-surface);border-color:var(--color-line-strong);color:var(--color-ink-soft)}
.theme-dark .btn-primary{background:var(--color-primary);color:#fff}
.theme-dark .text-link{color:var(--color-ink)}
.theme-dark .sheet__handle{background:rgba(239,233,220,.2)}
.theme-dark .ls-place,.theme-dark .ls-loc,.theme-dark .arrive-place{color:var(--color-ink)}
.theme-dark .ls-desc,.theme-dark .ls-hist,.theme-dark .arrive-eyebrow,.theme-dark .arrive-ask{color:var(--color-ink-soft)}
.theme-dark .ls-img{background:var(--color-bg-soft)}
.theme-dark .arrive-card{background:rgba(29,28,25,.94);border-color:var(--color-line);color:var(--color-ink)}
.theme-dark .tr-ring{opacity:.4}
.theme-dark .fab{background:var(--color-primary);color:#fff;border-color:transparent}
.theme-dark .ctl,.theme-dark .ctl button{background:rgba(29,28,25,.92);color:var(--color-ink-soft);border-color:var(--color-line)}
.theme-dark .laymenu{background:rgba(29,28,25,.97);border-color:var(--color-line)}
.theme-dark .laymenu .li{color:var(--color-ink-soft)}
.theme-dark .laymenu .li.on{background:var(--color-primary-soft);color:var(--color-primary-dark)}
.theme-dark .stat{background:rgba(29,28,25,.92);border-color:var(--color-line);color:var(--color-ink)}
.theme-dark .statOpen{background:rgba(29,28,25,.92);border-color:var(--color-line);color:var(--color-ink-soft)}
.theme-dark .statClose{background:rgba(255,255,255,.08);color:var(--color-muted)}
.theme-dark .story-item{color:var(--color-ink)}
.theme-dark .story-item__title{color:var(--color-ink)}
.theme-dark .story-item__desc{color:var(--color-ink-soft)}
.theme-dark .home-end{color:var(--color-ink-soft)}
.theme-dark .empty{color:var(--color-ink-soft)}
.theme-dark .empty b{color:var(--color-ink)}
.theme-dark .empty .em{color:var(--color-faint)}
.theme-dark .section-title{color:var(--color-ink)}
.theme-dark .eyebrow{color:var(--color-muted)}
.theme-dark .data-acts .data-danger{color:var(--color-primary-dark);border-color:var(--color-line-strong)}
.theme-dark .data-acts .data-danger:active{background:var(--color-primary-soft)}
.theme-dark .group{background:var(--color-surface);border-color:var(--color-line)}
.theme-dark .group-title{color:var(--color-ink)}
.theme-dark .group-sub,.theme-dark .row-label{color:var(--color-muted)}
.theme-dark input[type=text],.theme-dark input[type=password]{background:var(--color-bg-soft);border-color:var(--color-line);color:var(--color-ink)}
.theme-dark .storage,.theme-dark .voice-diag{color:var(--color-ink-soft)}
.theme-dark .switchrow .sw-label{color:var(--color-ink)}
.theme-dark .switchrow .sw-sub{color:var(--color-muted)}
.theme-dark .legend{background:rgba(29,28,25,.92);border-color:var(--color-line);color:var(--color-ink)}
.theme-dark .legend .lh{color:var(--color-muted)}
.theme-dark .legend .lt{color:var(--color-ink-soft)}
.theme-dark .legend .lc{color:var(--color-primary)}
.theme-dark .sp-topic,.theme-dark .sp-note{color:var(--color-ink-soft)}
.theme-dark .sp-topic{color:var(--color-primary-dark)}
.theme-dark .home-end__cta,.theme-dark .hero__cta{color:var(--color-ink)}
.theme-dark .trip-empty{color:var(--color-ink-soft)}
.theme-dark .trip-feature__title,.theme-dark .trip-feature__dates{color:var(--color-ink)}
.theme-dark .trip-feature__meta{color:var(--color-muted)}
.theme-dark .tn-item{background:var(--color-surface);border-color:var(--color-line)}
.theme-dark .tn-item h4{color:var(--color-ink)}
.theme-dark .tn-item .tm,.theme-dark .tn-item .tx{color:var(--color-ink-soft)}
.theme-dark .tn-item .tags span{background:var(--color-primary-soft);color:var(--color-primary-dark)}
.theme-dark .md-item{background:var(--color-surface);border-color:var(--color-line)}
.theme-dark .md-item h3{color:var(--color-ink)}
.theme-dark .md-item .loc,.theme-dark .md-item .meta{color:var(--color-muted)}
.theme-dark .md-item .foot{color:var(--color-primary-dark)}
.theme-dark .md-item .tags span{background:var(--color-primary-soft);color:var(--color-primary-dark)}
.theme-dark .fm-card{background:var(--color-bg-soft);border-color:var(--color-line)}
.theme-dark .fm-card dt{color:var(--color-muted)}
.theme-dark .fm-card dd,.theme-dark .md-body{color:var(--color-ink-soft)}
.theme-dark .fm-card .tags-r span{background:var(--color-primary-soft);color:var(--color-primary-dark)}
.theme-dark .footer a{color:var(--color-muted)}
</style>
</head>
<body>

<header class="topbar">
  <div class="t-row">
    <button class="back" onclick="history.length>1?history.back():location.href='index.html'" title="返回">←</button>
    <div class="title">成果工坊</div>
  </div>
</header>

<main class="page" id="page">
  <p class="eyebrow">Workshop</p>
  <h1 class="sect-title">把记录，变成可带走的结果</h1>
  <p class="sect-sub">你的游记、照片与原声，都在本机保存。这里把它们整理成一份可以保存、分享的东西。</p>

  <div class="stats" id="stats"></div>

  <div class="story-list" id="list"></div>

  <div class="note">数据仅保存在本机 · 生成的文档可保存为 HTML 带走</div>
</main>

<script src="travel-notes.js"></script>
<script src="quotes.js"></script>
<script src="results.js"></script>
<script src="vault.js"></script>
<script src="data.js" onload="window.__SITES_X=(window.SITES||[]).map(function(s){return Object.assign({topic:'山西古建'},s);})"></script>
<script src="gxyn-data.js" onload="window.__SITES_G=(window.SITES||[]).map(function(s){return Object.assign({topic:'广西云南'},s);})"></script>
<script src="qz-data.js" onload="window.__SITES_Q=(window.SITES||[]).map(function(s){return Object.assign({topic:'青藏风光'},s);})"></script>
<script src="changzheng-data.js" onload="window.__SITES_C=(window.SITES||[]).map(function(s){return Object.assign({topic:'红军长征'},s);})"></script>
<script>
  /* 统计（与 results.summarize 同口径的轻量计算） */
  function haversineKm(a, b) {
    var R = 6371, rad = Math.PI / 180;
    var dLat = (b.lat - a.lat) * rad, dLng = (b.lng - a.lng) * rad;
    var s = Math.sin(dLat / 2) * Math.sin(dLat / 2) +
      Math.cos(a.lat * rad) * Math.cos(b.lat * rad) * Math.sin(dLng / 2) * Math.sin(dLng / 2);
    return 2 * R * Math.asin(Math.sqrt(s));
  }
  function render() {
    var notes = window.TravelNotes ? TravelNotes.list() : [];
    var statsEl = document.getElementById('stats');
    var listEl = document.getElementById('list');
    var sites = new Set(notes.filter(function (n) { return n.lat != null; }).map(function (n) { return n.lat.toFixed(4) + ',' + n.lng.toFixed(4); }));
    var days = new Set(notes.map(function (n) { return n.day || (n.date ? n.date.slice(0, 10) : ''); }));
    var km = 0;
    var ordered = notes.filter(function (n) { return n.lat != null; }).sort(function (a, b) { return a.ts - b.ts; });
    for (var i = 1; i < ordered.length; i++) km += haversineKm(ordered[i - 1], ordered[i]);
    statsEl.innerHTML =
      '<div class="stat"><b>' + notes.length + '</b><span>篇游记</span></div>' +
      '<div class="stat"><b>' + sites.size + '</b><span>处地点</span></div>' +
      '<div class="stat"><b>' + days.size + '</b><span>天</span></div>' +
      '<div class="stat"><b>' + (km > 0 ? km.toFixed(0) : '—') + '</b><span>公里</span></div>';

    var entries = [
      { k: 'album', stamp: '册', title: '旅行纪念册', desc: '全部游记统计成册，含名言点缀', color: 'var(--color-primary-soft)', ink: 'var(--color-primary-dark)' },
      { k: 'atlas', stamp: '鉴', title: '个人古建图鉴', desc: '探访过的古建，汇成收藏册', color: 'rgba(109,125,136,.14)', ink: 'var(--color-blue)' },
      { k: 'iti', stamp: '路', title: '定制路书', desc: '输入偏好，生成每日行程', color: 'rgba(113,128,108,.14)', ink: 'var(--color-green)' },
      { k: 'story', stamp: '文', title: '旅程故事', desc: '把旅程，写成散文', color: 'rgba(140,123,102,.14)', ink: 'var(--color-primary-dark)' },
      { k: 'vault', stamp: '库', title: '导出 Obsidian 库', desc: '每篇一篇 Markdown，含照片与索引', color: 'rgba(200,109,75,.10)', ink: 'var(--color-primary)' }
    ];
    var html = '';
    entries.forEach(function (e) {
      html += '<button class="story-item" data-k="' + e.k + '">'
        + '<span class="story-item__stamp" style="background:' + e.color + ';color:' + e.ink + '">' + e.stamp + '</span>'
        + '<span class="story-item__main"><span class="story-item__title">' + e.title + '</span>'
        + '<span class="story-item__desc">' + e.desc + '</span></span>'
        + '<span class="story-item__arr"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6 L15 12 L9 18"/></svg></span>'
        + '</button>';
    });
    if (!notes.length) {
      html = '<div class="empty"><div class="em">记</div><b>还没有游记</b>'
        + '<p>去专题地图，在景点弹窗里点「语音记录」，<br>留下第一段记忆。</p>'
        + '<a href="changzheng.html">去长征专题看看 →</a></div>';
    }
    listEl.innerHTML = html;
    listEl.querySelectorAll('button[data-k]').forEach(function (b) {
      b.onclick = function () {
        var k = b.dataset.k;
        if (k === 'vault') {
          if (window.Vault) Vault.exportVault(window.TravelNotes ? TravelNotes.list() : []);
          return;
        }
        if (!window.Results) return;
        if (k === 'album') Results.album();
        else if (k === 'atlas') Results.atlas();
        else if (k === 'iti') openItinerary();
        else if (k === 'story') Results.story();
      };
    });
  }
  /* 定制路书：先选专题，再调用 results.buildItinerary（兼容 4 专题字段） */
  function openItinerary(){
    var topics = [
      { label:'山西古建', sites: window.__SITES_X || [] },
      { label:'广西云南', sites: window.__SITES_G || [] },
      { label:'青藏风光', sites: window.__SITES_Q || [] },
      { label:'红军长征', sites: window.__SITES_C || [] }
    ];
    if (!topics.some(function(t){return t.sites.length;})) { toast('暂无专题数据'); return; }
    if (!window.__itiEl) {
      var d = document.createElement('div');
      d.style.cssText = 'position:fixed;inset:0;z-index:9500;background:rgba(32,32,29,.5);display:flex;align-items:center;justify-content:center;padding:20px';
      d.innerHTML = '<div style="background:var(--color-surface,#FAF8F3);border-radius:20px;max-width:340px;width:100%;padding:20px;box-shadow:0 18px 50px rgba(30,30,28,.3)">'
        + '<div style="font-family:var(--font-serif);font-size:18px;color:var(--color-ink,#20201D);margin-bottom:4px">定制路书</div>'
        + '<div style="font-size:12.5px;color:var(--color-muted,#7D7970);margin-bottom:14px">先选一个专题，基于真实景点生成每日行程</div>'
        + '<div id="itiList"></div>'
        + '<button id="itiX" style="width:100%;height:46px;border:0;border-radius:12px;background:var(--color-bg-soft,#E6E1D7);color:var(--color-muted,#7D7970);font-size:14px;cursor:pointer;margin-top:6px">取消</button></div>';
      d.onclick = function(e){ if (e.target === d) d.remove(); };
      d.querySelector('#itiX').onclick = function(){ d.remove(); };
      document.body.appendChild(d);
      window.__itiEl = d;
    }
    var box = window.__itiEl.querySelector('#itiList');
    box.innerHTML = '';
    topics.forEach(function(t){
      if (!t.sites.length) return;
      var b = document.createElement('button');
      b.textContent = t.label + '（' + t.sites.length + ' 处）';
      b.style.cssText = 'width:100%;min-height:48px;border:0;border-radius:12px;background:var(--color-primary,#C86D4B);color:#fff;font-size:14px;font-weight:600;cursor:pointer;margin-bottom:9px';
      b.onclick = function(){ window.__itiEl.remove(); if (window.Results) Results.itinerary(t.sites, t.label); };
      box.appendChild(b);
    });
    window.__itiEl.style.display = 'flex';
  }
  window.TravelNotes._onReady = render;
  window.TravelNotes._afterSave = render;
  TravelNotes.init({});
</script>
</body>
</html>
