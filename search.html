<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>搜索 · 行迹</title>
<link rel="manifest" href="manifest.webmanifest">
<script src="theme.js"></script>
<link rel="stylesheet" href="design.css">
<style>
  html,body{height:100%;margin:0;font-family:var(--font-sans);background:var(--color-bg);color:var(--color-ink)}
  .page{max-width:560px;margin:0 auto;min-height:100dvh;padding-bottom:60px}
  .sbar{flex:1;display:flex;align-items:center;gap:8px;background:var(--color-surface);border:1.5px solid var(--color-line);border-radius:999px;padding:4px 6px 4px 14px;min-width:0}
  .sbar input{flex:1;min-width:0;border:0;outline:0;background:transparent;font-size:14.5px;color:var(--color-ink);height:34px}
  .sbar .mic{flex:0 0 auto;width:40px;height:40px;border:0;border-radius:50%;background:var(--color-primary-soft);color:var(--color-primary-dark);font-size:15px;cursor:pointer}
  .sbar .mic:active{transform:scale(.92)}
  .sbar .mic.rec{background:var(--color-primary);color:#fff;animation:mic-pulse 1.2s ease-in-out infinite}
  @keyframes mic-pulse{0%,100%{box-shadow:0 0 0 0 rgba(200,109,75,.4)}50%{box-shadow:0 0 0 8px rgba(200,109,75,0)}}
  .chips{display:flex;gap:6px;overflow-x:auto;padding:10px 14px 4px;scrollbar-width:none}
  .chips::-webkit-scrollbar{display:none}
  .chip{flex:0 0 auto;font-size:12px;padding:6px 14px;border-radius:999px;border:1px solid var(--color-line);background:var(--color-surface);color:var(--color-ink-soft);cursor:pointer}
  .chip.on{background:var(--color-primary);border-color:var(--color-primary);color:#fff;font-weight:600}
  .result{padding:6px 14px 20px}
  .sec-t{font-size:0.6875rem;color:var(--color-muted);letter-spacing:.24em;margin:16px 2px 8px;display:flex;align-items:baseline;gap:8px}
  .sec-t b{font-size:0.8125rem;color:var(--color-ink);letter-spacing:.02em}
  .sec-t span{font-size:0.6875rem;color:var(--color-faint)}
  .item{display:flex;align-items:center;gap:12px;background:var(--color-surface);border:1px solid var(--color-line);border-radius:14px;padding:11px 14px;margin-bottom:8px;cursor:pointer;box-shadow:var(--shadow-soft)}
  .item:active{transform:scale(.985)}
  .item .dot{flex:0 0 8px;width:8px;height:8px;border-radius:50%}
  .item .main{flex:1;min-width:0}
  .item .nm{font-size:14px;font-weight:600;color:var(--color-ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .item .nm .bdg{display:inline-block;font-size:9.5px;padding:0 6px;border-radius:999px;margin-left:6px;vertical-align:1px;font-weight:600}
  .bdg-m{background:rgba(201,162,39,.14);color:#8A6D1F;border:1px solid rgba(201,162,39,.38)}
  .bdg-h{background:rgba(255,122,80,.1);color:#C25A38;border:1px solid rgba(255,122,80,.36)}
  .item .sub{font-size:0.7188rem;color:var(--color-muted);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .item .ds{font-size:0.75rem;color:var(--color-ink-soft);margin-top:3px;line-height:1.6;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
  .item .arr{flex:0 0 auto;color:var(--color-faint);font-size:14px}
  .empty{padding:60px 20px;text-align:center}
  .empty .em{font-family:var(--font-serif);font-size:42px;color:var(--color-faint)}
  .empty b{display:block;margin-top:12px;font-family:var(--font-serif);font-weight:400;font-size:18px;color:var(--color-ink)}
  .empty span{display:block;margin-top:6px;font-size:12.5px;color:var(--color-muted)}
  .skel{height:56px;border-radius:14px;background:linear-gradient(90deg,var(--color-bg-soft),var(--color-surface),var(--color-bg-soft));background-size:200% 100%;animation:sk 1.2s infinite;margin-bottom:8px}
  @keyframes sk{0%{background-position:200% 0}100%{background-position:-200% 0}}
</style>
</head>
<body>
<div class="page">
  <div class="topbar">
    <div class="t-row">
      <button class="back" onclick="history.length>1?history.back():location.href='index.html'" aria-label="返回">‹</button>
      <div class="sbar">
        <input id="q" type="search" placeholder="搜景点、游记、专题…" autocomplete="off">
        <button class="mic" id="mic" title="语音搜索" aria-label="语音搜索"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11 a7 7 0 0 0 14 0 M12 18 v3"/></svg></button>
      </div>
    </div>
  </div>
  <div class="chips" id="chips"><span class="chip on" data-r="">全部</span></div>
  <div class="chips" id="themeChips" style="display:none"></div>
  <div class="result" id="result">
    <div id="skel"></div>
  </div>
</div>

<script src="topic-meta-lite.js"></script>
<script src="travel-notes.js"></script>
<script src="ui.js"></script>
<script>
(function(){
  var SITES=null, REGS=null, loaded=false, state={q:'', region:'', theme:'', limit:20};
  var $q=document.getElementById('q'), $r=document.getElementById('result'), $c=document.getElementById('chips'), $sk=document.getElementById('skel');

  /* 省简称 → 专题 key（与 nation-index 的 region 简称一致；广西/云南共属「广西云南」gy 合并专题） */
  var PROV_KEY={'北京':'bj','天津':'tj','河北':'he','山西':'sx','内蒙古':'nmg','辽宁':'ln','吉林':'jl','黑龙江':'hlj','上海':'sh','江苏':'js','浙江':'zj','安徽':'ah','福建':'fj','江西':'jx','山东':'sd','河南':'ha','湖北':'hb','湖南':'hn','广东':'gd','广西':'gy','海南':'hi','重庆':'cq','四川':'sc','贵州':'gz','云南':'gy','西藏':'xz','陕西':'sx2','甘肃':'gs','青海':'qh','宁夏':'nx','新疆':'xj','香港':'hk','澳门':'mo','台湾':'tw'};

  function loadData(cb){
    if(SITES){cb();return;}
    var s=document.createElement('script');
    s.src='nation-index.js?v=20260816';
    s.onload=function(){
      SITES=(window.NATION_SITES_RAW||'').split('\n').map(function(line){
        var p=line.split('|');
        return {name:p[0],label:p[1],region:p[2],city:p[3],county:p[4],theme:p[5],flag:p[6],lat:+p[7],lng:+p[8],desc:p[9]||''};
      });
      var m={};
      SITES.forEach(function(x){var r=x.region||'其他';if(!m[r])m[r]=0;m[r]++;});
      REGS=Object.keys(m).sort(function(a,b){return m[b]-m[a];});
      buildChips(); loaded=true; cb();
    };
    s.onerror=function(){ loaded=true; REGS=[]; $r.innerHTML=''; render(); };
    document.head.appendChild(s);
  }
  function buildChips(){
    var html='<span class="chip on" data-r="">全部</span>';
    REGS.forEach(function(r){ html+='<span class="chip" data-r="'+r+'">'+r+'</span>'; });
    $c.innerHTML=html;
    $c.querySelectorAll('.chip[data-r]').forEach(function(ch){
      ch.onclick=function(){ state.region=ch.dataset.r; state.limit=20; $c.querySelectorAll('.chip[data-r]').forEach(function(x){x.classList.toggle('on',x===ch);}); render(); };
    });
    /* 主题筛选（第二行，top 12 高频主题） */
    var th={};
    SITES.forEach(function(x){ var t=x.theme||'其他'; th[t]=(th[t]||0)+1; });
    var tops=Object.keys(th).sort(function(a,b){return th[b]-th[a];}).slice(0,12);
    var $t=document.getElementById('themeChips');
    if(tops.length){ $t.style.display=''; $t.innerHTML='<span class="chip on" data-th="">全部主题</span>' + tops.map(function(t){ return '<span class="chip" data-th="'+esc(t)+'">'+esc(t)+'</span>'; }).join(''); }
    $t.querySelectorAll('.chip[data-th]').forEach(function(ch){
      ch.onclick=function(){ state.theme=ch.dataset.th; state.limit=20; $t.querySelectorAll('.chip[data-th]').forEach(function(x){x.classList.toggle('on',x===ch);}); render(); };
    });
  }
  function esc(s){return window.UI.esc(s);}
  function flagHtml(s){var f=s.flag||'';return (f.indexOf('m')>=0?'<span class="bdg bdg-m">必去</span>':'')+(f.indexOf('h')>=0?'<span class="bdg bdg-h">网红</span>':'');}

  function render(){
    var q=state.q.trim().toLowerCase();
    var words=q.split(/\s+/).filter(Boolean);
    if(!loaded){ $sk.style.display=''; $r.innerHTML='<div id="skel"></div>'; return; }
  if(!state.q.trim()){
    var hist=[], rec=[];
    try{ hist=JSON.parse(localStorage.getItem('tn_search_hist')||'[]'); }catch(e){}
    try{ rec=JSON.parse(localStorage.getItem('tn_recent')||'[]'); }catch(e){}
    var html='';
    if(hist.length){
      html+='<div class="sec-t"><b>搜索历史</b><span style="font-size:11px;cursor:pointer" id="clrHist">清空</span></div><div class="chip-row" style="flex-wrap:wrap;gap:8px;padding:2px 0 10px" id="histChips">'+
        hist.map(function(w){ return '<button class="chip" data-h="'+esc(w)+'">'+esc(w)+'</button>'; }).join('')+'</div>';
    }
    if(rec.length){
      html+='<div class="sec-t"><b>最近浏览</b></div>';
      rec.forEach(function(r){
        html+='<div class="item" data-rk="'+esc(r.k)+'" data-rn="'+esc(r.n)+'" role="button" tabindex="0" aria-label="'+esc(r.n)+'"><span class="dot" style="background:#C86D4B"></span><div class="main"><div class="nm">'+esc(r.n)+'</div><div class="sub">最近查看 · 点击回看</div></div><span class="arr">›</span></div>';
      });
    }
    if(!html) html='<div class="empty" style="padding:24px 14px"><span>输入关键词搜索全部景点</span></div>';
    $r.innerHTML=html;
    $r.querySelectorAll('.chip[data-h]').forEach(function(c){
      c.onclick=function(){ $q.value=c.dataset.h; state.q=c.dataset.h; recordHist(c.dataset.h); render(); };
    });
    var clr=document.getElementById('clrHist');
    if(clr) clr.onclick=function(){ try{ localStorage.removeItem('tn_search_hist'); }catch(e){} render(); };
    $r.querySelectorAll('.item[data-rk]').forEach(function(it){
      it.onclick=function(){ location.href='topic.html?p='+it.dataset.rk+'&q='+encodeURIComponent(it.dataset.rn); };
      it.onkeydown=function(e){ if(e.key==='Enter'||e.key===' '){ e.preventDefault(); it.onclick(); } };
    });
    return;
  }
    $sk.style.display='none';
    var out='';

    /* 专题组（空关键词时展示） */
    if(!q){
      out+='<div class="sec-t"><b>专题地图</b><span>'+(window.TOPIC_REGISTRY?Object.keys(window.TOPIC_REGISTRY).length:0)+' 个</span></div>';
      Object.keys(window.TOPIC_REGISTRY||{}).forEach(function(k){
        var t=window.TOPIC_REGISTRY[k]; if(k==='nation') return;
        var cnt=(window.TOPIC_COUNTS&&window.TOPIC_COUNTS[k])||0;
        out+='<div class="item" data-go="topic.html?p='+k+'"><span class="dot" style="background:var(--color-primary)"></span><div class="main"><div class="nm">'+esc(t.title)+'</div><div class="sub">'+(cnt?'约 '+cnt+' 处景点':'专题地图')+'</div></div><span class="arr">›</span></div>';
      });
    }

    /* 景点组 */
    var hits=[];
    if(q){
      SITES.forEach(function(s){
        if(state.region && s.region!==state.region) return;
        if(state.theme && (s.theme||'')!==state.theme) return;
        var hay=(s.name+' '+s.label+' '+s.region+' '+s.city+' '+s.county+' '+(s.theme||'')+' '+(s.desc||'')).toLowerCase();
        if(words.every(function(w){ return hay.indexOf(w)>=0; })) hits.push(s);
      });
      out+='<div class="sec-t"><b>景点</b><span>'+hits.length+' 个</span></div>';
      var limit = state.limit || 20;
      hits.slice(0, limit).forEach(function(s){
        var key=PROV_KEY[s.region];
        out+='<div class="item" role="button" tabindex="0" aria-label="'+esc(s.label)+'" data-go="'+(key?'topic.html?p='+key+'&q='+encodeURIComponent(s.name):'topic.html?p=nation&q='+encodeURIComponent(s.name))+'"><span class="dot" style="background:#8C7B66"></span><div class="main"><div class="nm">'+esc(s.label)+flagHtml(s)+'</div><div class="sub">'+esc(s.region+' · '+(s.city||'')+(s.county?' · '+s.county:'')+(s.theme?' · '+s.theme:''))+'</div></div><span class="arr">›</span></div>';
      });
      if(!hits.length) out+='<div class="empty" style="padding:30px 20px"><span>没有匹配的景点，试试其他关键词</span><a href="topic.html?p=nation" style="display:inline-block;margin-top:12px;color:var(--color-primary-dark);font-weight:600">去全国地图逛逛 →</a></div>';
      else if (hits.length > limit) out+='<div class="sec-t" style="text-align:center;cursor:pointer" id="moreBtn"><span style="color:var(--color-primary-dark);font-size:13px">还有 ' + (hits.length - limit) + ' 处，点击加载更多 ↓</span></div>';
    }

    /* 游记组 */
    var notes=(window.TravelNotes&&TravelNotes.list)?TravelNotes.list():[];
    var nh=q?notes.filter(function(n){
      var hay=((n.title||'')+' '+(n.siteName||'')+' '+(n.text||'')+' '+(n.raw||'')+' '+(n.tags||[]).join(' ')+' '+(n.weather||'')+' '+(n.province||'')+' '+(n.city||'')).toLowerCase();
      return words.every(function(w){ return hay.indexOf(w)>=0; });
    }):notes.slice(0,5);
    out+='<div class="sec-t"><b>游记</b><span>'+nh.length+' 篇</span></div>';
    nh.slice(0,15).forEach(function(n){
      out+='<div class="item" data-go="travel-map.html?id='+encodeURIComponent(n.id||'')+'"><span class="dot" style="background:#71806C"></span><div class="main"><div class="nm">'+esc(n.title||n.siteName||'未命名')+'</div><div class="sub">'+esc((n.date||'')+(n.province?' · '+n.province:'')+(n.siteName?' · '+n.siteName:''))+'</div></div><span class="arr">›</span></div>';
    });
    if(!nh.length && q) out+='<div class="empty" style="padding:30px 20px"><span>没有匹配的游记</span></div>';

    $r.innerHTML=out;
    var mb = document.getElementById('moreBtn');
    if (mb) mb.onclick = function () { state.limit = (state.limit || 20) + 20; render(); };
    $r.querySelectorAll('.item').forEach(function(it){
      it.onclick=function(){ location.href=it.dataset.go; };
      it.onkeydown=function(e){ if(e.key==='Enter'||e.key===' '){ e.preventDefault(); location.href=it.dataset.go; } };
    });
  }

  function recordHist(q){
  if(!q) return;
  try{
    var h=JSON.parse(localStorage.getItem('tn_search_hist')||'[]').filter(function(x){ return x!==q; });
    h.unshift(q);
    localStorage.setItem('tn_search_hist', JSON.stringify(h.slice(0,10)));
  }catch(e){}
}
$q.oninput=function(){ state.q=$q.value; state.limit=20; clearTimeout(state._t); state._t=setTimeout(render, 250); };
  $q.onkeydown=function(e){ if(e.key==='Enter'){ recordHist($q.value.trim()); render(); } };

  /* 语音搜索：AndroidVoice（壳内）/ Web Speech（浏览器） */
  var mic=document.getElementById('mic');
  mic.onclick=function(){
    if(window.AndroidVoice && typeof AndroidVoice.startVoice==='function'){
      window.__tnOnVoiceResult=function(t){ $q.value=t; state.q=t; render(); mic.classList.remove('rec'); };
      window.__tnOnVoiceError=function(){ mic.classList.remove('rec'); };
      AndroidVoice.startVoice(); mic.classList.add('rec'); return;
    }
    var SR=window.SpeechRecognition||window.webkitSpeechRecognition;
    if(SR){
      try{
        var rec=new SR(); rec.lang='zh-CN';
        rec.onresult=function(e){ $q.value=e.results[0][0].transcript; state.q=$q.value; render(); mic.classList.remove('rec'); };
        rec.onend=function(){ mic.classList.remove('rec'); };
        mic.classList.add('rec'); rec.start();
      }catch(e){ mic.classList.remove('rec'); UI.toast('语音识别不可用'); }
    }else{ UI.toast('当前环境不支持语音识别'); }
  };

  /* 骨架屏 */
  var sk=''; for(var i=0;i<4;i++) sk+='<div class="skel"></div>';
  $sk.innerHTML=sk;
  $sk.style.display='';
  /* 支持 ?q= 直达：从首页搜索框等入口带关键词跳转 */
  var qp = new URLSearchParams(location.search).get('q');
  if (qp) { $q.value = qp; state.q = qp; }
  loadData(function(){ render(); });
})();
</script>
</body>
</html>
