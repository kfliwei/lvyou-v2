<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>我的 · 行迹</title>
<link rel="stylesheet" href="design.css">
<style>
  html,body{height:100%;margin:0;font-family:var(--font-sans);background:var(--color-bg);color:var(--color-ink)}
  .page{max-width:560px;margin:0 auto;min-height:100dvh;padding-bottom:60px}
  /* 顶栏 */
  .topbar{position:sticky;top:0;z-index:100;background:rgba(250,248,243,.9);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);border-bottom:1px solid rgba(32,32,29,.07);padding:calc(env(safe-area-inset-top,0px)+8px) 14px 10px}
  .t-row{display:flex;align-items:center;gap:8px;height:42px}
  .t-row .back{width:34px;height:34px;border:1px solid var(--color-line);border-radius:50%;background:var(--color-bg-soft);color:var(--color-ink);font-size:15px;display:flex;align-items:center;justify-content:center;flex:0 0 auto;cursor:pointer}
  .t-row .back:active{transform:scale(.92)}
  .t-row .title{flex:1;min-width:0;font-family:var(--font-serif);font-weight:400;font-size:18px;color:var(--color-ink);letter-spacing:.02em}
  .t-row .title small{font-family:var(--font-sans);font-weight:400;font-size:11px;color:var(--color-muted);margin-left:6px;letter-spacing:.06em}
  /* 内容 */
  .content{padding:18px 16px 40px}
  .group{background:var(--color-surface);border:1px solid var(--color-line);border-radius:18px;box-shadow:var(--shadow-soft);padding:16px;margin-bottom:14px}
  .group-title{font-family:var(--font-serif);font-size:15px;color:var(--color-ink);margin-bottom:4px}
  .group-sub{font-size:11.5px;color:var(--color-muted);line-height:1.7;margin-bottom:12px;font-family:var(--font-sans)}
  .row{margin-bottom:14px}
  .row:last-child{margin-bottom:0}
  .row-label{font-size:12px;color:var(--color-ink-soft);margin-bottom:7px;font-weight:600}
  input[type=text],input[type=password]{width:100%;min-height:46px;padding:0 14px;border:1px solid var(--color-line);border-radius:12px;font-size:14px;background:var(--color-bg-soft);color:var(--color-ink);outline:0;box-sizing:border-box;font-family:var(--font-sans)}
  input:focus{border-color:var(--color-primary);box-shadow:0 0 0 3px var(--color-primary-soft)}
  .chips{display:flex;gap:8px;flex-wrap:wrap}
  .chips button{padding:8px 16px;border:1px solid var(--color-line-strong);border-radius:999px;background:var(--color-surface);color:var(--color-ink-soft);font-size:12.5px;cursor:pointer;font-family:var(--font-sans)}
  .chips button.on{background:var(--color-primary);border-color:var(--color-primary);color:#fff;font-weight:600;box-shadow:0 3px 12px rgba(200,109,75,.22)}
  /* 开关 */
  .switchrow{display:flex;align-items:center;justify-content:space-between;padding:9px 0}
  .switchrow .sw-label{font-size:13.5px;color:var(--color-ink)}
  .switchrow .sw-sub{font-size:11px;color:var(--color-muted);margin-top:2px;font-family:var(--font-sans)}
  .sw{width:48px;height:28px;border-radius:999px;background:var(--color-primary);position:relative;flex:0 0 auto;cursor:pointer;transition:background var(--duration-normal)}
  .sw::after{content:"";position:absolute;top:3px;right:3px;width:22px;height:22px;background:#fff;border-radius:50%;box-shadow:0 1px 4px rgba(0,0,0,.25);transition:right var(--duration-normal)}
  .sw.off{background:var(--color-line-strong)}
  .sw.off::after{right:auto;left:3px}
  /* 存储 */
  .storage{font-size:14px;color:var(--color-ink-soft);font-weight:600}
  /* 数据管理按钮 */
  .data-acts{display:flex;flex-direction:column;gap:10px}
  .data-acts .btn-primary,.data-acts .btn-secondary{width:100%;min-height:46px;border-radius:999px;font-size:14px;font-family:var(--font-sans)}
  .data-danger{width:100%;min-height:46px;border:1px solid var(--color-line-strong);border-radius:999px;background:transparent;color:var(--color-primary-dark);font-size:14px;cursor:pointer;font-family:var(--font-sans)}
  .data-danger:active{background:var(--color-primary-soft)}
  .savebar{position:fixed;left:50%;transform:translateX(-50%);bottom:14px;width:min(calc(100% - 28px),528px);z-index:90}
  .savebar .btn-primary{width:100%;min-height:50px;border-radius:999px;font-size:15px;font-family:var(--font-sans);box-shadow:0 10px 28px rgba(200,109,75,.3)}
  body{padding-bottom:80px}
</style>
</head>
<body>
<div class="page">
  <header class="topbar">
    <div class="t-row">
      <button class="back" onclick="location.href='index.html'">←</button>
      <div class="title">我的 <small id="statLabel"></small></div>
    </div>
  </header>

  <div class="content">
    <!-- AI 润色 -->
    <div class="group">
      <div class="group-title">AI 润色</div>
      <div class="group-sub">「整理一下」与讲解功能使用的密钥。只保存在本机。</div>
      <div class="row">
        <div class="row-label">DeepSeek API Key</div>
        <input type="password" id="inKey" placeholder="sk-…" autocomplete="off">
      </div>
      <div class="row">
        <div class="row-label">模型</div>
        <div class="chips" id="chModel">
          <button data-m="deepseek-v4-flash">V4-Flash</button>
          <button data-m="deepseek-v4-pro">V4-Pro</button>
        </div>
      </div>
    </div>

    <!-- 录音 -->
    <div class="group">
      <div class="group-title">录音</div>
      <div class="group-sub">语音记录的识别与停顿习惯。</div>
      <div class="row">
        <div class="row-label">说完停顿多久自动结束</div>
        <div class="chips" id="chVad">
          <button data-v="3000">3 秒</button>
          <button data-v="5000">5 秒</button>
          <button data-v="8000">8 秒</button>
        </div>
      </div>
      <div class="switchrow">
        <div><div class="sw-label">保留原声</div><div class="sw-sub">保存语音原文，可在游记里回放</div></div>
        <div class="sw" id="swKeep" onclick="toggle('swKeep','tn_keepAudio')"></div>
      </div>
      <div class="voice-diag" id="voiceDiag" style="margin-top:12px;font-size:12px;color:var(--color-muted);line-height:1.8"></div>
    </div>

    <!-- 游记 -->
    <div class="group">
      <div class="group-title">游记</div>
      <div class="switchrow">
        <div><div class="sw-label">主题游记</div><div class="sw-sub">给游记加主题样式</div></div>
        <div class="sw" id="swTheme" onclick="toggle('swTheme','tn_themeNotes')"></div>
      </div>
    </div>

    <!-- 存储 -->
    <div class="group">
      <div class="group-title">存储</div>
      <div class="storage" id="storage">—</div>
    </div>

    <!-- 数据管理 -->
    <div class="group">
      <div class="group-title">数据管理</div>
      <div class="group-sub">数据仅保存在本机，可导出备份带走。</div>
      <div class="data-acts">
        <button class="btn-secondary" onclick="TravelNotes.exportNotes()">导出备份</button>
        <button class="btn-secondary" onclick="TravelNotes.importNotes()">导入备份</button>
        <button class="btn-secondary" onclick="location.href='md-manager.html'">管理 MD 库</button>
        <button class="btn-secondary" onclick="if(window.Vault)Vault.exportVault(TravelNotes.list())">导出 Obsidian 库</button>
        <button class="data-danger" onclick="clearAll()">清除全部数据</button>
      </div>
      <div style="margin-top:14px;text-align:center">
        <a href="test-data.html" style="font-size:12.5px;color:var(--color-primary-dark);text-decoration:none">载入示例数据（演示用）→</a>
      </div>
    </div>
  </div>

  <div class="savebar">
    <button class="btn-primary" onclick="saveSettings()">保存设置</button>
  </div>
</div>

<script src="quotes.js"></script>
<script src="travel-notes.js"></script>
<script src="vault.js"></script>
<script>
  function fmtSize(mb){ return mb.toFixed(1) + ' MB'; }
  function refreshStorage(){
    var mb = 0;
    try {
      var raw = localStorage.getItem('travelNotes');
      if (raw) mb = (raw.length / 1048576);
      // 加上录音等
      var audio = localStorage.getItem('tn_audio');
      if (audio) mb += (audio.length / 1048576);
    } catch(e){}
    var st = document.getElementById('storage');
    st.textContent = fmtSize(mb);
    st.style.color = mb > 3 ? 'var(--color-primary-dark)' : 'var(--color-ink-soft)';
  }
  function refreshVoiceDiag(){
    /* 语音引擎诊断：讯飞/Google 可用性 + 最近一次识别错误码 + 崩溃日志（便于定位"语音闪退"） */
    var el = document.getElementById('voiceDiag');
    if (!el) return;
    var lines = [];
    if (window.AndroidVoice && AndroidVoice.getVoiceInfo) {
      try {
        var info = JSON.parse(AndroidVoice.getVoiceInfo());
        lines.push('识别引擎：' + (info.xf ? '讯飞 正常' : '讯飞 未就绪') + (info.google ? ' · Google 可用' : ' · Google 不可用'));
      } catch (e) { lines.push('识别引擎：未知'); }
    } else {
      lines.push('当前非 App 环境：无原生语音引擎（网页版不支持录音）');
    }
    var last = '';
    try { last = localStorage.getItem('tn_lastVoiceError') || ''; } catch (e) {}
    if (last) lines.push('上次识别：' + last);
    if (window.AndroidVoice && AndroidVoice.getCrashLog) {
      try {
        var crash = AndroidVoice.getCrashLog() || '';
        if (crash) {
          var head = crash.split('\n').slice(0, 3).join(' ');
          lines.push('上次崩溃：' + (head.length > 120 ? head.slice(0, 120) + '…' : head));
        }
      } catch (e) {}
    }
    el.innerHTML = lines.join('<br>');
    el.style.color = (last.indexOf('授权') >= 0) ? 'var(--color-primary-dark)' : 'var(--color-muted)';
  }
  function loadSettings(){
    document.getElementById('inKey').value = localStorage.getItem('tn_aiKey') || '';
    var m = localStorage.getItem('tn_model') || 'deepseek-v4-flash';
    document.querySelectorAll('#chModel button').forEach(function(b){ b.classList.toggle('on', b.dataset.m === m); });
    var v = localStorage.getItem('tn_vad') || '5000';
    document.querySelectorAll('#chVad button').forEach(function(b){ b.classList.toggle('on', b.dataset.v === v); });
    var keep = localStorage.getItem('tn_keepAudio') !== '0';
    document.getElementById('swKeep').className = 'sw' + (keep ? '' : ' off');
    var theme = localStorage.getItem('tn_themeNotes') === '1';
    document.getElementById('swTheme').className = 'sw' + (theme ? '' : ' off');
    refreshStorage();
    refreshVoiceDiag();
  }
  function saveSettings(){
    var key = document.getElementById('inKey').value.trim();
    if (key) localStorage.setItem('tn_aiKey', key); else localStorage.removeItem('tn_aiKey');
    var m = document.querySelector('#chModel button.on');
    if (m) localStorage.setItem('tn_model', m.dataset.m);
    var v = document.querySelector('#chVad button.on');
    if (v) localStorage.setItem('tn_vad', v.dataset.v);
    toast('设置已保存');
  }
  function toggle(id, k){
    var el = document.getElementById(id);
    var off = el.classList.contains('off');
    el.classList.toggle('off', !off);
    if (k === 'tn_keepAudio') localStorage.setItem('tn_keepAudio', off ? '1' : '0');
    if (k === 'tn_themeNotes') localStorage.setItem('tn_themeNotes', off ? '1' : '0');
  }
  function clearAll(){
    if (!confirm('确定清除全部游记数据？此操作不可恢复。')) return;
    if (window.TravelNotes && TravelNotes.clearNotes) TravelNotes.clearNotes();
    refreshStorage();
  }
  function toast(msg){
    var d = document.createElement('div');
    d.style.cssText = 'position:fixed;top:calc(env(safe-area-inset-top,0px)+14px);left:50%;transform:translateX(-50%);background:rgba(32,32,29,.92);color:#fff;padding:12px 22px;border-radius:999px;font-size:13px;z-index:9999;box-shadow:0 8px 24px rgba(30,30,28,.18)';
    d.textContent = msg; document.body.appendChild(d);
    setTimeout(function(){ d.remove(); }, 2000);
  }
  document.querySelector('#chModel').addEventListener('click', function(e){
    if (e.target.tagName === 'BUTTON') {
      this.querySelectorAll('button').forEach(function(b){ b.classList.remove('on'); });
      e.target.classList.add('on');
    }
  });
  document.querySelector('#chVad').addEventListener('click', function(e){
    if (e.target.tagName === 'BUTTON') {
      this.querySelectorAll('button').forEach(function(b){ b.classList.remove('on'); });
      e.target.classList.add('on');
    }
  });
  loadSettings();
  var notesCount = (window.TravelNotes && TravelNotes.list()) ? TravelNotes.list().length : 0;
  document.getElementById('statLabel').textContent = notesCount ? notesCount + ' 篇游记' : '';
</script>
</body>
</html>
