<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no,viewport-fit=cover">
<title>节点管理 · 行迹</title>
<link rel="manifest" href="manifest.webmanifest">
<script src="theme.js"></script>
<link rel="stylesheet" href="design.css">
<link rel="stylesheet" href="map.css">
<link rel="stylesheet" href="vendor/leaflet/leaflet.css">
<style>
  html,body{height:100%;margin:0;font-family:var(--font-sans);background:var(--color-bg);color:var(--color-ink);overflow:hidden}
  #mapEl{position:absolute;inset:0;z-index:1}
  .nm-topbar{position:fixed;left:0;right:0;top:0;z-index:9500;display:flex;align-items:center;gap:8px;padding:calc(env(safe-area-inset-top,0px)+8px) 14px 10px;background:rgba(250,248,243,.92);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);border-bottom:1px solid rgba(32,32,29,.07)}
  .nm-topbar .back{width:40px;height:40px;border:1px solid var(--color-line);border-radius:50%;background:var(--color-bg-soft);color:var(--color-ink);font-size:15px;display:flex;align-items:center;justify-content:center;flex:0 0 auto;cursor:pointer}
  .nm-topbar .title{flex:1;min-width:0;font-family:var(--font-serif);font-weight:400;font-size:18px;color:var(--color-ink);letter-spacing:.02em}
  .nm-topbar .title small{font-family:var(--font-sans);font-size:11px;color:var(--color-muted);margin-left:6px;letter-spacing:.06em}
  .nm-topbar .mine{min-height:40px;padding:0 16px;border-radius:999px;border:1px solid var(--color-line-strong);background:var(--color-surface);color:var(--color-ink-soft);font-size:13px;cursor:pointer;font-family:var(--font-sans)}
  .nm-tip{position:fixed;left:50%;transform:translateX(-50%);bottom:112px;z-index:9400;background:rgba(32,32,29,.88);color:#fff;font-size:12px;padding:7px 14px;border-radius:999px;white-space:nowrap;box-shadow:0 6px 20px rgba(0,0,0,.25);pointer-events:none;opacity:0;transition:opacity .25s}
  .nm-tip.show{opacity:1}
  #infoSheet{position:fixed;z-index:9500;left:8px;right:8px;bottom:8px;display:none;max-height:70dvh;overflow-y:auto;background:var(--color-surface);border:1px solid var(--color-line);border-radius:20px;box-shadow:0 18px 50px rgba(30,30,28,.22);padding:18px 18px 14px;transform:translateY(115%);transition:transform 520ms var(--ease-standard)}
  #infoSheet.show{display:block;transform:translateY(0)}
  #infoSheet .is-place{font-family:var(--font-serif);font-size:21px;color:var(--color-ink);margin-bottom:4px}
  #infoSheet .is-loc{font-size:12.5px;color:var(--color-muted);margin-bottom:10px}
  #infoSheet .is-desc{font-size:13px;color:var(--color-ink-soft);line-height:1.7;margin-bottom:8px;white-space:pre-line}
  #infoSheet .is-coord{font-size:11.5px;color:var(--color-faint);font-family:ui-monospace,Consolas,monospace;margin-bottom:12px}
  #infoSheet .is-tags{margin-bottom:12px}
  #infoSheet .is-tags span{display:inline-block;font-size:11px;background:var(--color-primary-soft);color:var(--color-primary-dark);border-radius:999px;padding:2px 9px;margin:0 5px 5px 0}
  #infoSheet .is-acts{display:flex;gap:10px}
  #infoSheet .is-btn{flex:1;min-height:44px;border-radius:999px;border:1px solid var(--color-line-strong);background:var(--color-surface);color:var(--color-ink-soft);font-size:13.5px;cursor:pointer;font-family:var(--font-sans)}
  #infoSheet .is-btn.primary{background:var(--color-primary);border-color:var(--color-primary);color:#fff;font-weight:600}
  #infoSheet .is-btn.danger{color:var(--color-danger,#b34a3f);border-color:rgba(179,74,63,.4)}
  .theme-dark .nm-topbar{background:rgba(29,28,25,.92)}
  .theme-dark #infoSheet{background:var(--color-surface);border-color:var(--color-line)}
</style>
</head>
<body>
<div id="mapEl"></div>
<header class="nm-topbar">
  <button class="back" aria-label="返回" onclick="history.length>1?history.back():location.href='index.html'">←</button>
  <div class="title">节点管理 <small>Node Manager</small></div>
  <button class="mine" id="mineBtn">我的节点</button>
</header>
<div class="nm-tip" id="nmTip"></div>
<div id="infoSheet"><div id="isBody"></div></div>

<script src="vendor/leaflet/leaflet.js"></script>
<script src="geo.js"></script>
<script src="node-lod.js"></script>
<script src="ui.js"></script>
<script>
(function () {
  'use strict';
  var USER_KEY = 'tn_userNodes';
  var SITES = [], markers = new Map(), map = null, markerLayer = null;
  var useGCJ = true, themeFilter = '';
  var osmLayer = null, amapLayer = null;

  function $(id) { return document.getElementById(id); }
  function esc(s) { return String(s == null ? '' : s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;'); }
  function pt(s) { return useGCJ ? window.Geo.gcj02Of(s.lat, s.lng) : [s.lat, s.lng]; }
  function tip(msg, ms) { var t = $('nmTip'); t.textContent = msg; t.classList.add('show'); clearTimeout(t._tm); t._tm = setTimeout(function () { t.classList.remove('show'); }, ms || 2200); }

  /* ---------- 数据 ---------- */
  function loadUserNodes() { try { return JSON.parse(localStorage.getItem(USER_KEY) || '[]'); } catch (e) { return []; } }
  function saveUserNodes(arr) { try { localStorage.setItem(USER_KEY, JSON.stringify(arr)); } catch (e) {} }
  function loadSites(cb) {
    var s = document.createElement('script');
    s.src = 'nation-index.js?v=20260813';
    s.onload = function () {
      var sys = (window.NATION_SITES_RAW || '').split('\n').map(function (line) {
        var p = line.split('|');
        return { name: p[0], label: p[1], region: p[2], city: p[3], county: p[4], theme: p[5], flag: p[6], lat: +p[7], lng: +p[8], source: '' };
      });
      var us = loadUserNodes().map(function (u) {
        return { id: 'u' + u.id, name: u.name, label: u.name, region: u.province || '其他', city: u.city || '', county: '', theme: u.category || '其他', desc: u.desc || '', flag: '', lat: +u.lat, lng: +u.lng, source: 'user', uid: u.id, tags: u.tags || [], createdAt: u.createdAt };
      });
      SITES = sys.concat(us);
      SITES.forEach(function (x, i) { x.__i = i; });
      cb();
    };
    s.onerror = function () { tip('节点数据加载失败，请检查网络'); };
    document.head.appendChild(s);
  }

  /* ---------- 地图 ---------- */
  function initMap() {
    map = L.map('mapEl', { zoomControl: false, attributionControl: false }).setView([34.5, 105], 5);
    L.control.attribution({ position: 'bottomleft', prefix: false }).addTo(map);
    amapLayer = L.tileLayer('https://wprd0{s}.is.autonavi.com/appmaptile?lang=zh_cn&size=1&style=7&x={x}&y={y}&z={z}', { subdomains: '1234', maxZoom: 18, attribution: '© 高德地图' }).addTo(map);
    osmLayer = L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', { maxZoom: 19, attribution: '© OpenStreetMap' });
    amapLayer.on('tileerror', function () { if (!map.hasLayer(osmLayer)) { try { amapLayer.remove(); } catch (e) {} osmLayer.addTo(map); tip('高德地图不可用，已切换街景底图'); } });
    markerLayer = L.layerGroup().addTo(map);
    L.control.zoom({ position: 'bottomright' }).addTo(map);
    /* 初始视野统计（首次 setView 不触发 moveend） */
    map.whenReady(function () { setTimeout(regionStats, 600); });
    /* 区域统计 */
    var stTimer = null;
    function regionStats() {
      if (!map) return;
      var b = map.getBounds();
      var inView = SITES.filter(function (s) { return s.lat != null && !isNaN(+s.lat) && b.contains([+s.lat, +s.lng]); });
      var el = document.querySelector('.region-stats');
      if (!inView.length) { if (el) el.style.display = 'none'; return; }
      var cnt = {};
      inView.forEach(function (s) { var t = s.theme || '其他'; cnt[t] = (cnt[t] || 0) + 1; });
      var top = Object.keys(cnt).sort(function (a, b) { return cnt[b] - cnt[a]; }).slice(0, 4);
      if (!el) { el = document.createElement('div'); el.className = 'region-stats'; document.body.appendChild(el); }
      var html = '<span class="rs-total">当前区域 <b>' + inView.length + '</b> 处</span>';
      top.forEach(function (t) {
        html += '<button class="rs-chip' + (themeFilter === t ? ' on' : '') + '" data-th="' + esc(t) + '">' + esc(t) + ' ' + cnt[t] + '</button>';
      });
      el.innerHTML = html;
      el.style.display = 'flex';
      el.querySelectorAll('.rs-chip').forEach(function (ch) {
        ch.onclick = function () {
          themeFilter = (themeFilter === ch.dataset.th ? '' : ch.dataset.th);
          NodeLOD.render();
          regionStats();
        };
      });
    }
    map.on('moveend', function () { clearTimeout(stTimer); stTimer = setTimeout(regionStats, 350); NodeLOD.render(); });
    map.on('zoomend', function () { clearTimeout(stTimer); stTimer = setTimeout(regionStats, 350); NodeLOD.render(); });
    /* LOD 节点渲染 */
    NodeLOD.init({
      map: map, layer: markerLayer,
      list: function () { return SITES; },
      pt: pt,
      icon: function (s, active) {
        var f = s.flag || '';
        var dim = themeFilter && s.theme !== themeFilter;
        var tint = s.source === 'user' ? '#5F7A4E' : (f.indexOf('m') >= 0 ? '#C86D4B' : (f.indexOf('h') >= 0 ? '#E0915C' : '#8C7B66'));
        var cls = 'tr-node' + (active ? ' tr-active' : '') + (dim ? ' tr-dim' : '') + (s.source === 'user' ? ' tr-user' : '') + (f.indexOf('m') >= 0 ? ' tr-must' : '');
        var html = '<div class="' + cls + '"><span class="tr-ring" style="--tint:' + tint + '"></span><span class="tr-dot"></span>';
        if (f.indexOf('m') >= 0) html += '<span class="tr-seal">必</span>';
        if (s.source === 'user') html += '<span class="node-num" style="background:#5F7A4E">我</span>';
        html += '</div>';
        return L.divIcon({ className: '', html: html, iconSize: [30, 30], iconAnchor: [15, 15] });
      },
      colorOf: function (s) { return s.source === 'user' ? '#5F7A4E' : '#8C7B66'; },
      onNode: function (s) { openInfo(s); },
      majorOf: function (s) { return s.source === 'user' || (s.flag && s.flag.indexOf('m') >= 0); },
      regionOf: function (s) { return s.region; },
      cityOf: function (s) { return s.city; },
      countyOf: function (s) { return s.county; },
      detailZoom: 10
    });
    NodeLOD.render();
  }

  /* ---------- 节点信息面板 ---------- */
  function openInfo(s) {
    var box = $('isBody');
    var loc = [s.region, s.city].filter(Boolean).join(' · ');
    var isUser = s.source === 'user';
    var html = '<div class="is-place">' + esc(s.label) + (isUser ? ' <span style="font-size:11px;color:#5F7A4E;vertical-align:2px">我的节点</span>' : '') + '</div>' +
      '<div class="is-loc">' + esc(s.theme || '其他') + (loc ? ' · ' + esc(loc) : '') + '</div>' +
      (s.desc ? '<div class="is-desc">' + esc(s.desc) + '</div>' : '') +
      (s.tags && s.tags.length ? '<div class="is-tags">' + s.tags.map(function (t) { return '<span>#' + esc(t) + '</span>'; }).join('') + '</div>' : '') +
      '<div class="is-coord">' + (+s.lat).toFixed(5) + ', ' + (+s.lng).toFixed(5) + '</div>' +
      '<div class="is-acts">' +
      (isUser
        ? '<button class="is-btn" onclick="window.NM.edit(\'' + s.uid + '\')">编辑</button>' +
          '<button class="is-btn danger" onclick="window.NM.remove(\'' + s.uid + '\')">删除</button>' +
          '<button class="is-btn primary" onclick="window.NM.closeInfo()">关闭</button>'
        : '<button class="is-btn primary" onclick="window.NM.closeInfo()">关闭</button>') +
      '</div>';
    box.innerHTML = html;
    $('infoSheet').classList.add('show');
  }
  function closeInfo() { $('infoSheet').classList.remove('show'); }

  /* ---------- 重复检测 ---------- */
  function findDup(name, lat, lng, excludeUid) {
    var n = String(name || '').trim(); if (!n) return [];
    return SITES.filter(function (s) {
      if (excludeUid && s.source === 'user' && s.uid === excludeUid) return false; /* 编辑时排除自身 */
      var sn = s.name || s.label || '';
      if (!sn) return false;
      var nameHit = sn.indexOf(n) >= 0 || n.indexOf(sn) >= 0;
      if (!nameHit) return false;
      if (lat != null && s.lat != null) { var d = window.Geo.hav ? window.Geo.hav(lat, lng, +s.lat, +s.lng) : 0; return d < 0.1; }
      return true;
    }).slice(0, 3);
  }

  /* ---------- 添加/编辑表单 ---------- */
  function openForm(preset) {
    var m = document.createElement('div');
    m.className = 'ui-modal-mask nm-mask';
    m.innerHTML =
      '<div class="ui-modal nm-form" role="dialog" aria-modal="true">' +
      '<div class="ui-modal-title">' + (preset && preset.uid ? '编辑节点' : '添加节点') + '</div>' +
      '<div class="ui-modal-text nm-body">' +
      (preset && preset.lat != null ? '<div class="nm-coord">📍 ' + (+preset.lat).toFixed(5) + ', ' + (+preset.lng).toFixed(5) + '</div>' : '') +
      '<input id="nmName" class="nm-in" placeholder="名称（必填）" value="' + esc((preset && preset.name) || '') + '">' +
      '<input id="nmCity" class="nm-in" placeholder="城市（如 长沙）" value="' + esc((preset && preset.city) || '') + '">' +
      '<input id="nmCat" class="nm-in" placeholder="分类（如 茶馆 / 观景台 / 拍照点）" value="' + esc((preset && preset.category) || '') + '">' +
      '<input id="nmTags" class="nm-in" placeholder="标签（空格分隔，如 拍照 小众）" value="' + esc(((preset && preset.tags) || []).join(' ')) + '">' +
      '<textarea id="nmDesc" class="nm-ta" placeholder="简介 / 备注（可选）" rows="2">' + esc((preset && preset.desc) || '') + '</textarea>' +
      '<div class="nm-dup" id="nmDup"></div>' +
      '</div>' +
      '<div class="ui-modal-acts"><button class="ui-btn ui-btn-ghost" id="nmCancel">取消</button><button class="ui-btn ui-btn-primary" id="nmSave">保存</button></div></div>';
    document.body.appendChild(m);
    requestAnimationFrame(function () { m.classList.add('show'); });
    m.querySelector('#nmCancel').onclick = function () { m.remove(); };
    m.onclick = function (e) { if (e.target === m) m.remove(); };
    document.getElementById('nmName').focus();
    var dupEl = m.querySelector('#nmDup');
    m.querySelector('#nmName').oninput = function () {
      var v = this.value.trim();
      if (!v || !preset || preset.lat == null) return;
      var hits = findDup(v, preset.lat, preset.lng, preset && preset.uid);
      dupEl.innerHTML = hits.length ? '<span class="nm-dup-warn">⚠ 附近已有相似节点：' + hits.map(function (h) { return esc(h.label || h.name); }).join('、') + '</span>' : '';
    };
    m.querySelector('#nmSave').onclick = function () {
      var name = document.getElementById('nmName').value.trim();
      if (!name) { UI.toast('请填写名称'); return; }
      if (!preset || preset.lat == null) { UI.toast('请先在地图上选择位置'); return; }
      var hits = findDup(name, preset.lat, preset.lng, preset && preset.uid);
      function doSave() {
        var rec = {
          id: (preset && preset.uid) || Date.now().toString(36),
          name: name,
          lat: preset.lat, lng: preset.lng,
          province: (preset && preset.province) || '',
          city: document.getElementById('nmCity').value.trim(),
          category: document.getElementById('nmCat').value.trim() || '其他',
          tags: document.getElementById('nmTags').value.trim().split(/\s+/).filter(Boolean),
          desc: document.getElementById('nmDesc').value.trim(),
          createdAt: (preset && preset.createdAt) || Date.now()
        };
        var arr = loadUserNodes();
        var idx = arr.findIndex(function (x) { return x.id === rec.id; });
        if (idx >= 0) arr[idx] = rec; else arr.push(rec);
        saveUserNodes(arr);
        reloadUserSites();
        m.remove();
        closeInfo();
        tip('已保存「' + rec.name + '」');
      }
      if (hits.length) {
        UI.confirm({ title: '重复节点', text: '附近已有相似节点：' + hits.map(function (h) { return h.label || h.name; }).join('、') + '\n仍然添加？', okText: '仍然添加', danger: true }, function (ok) { if (ok) doSave(); });
      } else doSave();
    };
  }
  function reloadUserSites() {
    SITES = SITES.filter(function (x) { return x.source !== 'user'; });
    loadUserNodes().forEach(function (u) {
      SITES.push({ id: 'u' + u.id, name: u.name, label: u.name, region: u.province || '其他', city: u.city || '', county: '', theme: u.category || '其他', desc: u.desc || '', flag: '', lat: +u.lat, lng: +u.lng, source: 'user', uid: u.id, tags: u.tags || [], createdAt: u.createdAt });
    });
    SITES.forEach(function (x, i) { x.__i = i; });
    NodeLOD.render();
  }
  function startPick() {
    tip('在地图上点击选择位置', 3000);
    map.once('click', function (e) {
      var lat = e.latlng.lat, lng = e.latlng.lng;
      var mk = L.marker([lat, lng], { icon: L.divIcon({ className: '', html: '<div style="width:26px;height:26px;border-radius:50%;background:rgba(200,109,75,.9);border:3px solid #fff;box-shadow:0 3px 12px rgba(0,0,0,.3)"></div>', iconSize: [26, 26], iconAnchor: [13, 13] }) }).addTo(map);
      openForm({ lat: lat, lng: lng });
      setTimeout(function () { mk.remove(); }, 600);
    });
  }
  function addAtCurrent() {
    if (!navigator.geolocation) { UI.toast('当前环境不支持定位'); return; }
    tip('定位中…', 4000);
    navigator.geolocation.getCurrentPosition(function (pos) {
      openForm({ lat: pos.coords.latitude, lng: pos.coords.longitude });
    }, function () { UI.toast('定位失败，请检查定位权限'); }, { enableHighAccuracy: true, timeout: 10000 });
  }
  function openMine() {
    var arr = loadUserNodes();
    var m = document.createElement('div');
    m.className = 'ui-modal-mask nm-mask';
    m.innerHTML =
      '<div class="ui-modal nm-form" role="dialog" aria-modal="true">' +
      '<div class="ui-modal-title">我的节点 <small style="font-size:12px;color:var(--color-muted)">' + arr.length + ' 个</small></div>' +
      '<div class="ui-modal-text nm-list" id="nmList"></div>' +
      '<div class="ui-modal-acts"><button class="ui-btn ui-btn-ghost" id="nmClose">关闭</button></div></div>';
    document.body.appendChild(m);
    requestAnimationFrame(function () { m.classList.add('show'); });
    m.querySelector('#nmClose').onclick = function () { m.remove(); };
    m.onclick = function (e) { if (e.target === m) m.remove(); };
    var box = m.querySelector('#nmList');
    if (!arr.length) {
      box.innerHTML = '<div style="text-align:center;color:var(--color-muted);padding:20px 0">还没有自己添加的节点<br><span style="font-size:12px">地图右下「＋」→ 地图选点 / 使用当前位置</span></div>';
      return;
    }
    box.innerHTML = arr.map(function (u) {
      return '<div class="nm-item">' +
        '<div class="nm-item-main"><b>' + esc(u.name) + '</b><small>' + esc([u.city, u.category].filter(Boolean).join(' · ')) + '</small></div>' +
        '<button class="nm-item-btn" onclick="window.NM.edit(\'' + u.id + '\')">编辑</button>' +
        '<button class="nm-item-btn danger" onclick="window.NM.remove(\'' + u.id + '\')">删除</button></div>';
    }).join('');
  }
  function edit(uid) {
    var u = loadUserNodes().find(function (x) { return x.id === uid; });
    if (!u) return;
    closeModals();
    openForm({ uid: u.id, name: u.name, lat: u.lat, lng: u.lng, city: u.city, category: u.category, tags: u.tags, desc: u.desc, province: u.province, createdAt: u.createdAt });
  }
  function remove(uid) {
    var u = loadUserNodes().find(function (x) { return x.id === uid; });
    if (!u) return;
    UI.confirm({ title: '删除节点', text: '确定删除「' + u.name + '」？', okText: '删除', danger: true }, function (ok) {
      if (!ok) return;
      saveUserNodes(loadUserNodes().filter(function (x) { return x.id !== uid; }));
      reloadUserSites();
      closeModals();
      closeInfo();
      UI.toast('已删除');
    });
  }
  function closeModals() { document.querySelectorAll('.nm-mask').forEach(function (x) { x.remove(); }); }

  /* ---------- FAB ---------- */
  function initFab() {
    var fab = document.createElement('button');
    fab.className = 'nm-fab';
    fab.textContent = '＋';
    fab.setAttribute('aria-label', '添加节点');
    fab.onclick = function () {
      var m = document.createElement('div');
      m.className = 'ui-modal-mask nm-mask';
      m.innerHTML =
        '<div class="ui-modal nm-menu" role="dialog" aria-modal="true">' +
        '<div class="ui-modal-title">添加 / 管理节点</div>' +
        '<div class="ui-modal-text nm-menu-items">' +
        '<button class="nm-menu-item" data-a="pick">📍 地图选点</button>' +
        '<button class="nm-menu-item" data-a="cur">⌖ 使用当前位置</button>' +
        '<button class="nm-menu-item" data-a="search">🔍 搜索地点</button>' +
        '<button class="nm-menu-item" data-a="mine">📋 我的节点</button>' +
        '</div>' +
        '<div class="ui-modal-acts"><button class="ui-btn ui-btn-ghost" id="nmMenuClose">取消</button></div></div>';
      document.body.appendChild(m);
      requestAnimationFrame(function () { m.classList.add('show'); });
      m.querySelector('#nmMenuClose').onclick = function () { m.remove(); };
      m.onclick = function (e) { if (e.target === m) m.remove(); };
      m.querySelectorAll('.nm-menu-item').forEach(function (b) {
        b.onclick = function () {
          var a = b.dataset.a;
          m.remove();
          if (a === 'pick') startPick();
          else if (a === 'cur') addAtCurrent();
          else if (a === 'search') location.href = 'search.html';
          else if (a === 'mine') openMine();
        };
      });
    };
    document.body.appendChild(fab);
  }

  /* ---------- 启动 ---------- */
  window.NM = { edit: edit, remove: remove, closeInfo: closeInfo, get map() { return map; } };
  $('mineBtn').onclick = openMine;
  initFab();
  initMap();
  loadSites(function () {
    NodeLOD.render();
    setTimeout(function () { map.invalidateSize(); }, 200);
  });
})();
</script>
</body>
</html>
