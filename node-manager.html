<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no,viewport-fit=cover">
<title>节点管理 · 行迹</title>
<link rel="manifest" href="manifest.webmanifest">
<script src="theme.js"></script>
<link rel="stylesheet" href="design.css">
<link rel="stylesheet" href="map.css">
<link rel="stylesheet" href="vendor/leaflet/leaflet.css">
<style>
  html,body{height:100%;margin:0;font-family:var(--font-sans);background:var(--color-bg);color:var(--color-ink);overflow:hidden}
  #mapEl{position:absolute;inset:0;z-index:1}
  .nm-topbar{position:fixed;left:0;right:0;top:0;z-index:9500;display:flex;align-items:center;gap:8px;padding:calc(env(safe-area-inset-top,0px)+8px) 14px 10px;background:rgba(250,248,243,.92);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);border-bottom:1px solid rgba(32,32,29,.07)}
  .nm-topbar .back{width:40px;height:40px;border:1px solid var(--color-line);border-radius:50%;background:var(--color-bg-soft);color:var(--color-ink);font-size:15px;display:flex;align-items:center;justify-content:center;flex:0 0 auto;cursor:pointer}
  .nm-topbar .title{font-family:var(--font-serif);font-weight:400;font-size:18px;color:var(--color-ink);letter-spacing:.02em;white-space:nowrap}
  .nm-topbar .title small{font-family:var(--font-sans);font-size:11px;color:var(--color-muted);margin-left:4px;letter-spacing:.06em}
  .sbar{flex:1;display:flex;align-items:center;gap:6px;background:var(--color-surface);border:1.5px solid var(--color-line);border-radius:999px;padding:3px 6px 3px 14px;min-width:0}
  .sbar input{flex:1;min-width:0;border:0;outline:0;background:transparent;font-size:14px;color:var(--color-ink);height:36px}
  .sbar .go{flex:0 0 auto;min-height:34px;padding:0 14px;border:0;border-radius:999px;background:var(--color-primary);color:#fff;font-size:13px;cursor:pointer;font-family:var(--font-sans)}
  .nm-tip{position:fixed;left:50%;transform:translateX(-50%);bottom:112px;z-index:9400;background:rgba(32,32,29,.88);color:#fff;font-size:12px;padding:7px 14px;border-radius:999px;white-space:nowrap;box-shadow:0 6px 20px rgba(0,0,0,.25);pointer-events:none;opacity:0;transition:opacity .25s}
  .nm-tip.show{opacity:1}
  /* 搜索结果面板 */
  #rsSheet{position:fixed;z-index:9500;left:8px;right:8px;bottom:8px;display:none;max-height:72dvh;overflow-y:auto;background:var(--color-surface);border:1px solid var(--color-line);border-radius:20px;box-shadow:0 18px 50px rgba(30,30,28,.22);padding:16px 16px 12px;transform:translateY(115%);transition:transform 520ms var(--ease-standard)}
  #rsSheet.show{display:block;transform:translateY(0)}
  .rs-head{display:flex;align-items:center;margin-bottom:10px}
  .rs-head b{flex:1;font-family:var(--font-serif);font-weight:400;font-size:16px;color:var(--color-ink)}
  .rs-head .x{border:0;background:none;color:var(--color-muted);font-size:15px;cursor:pointer;padding:6px}
  .rs-sec{font-size:11px;color:var(--color-muted);letter-spacing:.16em;margin:12px 2px 6px}
  .rs-item{display:flex;align-items:center;gap:10px;padding:10px 8px;border-radius:12px;cursor:pointer}
  .rs-item:active{background:var(--color-bg-soft)}
  .rs-item .ic{flex:0 0 30px;height:30px;border-radius:9px;display:grid;place-items:center;font-size:13px;background:var(--color-primary-soft);color:var(--color-primary-dark)}
  .rs-item .main{flex:1;min-width:0}
  .rs-item .nm{font-size:13.5px;color:var(--color-ink);font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .rs-item .nm .bdg{display:inline-block;font-size:10px;padding:0 6px;border-radius:999px;margin-left:6px;vertical-align:1px;font-weight:600;background:rgba(201,162,39,.14);color:#8A6D1F;border:1px solid rgba(201,162,39,.38)}
  .rs-item .nm .bdg.mine{background:rgba(95,122,78,.14);color:#5F7A4E;border-color:rgba(95,122,78,.4)}
  .rs-item .sub{font-size:11.5px;color:var(--color-muted);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .rs-item .act{flex:0 0 auto;font-size:12px;color:var(--color-primary-dark);font-weight:600}
  .rs-empty{padding:26px 10px;text-align:center;color:var(--color-muted);font-size:13px;line-height:1.8}
  /* 节点信息面板 */
  #infoSheet{position:fixed;z-index:9500;left:8px;right:8px;bottom:8px;display:none;max-height:70dvh;overflow-y:auto;background:var(--color-surface);border:1px solid var(--color-line);border-radius:20px;box-shadow:0 18px 50px rgba(30,30,28,.22);padding:18px 18px 14px;transform:translateY(115%);transition:transform 520ms var(--ease-standard)}
  #infoSheet.show{display:block;transform:translateY(0)}
  #infoSheet .is-place{font-family:var(--font-serif);font-size:21px;color:var(--color-ink);margin-bottom:4px}
  #infoSheet .is-loc{font-size:12.5px;color:var(--color-muted);margin-bottom:10px}
  #infoSheet .is-desc{font-size:13px;color:var(--color-ink-soft);line-height:1.7;margin-bottom:8px;white-space:pre-line}
  #infoSheet .is-coord{font-size:11.5px;color:var(--color-faint);font-family:ui-monospace,Consolas,monospace;margin-bottom:12px}
  #infoSheet .is-tags{margin-bottom:12px}
  #infoSheet .is-tags span{display:inline-block;font-size:11px;background:var(--color-primary-soft);color:var(--color-primary-dark);border-radius:999px;padding:2px 9px;margin:0 5px 5px 0}
  #infoSheet .is-acts{display:flex;gap:10px}
  #infoSheet .is-btn{flex:1;min-height:44px;border-radius:999px;border:1px solid var(--color-line-strong);background:var(--color-surface);color:var(--color-ink-soft);font-size:13.5px;cursor:pointer;font-family:var(--font-sans)}
  #infoSheet .is-btn.primary{background:var(--color-primary);border-color:var(--color-primary);color:#fff;font-weight:600}
  #infoSheet .is-btn.danger{color:var(--color-danger,#b34a3f);border-color:rgba(179,74,63,.4)}
  .theme-dark .nm-topbar{background:rgba(29,28,25,.92)}
  .theme-dark #rsSheet,.theme-dark #infoSheet{background:var(--color-surface);border-color:var(--color-line)}
</style>
</head>
<body>
<div id="mapEl"></div>
<header class="nm-topbar">
  <button class="back" aria-label="返回" onclick="history.length>1?history.back():location.href='index.html'">←</button>
  <div class="title">节点管理 <small>Node</small></div>
  <div class="sbar">
    <input id="q" type="search" placeholder="搜景点 / 茶馆 / 观景台…" autocomplete="off" aria-label="搜索节点">
    <button class="go" id="qGo">搜索</button>
  </div>
</header>
<div class="nm-tip" id="nmTip"></div>
<div id="rsSheet">
  <div class="rs-head"><b>搜索结果</b><button class="x" id="rsClose" aria-label="关闭">✕</button></div>
  <div id="rsBody"></div>
</div>
<div id="infoSheet"><div id="isBody"></div></div>

<script src="vendor/leaflet/leaflet.js"></script>
<script src="geo.js"></script>
<script src="wishlist.js"></script>
<script src="travel-notes.js"></script>
<script src="ui.js"></script>
<script>
(function () {
  'use strict';
  var USER_KEY = 'tn_userNodes';
  var AMAP_KEY = 'tn_amap_key';
  var SITES = [], map = null, pickMarker = null;

  function $(id) { return document.getElementById(id); }
  function esc(s) { return String(s == null ? '' : s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;'); }
  function tip(msg, ms) { var t = $('nmTip'); t.textContent = msg; t.classList.add('show'); clearTimeout(t._tm); t._tm = setTimeout(function () { t.classList.remove('show'); }, ms || 2200); }
  function closeSheets() { $('rsSheet').classList.remove('show'); $('infoSheet').classList.remove('show'); }

  /* ---------- 用户节点地图标记（保存后可见） ---------- */
  var userMarkers = {};
  function placeUserMarker(u) {
    if (userMarkers[u.id]) { userMarkers[u.id].remove(); delete userMarkers[u.id]; }
    var lat = +u.lat, lng = +u.lng;
    if (isNaN(lat) || isNaN(lng)) return;
    var m = L.marker([lat, lng], {
      icon: L.divIcon({ className: '', html: '<div class="tr-node tr-user"><span class="tr-ring" style="--tint:#5F7A4E"></span><span class="tr-dot"></span><span class="node-num" style="background:#5F7A4E">我</span></div>', iconSize: [30, 30], iconAnchor: [15, 15] })
    }).addTo(map);
    m.on('click', function () { var u2 = loadUserNodes().find(function (x) { return x.id === u.id; }); if (u2) openUserInfo(u2); });
    userMarkers[u.id] = m;
  }
  function removeUserMarker(uid) { if (userMarkers[uid]) { userMarkers[uid].remove(); delete userMarkers[uid]; } }

  /* ---------- 数据：本地索引（仅搜索用，不渲染地图） ---------- */
  function loadUserNodes() { try { return JSON.parse(localStorage.getItem(USER_KEY) || '[]'); } catch (e) { return []; } }
  function saveUserNodes(arr) { try { localStorage.setItem(USER_KEY, JSON.stringify(arr)); } catch (e) {} }
  function loadIndex(cb) {
    var s = document.createElement('script');
    s.src = 'nation-index.js?v=20260813';
    s.onload = function () {
      var sys = (window.NATION_SITES_RAW || '').split('\n').map(function (line) {
        var p = line.split('|');
        return { name: p[0], label: p[1], region: p[2], city: p[3], county: p[4], theme: p[5], flag: p[6], lat: +p[7], lng: +p[8], source: '' };
      });
      SITES = sys;
      sys.forEach(function (x, i) { x.__i = i; });
      cb();
    };
    s.onerror = function () { tip('本地节点索引加载失败'); };
    document.head.appendChild(s);
  }
  function userSites() {
    return loadUserNodes().map(function (u) {
      return { id: 'u' + u.id, name: u.name, label: u.name, region: u.province || '其他', city: u.city || '', county: '', theme: u.category || '其他', desc: u.desc || '', flag: '', lat: +u.lat, lng: +u.lng, gcj: !!u.gcj, source: 'user', uid: u.id, tags: u.tags || [], createdAt: u.createdAt };
    });
  }

  /* ---------- 地图（空地图，不显示任何节点） ---------- */
  function initMap() {
    map = L.map('mapEl', { zoomControl: false, attributionControl: false }).setView([34.5, 105], 5);
    L.control.attribution({ position: 'bottomleft', prefix: false }).addTo(map);
    var amap = L.tileLayer('https://wprd0{s}.is.autonavi.com/appmaptile?lang=zh_cn&size=1&style=7&x={x}&y={y}&z={z}', { subdomains: '1234', maxZoom: 18, attribution: '© 高德地图' }).addTo(map);
    var osm = L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', { maxZoom: 19, attribution: '© OpenStreetMap' });
    amap.on('tileerror', function () { if (!map.hasLayer(osm)) { try { amap.remove(); } catch (e) {} osm.addTo(map); tip('高德地图不可用，已切换街景底图'); } });
    L.control.zoom({ position: 'bottomright' }).addTo(map);
    map.on('click', function () { closeSheets(); });
  }

  /* ---------- 搜索：本地优先，无结果走高德 POI ---------- */
  function localSearch(q) {
    var n = q.trim().toLowerCase(); if (!n) return [];
    var all = SITES.concat(userSites());
    return all.filter(function (s) {
      var hay = ((s.name || '') + ' ' + (s.label || '') + ' ' + (s.region || '') + ' ' + (s.city || '') + ' ' + (s.county || '') + ' ' + (s.theme || '')).toLowerCase();
      return hay.indexOf(n) >= 0;
    }).slice(0, 10);
  }
  function amapSearch(q, cb) {
    var key = localStorage.getItem(AMAP_KEY);
    if (!key) { promptKey(function () { amapSearch(q, cb); }); return; }
    var cbName = 'amapCb' + Date.now().toString(36);
    window[cbName] = function (data) { delete window[cbName]; cb(data); };
    var s = document.createElement('script');
    s.src = 'https://restapi.amap.com/v3/place/text?key=' + encodeURIComponent(key) +
      '&keywords=' + encodeURIComponent(q) + '&offset=10&page=1&extensions=base&callback=' + cbName;
    s.onerror = function () { delete window[cbName]; cb(null); };
    document.head.appendChild(s);
  }
  function amapJsonp(url, cb) {
    var cbName = 'amapCb' + Date.now().toString(36) + Math.floor(Math.random() * 9999);
    window[cbName] = function (data) { delete window[cbName]; cb(data); };
    var s = document.createElement('script');
    s.src = url + '&callback=' + cbName;
    s.onerror = function () { delete window[cbName]; cb(null); };
    document.head.appendChild(s);
  }
  /* 自动填充：逆地理（省市/地址）+ 海拔（高德 elevation，失败降级 Open-Meteo） */
  function autoFill(lat, lng) {
    var key = localStorage.getItem('tn_amap_key');
    if (key) {
      amapJsonp('https://restapi.amap.com/v3/geocode/regeo?key=' + encodeURIComponent(key) + '&location=' + lng + ',' + lat + '&extensions=base', function (d) {
        if (d && d.status === '1' && d.regeocode) {
          var ac = d.regeocode.addressComponent || {};
          var prov = ac.province || '', city = ac.city || ac.province || '';
          var el = document.getElementById('nmCity');
          if (el && !el.value && city) el.value = city;
          if (prov) window.__nmProvince = prov;
          var desc = document.getElementById('nmDesc');
          if (desc && !desc.value && d.regeocode.formatted_address && d.regeocode.formatted_address !== city) {
            desc.placeholder = '节点介绍（' + d.regeocode.formatted_address + '）';
          }
        }
      });
      amapJsonp('https://restapi.amap.com/v3/elevation/rectangle?key=' + encodeURIComponent(key) + '&locations=' + lng + ',' + lat, function (d) {
        var el = document.getElementById('nmElev');
        if (el && d && d.status === '1' && d.data && d.data.length) {
          var e = Math.round(+d.data[0].elevation);
          if (!isNaN(e) && !el.value) el.value = e;
        }
      });
    }
    /* 无高德 key 或失败时的海拔兜底：Open-Meteo（无需 key，CORS 开放） */
    fetch('https://api.open-meteo.com/v1/elevation?latitude=' + lat + '&longitude=' + lng)
      .then(function (r) { return r.json(); })
      .then(function (d) {
        var el = document.getElementById('nmElev');
        if (el && d && d.elevation != null && !el.value) el.value = Math.round(d.elevation);
      }).catch(function () {});
  }
  /* AI 生成节点介绍（DeepSeek，复用设置页的 AI Key） */
  function genDesc() {
    var name = document.getElementById('nmName').value.trim();
    if (!name) { UI.toast('先填写名称再生成介绍'); return; }
    var key = localStorage.getItem('tn_aiKey');
    if (!key) { UI.toast('请先在设置页配置 AI Key（DeepSeek）'); return; }
    var city = document.getElementById('nmCity').value.trim();
    var cat = document.getElementById('nmCat').value.trim();
    var btn = document.getElementById('nmGenDesc');
    btn.textContent = '生成中…';
    btn.disabled = true;
    fetch('https://api.deepseek.com/chat/completions', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + key },
      body: JSON.stringify({
        model: localStorage.getItem('tn_model') || 'deepseek-chat',
        messages: [
          { role: 'system', content: '你是旅行地点编辑助手，输出简洁准确的介绍。' },
          { role: 'user', content: '为旅行地点「' + name + '」' + ([city, cat].filter(Boolean).length ? '（' + [city, cat].filter(Boolean).join('，') + '）' : '') + '写一段 60-100 字的介绍：亮点、适合季节、注意事项。口语化，不要列表编号，不要编造不确定的史实。' }
        ],
        temperature: 0.7
      })
    }).then(function (r) { return r.json(); }).then(function (d) {
      var t = d && d.choices && d.choices[0] && d.choices[0].message && d.choices[0].message.content;
      if (t) { document.getElementById('nmDesc').value = t.trim(); UI.toast('介绍已生成，可再手动微调'); }
      else { UI.toast('生成失败：' + ((d && d.error && d.error.message) || '未知错误')); }
    }).catch(function () { UI.toast('生成失败，请检查网络'); })
      .then(function () { btn.textContent = '✨ 生成介绍'; btn.disabled = false; });
  }

  function promptKey(retry) {
    var m = document.createElement('div');
    m.className = 'ui-modal-mask nm-mask';
    m.innerHTML =
      '<div class="ui-modal nm-form" role="dialog" aria-modal="true">' +
      '<div class="ui-modal-title">配置高德搜索 Key</div>' +
      '<div class="ui-modal-text nm-body">' +
      '<div style="font-size:12.5px;color:var(--color-muted);line-height:1.7;margin-bottom:10px">本地没有找到该节点，需调用高德地图 POI 搜索。请填入高德开放平台（console.amap.com）申请的 Web 服务 Key（免费），仅保存在本机。</div>' +
      '<input id="akKey" class="nm-in" placeholder="高德 Web 服务 Key" value="">' +
      '<div class="nm-dup"></div>' +
      '</div>' +
      '<div class="ui-modal-acts"><button class="ui-btn ui-btn-ghost" id="akCancel">取消</button><button class="ui-btn ui-btn-primary" id="akSave">保存并搜索</button></div></div>';
    document.body.appendChild(m);
    requestAnimationFrame(function () { m.classList.add('show'); });
    m.querySelector('#akCancel').onclick = function () { m.remove(); };
    m.onclick = function (e) { if (e.target === m) m.remove(); };
    m.querySelector('#akSave').onclick = function () {
      var k = document.getElementById('akKey').value.trim();
      if (!k) { UI.toast('请填写 Key'); return; }
      localStorage.setItem(AMAP_KEY, k);
      m.remove();
      UI.toast('Key 已保存');
      if (retry) retry();
    };
    document.getElementById('akKey').focus();
  }
  function doSearch() {
    var q = $('q').value.trim();
    if (!q) return;
    var local = localSearch(q);
    if (local.length) {
      showResults(q, local, null);
      return;
    }
    tip('本地无结果，正在搜索高德地图…', 3000);
    amapSearch(q, function (data) {
      if (!data) { tip('高德搜索失败，请检查网络'); return; }
      if (data.status !== '1' || !data.pois || !data.pois.length) { showResults(q, [], null); tip('高德也没有找到相关地点'); return; }
      showResults(q, [], data.pois);
    });
  }

  /* ---------- 结果展示 ---------- */
  function showResults(q, local, pois) {
    var box = $('rsBody');
    var html = '';
    if (local && local.length) {
      html += '<div class="rs-sec">本地节点 · ' + local.length + '</div>';
      html += local.map(function (s) {
        var mine = s.source === 'user';
        var loc = [s.region, s.city].filter(Boolean).join(' · ');
        return '<div class="rs-item" data-k="local" data-i="' + (mine ? 'u' + s.uid : 's' + s.__i) + '">' +
          '<span class="ic">' + (mine ? '📌' : '📍') + '</span>' +
          '<div class="main"><div class="nm">' + esc(s.label || s.name) + (mine ? '<span class="bdg mine">我的节点</span>' : '<span class="bdg">已存在</span>') + '</div>' +
          '<div class="sub">' + esc(loc + (s.theme ? ' · ' + s.theme : '')) + '</div></div>' +
          '<span class="act">查看 ›</span></div>';
      }).join('');
    }
    if (pois && pois.length) {
      html += '<div class="rs-sec">地图发现 · ' + pois.length + '</div>';
      html += pois.map(function (p) {
        var nm = p.name || '';
        var addr = p.address || '';
        var city = [p.pname, p.cityname || p.adname].filter(function (x, i, a) { return x && a.indexOf(x) === i; }).join(' ');
        return '<div class="rs-item" data-k="poi" data-nm="' + esc(nm) + '" data-loc="' + esc(p.location || '') + '" data-city="' + esc(city) + '" data-addr="' + esc(addr) + '">' +
          '<span class="ic">🗺️</span>' +
          '<div class="main"><div class="nm">' + esc(nm) + '</div>' +
          '<div class="sub">' + esc(city + (addr ? ' · ' + addr : '')) + '</div></div>' +
          '<span class="act">＋ 添加</span></div>';
      }).join('');
    }
    if (!html) html = '<div class="rs-empty">没有找到「' + esc(q) + '」相关的地点<br>换一个关键词试试</div>';
    box.innerHTML = html;
    box.querySelectorAll('.rs-item').forEach(function (it) {
      it.onclick = function () {
        var k = it.dataset.k;
        if (k === 'local') {
          var ref = it.dataset.i;
          if (ref.charAt(0) === 's') {
            var sys = SITES[+ref.slice(1)];
            if (sys) openSysInfo(sys);
          } else {
            var u = loadUserNodes().find(function (x) { return x.id === ref.slice(1); });
            if (u) openUserInfo(u);
          }
        } else if (k === 'poi') {
          var loc = (it.dataset.loc || '').split(',');
          if (loc.length !== 2) return;
          pickPoi({
            name: it.dataset.nm,
            lng: +loc[0], lat: +loc[1],
            city: it.dataset.city,
            addr: it.dataset.addr
          });
        }
      };
    });
    $('rsSheet').classList.add('show');
    $('infoSheet').classList.remove('show');
  }
  $('rsClose').onclick = function () { $('rsSheet').classList.remove('show'); };
  $('qGo').onclick = doSearch;
  $('q').onkeydown = function (e) { if (e.key === 'Enter') doSearch(); };
  /* 实时模糊搜索：边输入边显示结果（防抖 260ms） */
  var searchTimer = null;
  $('q').oninput = function () {
    clearTimeout(searchTimer);
    var v = this.value.trim();

  /* ---------- 重复检测（编辑时排除自身） ---------- */
  function findDup(name, lat, lng, excludeUid) {
    var n = String(name || '').trim(); if (!n) return [];
    var all = SITES.concat(userSites());
    return all.filter(function (s) {
      if (excludeUid && s.source === 'user' && s.uid === excludeUid) return false;
      var sn = s.name || s.label || '';
      if (!sn) return false;
      var nameHit = sn.indexOf(n) >= 0 || n.indexOf(sn) >= 0;
      if (!nameHit) return false;
      if (lat != null && s.lat != null) { var d = window.Geo.hav ? window.Geo.hav(lat, lng, +s.lat, +s.lng) : 0; return d < 0.1; }
      return true;
    }).slice(0, 3);
  }

      '<div class="nm-dup" id="nmDup"></div>' +

    document.body.appendChild(m);
    requestAnimationFrame(function () { m.classList.add('show'); });
    m.querySelector('#nmCancel').onclick = function () { m.remove(); };
    m.onclick = function (e) { if (e.target === m) m.remove(); };
    document.getElementById('nmName').focus();
    /* 添加照片：压缩到 240px base64 */
    var fileEl = m.querySelector('#nmFile');
    m.querySelector('#nmPhotoBox').onclick = function () { fileEl.click(); };
    fileEl.onchange = function () {
      var f = fileEl.files && fileEl.files[0];

      var rd = new FileReader();
      rd.onload = function () {
        var img = new Image();
        img.onload = function () {
          var c = document.createElement('canvas'), w = 240, h = Math.round(img.height * w / img.width);

          c.getContext('2d').drawImage(img, 0, 0, w, h);

      };
      rd.readAsDataURL(f);

      rp.onclick = function () {
        m.remove();
        UI.toast('在地图上点击新位置');

            uid: preset.uid, name: preset.name, lat: e.latlng.lat, lng: e.latlng.lng,

    };

      var name = document.getElementById('nmName').value.trim();
      if (!name) { UI.toast('请填写名称'); return; }
      if (!preset || preset.lat == null) { UI.toast('请先选择位置'); return; }
      var hits = findDup(name, preset.lat, preset.lng, preset && preset.uid);
      function doSave() {
        var photoBox = m.querySelector('#nmPhotoBox');
        var rec = {
          id: (preset && preset.uid) || Date.now().toString(36),
          name: name,
          lat: preset.lat, lng: preset.lng,
          gcj: !!(preset && preset.gcj),
          province: (preset && preset.province) || window.__nmProvince || '',
          city: document.getElementById('nmCity').value.trim(),
          category: document.getElementById('nmCat').value.trim() || '其他',
          tags: document.getElementById('nmTags').value.trim().split(/\s+/).filter(Boolean),
          elev: document.getElementById('nmElev').value.trim(),
          address: document.getElementById('nmAddr').value.trim(),
          coverImage: (photoBox && photoBox.dataset.cover) || (preset && preset.coverImage) || '',
          desc: document.getElementById('nmDesc').value.trim(),
          createdAt: (preset && preset.createdAt) || Date.now(),
          updatedAt: Date.now()
        };
        var arr = loadUserNodes();
        var idx = arr.findIndex(function (x) { return x.id === rec.id; });
        if (idx >= 0) arr[idx] = rec; else arr.push(rec);
        saveUserNodes(arr);
        m.remove();
        closeInfo();
        tip('已保存「' + rec.name + '」');
        if (pickMarker) { pickMarker.remove(); pickMarker = null; }
        placeUserMarker(rec);
      }
      if (hits.length) {
        UI.confirm({ title: '重复节点', text: '附近已有相似节点：' + hits.map(function (h) { return h.label || h.name; }).join('、') + '\n仍然添加？', okText: '仍然添加', danger: true }, function (ok) { if (ok) doSave(); });
      } else doSave();
    };
  }

    navigator.geolocation.getCurrentPosition(function (pos) {
      openForm({ lat: pos.coords.latitude, lng: pos.coords.longitude });
    }, function () { UI.toast('定位失败，请检查定位权限'); }, { enableHighAccuracy: true, timeout: 10000 });
  }
  /* 长按地图快速添加（规范 §29）：500ms 长按 → 表单 */
  function initLongPress() {
    var t0 = 0, timer = null, moved = false;
    map.on('touchstart', function (e) {
      moved = false;
      t0 = Date.now();
      timer = setTimeout(function () {
        if (moved) return;
        var ll = e.latlng;
        if (!ll) return;
        putMarker(ll.lat, ll.lng);
        UI.toast('快速添加：填写名称即可保存');
        openForm({ lat: ll.lat, lng: ll.lng });
      }, 500);
    });
    map.on('touchmove', function () { moved = true; });
    map.on('touchend touchcancel', function () { if (timer) { clearTimeout(timer); timer = null; } });
    map.on('contextmenu', function (e) { /* 桌面右键等效长按 */
      putMarker(e.latlng.lat, e.latlng.lng);
      openForm({ lat: e.latlng.lat, lng: e.latlng.lng });
    });
  }

  /* ---------- 启动 ---------- */
  window.NM = { edit: edit, remove: remove, closeInfo: closeInfo, flyToSys: flyToSys, locate: locate, toggleWish: toggleWish, record: record, sysWish: sysWish, sysRecord: sysRecord, get map() { return map; } };
  initFab();
  initMap();
  initLongPress();
  loadIndex(function () { tip('本地 ' + SITES.length + ' 个节点已就绪 · 搜索添加新地点', 2600); });
})();
</script>
