<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>我的 · 行迹</title>
<script src="theme.js"></script>
<link rel="stylesheet" href="design.css">
<style>
  html,body{min-height:100%;margin:0;font-family:var(--font-sans);background-color:var(--color-bg);color:var(--color-ink)}
  .page{max-width:560px;margin:0 auto;min-height:100dvh;padding-bottom:110px}
  .wrap{padding:18px 16px 8px}
  .hero-card{display:flex;align-items:center;gap:14px;background:var(--color-surface);border:1px solid var(--color-line);border-radius:20px;box-shadow:var(--shadow-soft);padding:18px 16px;margin-bottom:14px}
  .seal{width:52px;height:52px;border-radius:16px;background:var(--color-primary);color:var(--bg);display:grid;place-items:center;font-family:var(--font-serif);font-size:26px;flex:0 0 auto;box-shadow:0 4px 14px rgba(200,109,75,.3)}
  .hero-card .who{flex:1;min-width:0}
  .hero-card .who b{font-family:var(--font-serif);font-size:var(--fs-9);font-weight:400;color:var(--color-ink)}
  .hero-card .who div{font-size:var(--fs-3);color:var(--color-muted);margin-top:3px}
  .wish-pill{flex:0 0 auto;font-size:var(--fs-3);padding:7px 12px;border-radius:999px;background:var(--color-primary-soft);color:var(--color-primary-dark);text-decoration:none}
  .stats{display:flex;gap:6px;margin-bottom:12px}
  .stats .st{flex:1;text-align:center;padding:9px 2px;background:var(--color-surface);border:1px solid var(--color-line);border-radius:12px}
  .stats .st b{display:block;font-family:var(--font-serif);font-size:var(--fs-8);font-weight:400;color:var(--color-ink)}
  .stats .st span{font-size:var(--fs-1);color:var(--color-muted)}
  .panel{background:var(--color-surface);border:1px solid var(--color-line);border-radius:16px;padding:12px;margin-bottom:12px}
  .panel .ph{font-size:var(--fs-2);color:var(--color-muted);letter-spacing:.2em;margin-bottom:8px}
  .provs{display:flex;flex-wrap:wrap;gap:5px}
  .prov{display:inline-flex;align-items:center;padding:4px 8px;border-radius:999px;font-size:var(--fs-2);background:var(--color-bg-soft);color:var(--color-muted)}
  .prov.on{background:var(--color-primary);color:var(--bg);font-weight:600}
  .rec{display:flex;align-items:center;gap:10px;padding:7px 0;border-top:1px solid var(--color-line);font-size:var(--fs-4)}
  .rec:first-of-type{border-top:0}
  .rec .dot{width:7px;height:7px;border-radius:50%;background:var(--color-primary);flex:0 0 auto}
  .rec .t{flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .rec .d{font-size:var(--fs-2);color:var(--color-muted)}
  .entry{display:flex;align-items:center;gap:12px;background:var(--color-surface);border:1px solid var(--color-line);border-radius:16px;padding:13px 16px;margin-bottom:8px;text-decoration:none;color:var(--color-ink)}
  .entry .ic{width:34px;height:34px;border-radius:10px;background:var(--color-primary-soft);color:var(--color-primary-dark);display:grid;place-items:center;flex:0 0 auto;font-size:var(--fs-6)}
  .entry .nm{flex:1;font-size:var(--fs-5)}
  .entry .nm small{display:block;font-size:var(--fs-2);color:var(--color-muted);margin-top:2px}
  .entry .arr{color:var(--color-faint)}
  .grp-label{font-size:var(--fs-2);color:var(--color-muted);letter-spacing:.2em;margin:18px 4px 8px}
  /* v3 CINEMATIC LAYER */
  .hero-card{position:relative;overflow:hidden;border-radius:22px;padding:20px 18px;border:1px solid color-mix(in srgb,var(--color-gold-bright) 34%,transparent);background:linear-gradient(150deg,var(--color-surface),color-mix(in srgb,var(--color-primary-soft) 45%,var(--color-surface)));box-shadow:var(--shadow-medium)}
  .hero-card::after{content:"";position:absolute;right:-48px;top:-48px;width:132px;height:132px;border-radius:50%;background:radial-gradient(circle at center,rgba(212,113,74,.16),transparent 70%);pointer-events:none}
  .seal{width:56px;height:56px;border-radius:18px;background:var(--grad-primary);font-size:28px;box-shadow:var(--glow-ember),inset 0 1px 0 rgba(255,255,255,.28);position:relative;z-index:1}
  .hero-card .who{position:relative;z-index:1}
  .hero-card .who b{font-size:var(--fs-9)}
  .wish-pill{padding:8px 14px;background:var(--grad-night);color:var(--color-paper-warm);box-shadow:var(--shadow-soft);position:relative;z-index:1;font-size:var(--fs-3)}
  .wish-pill b{color:var(--color-gold-bright);font-family:var(--font-serif)}
  .stats{gap:8px}
  .stats .st{padding:11px 2px 10px;border-radius:14px;box-shadow:var(--shadow-soft);position:relative;overflow:hidden}
  .stats .st::before{content:"";position:absolute;left:0;right:0;top:0;height:2px;background:var(--grad-gold-line);opacity:.8}
  .stats .st b{font-size:var(--fs-8);background:var(--grad-gold);-webkit-background-clip:text;background-clip:text;color:transparent}
  .panel{border-radius:18px;padding:14px 15px;box-shadow:var(--shadow-soft)}
  .prov{padding:5px 10px;font-size:var(--fs-2);transition:transform var(--motion-fast) var(--ease-out),box-shadow var(--motion-fast) var(--ease-out)}
  .prov.on{background:var(--grad-primary);border-color:transparent;box-shadow:0 3px 10px rgba(172,78,45,.28)}
  .rec .dot{background:var(--grad-primary)}
  .entry{border-radius:18px;padding:14px 16px;margin-bottom:10px;box-shadow:var(--shadow-soft);transition:transform var(--motion-fast) var(--ease-out),box-shadow var(--motion-fast) var(--ease-out)}
  .entry:active{transform:scale(.985)}
  @media(hover:hover){.entry:hover{transform:translateY(-2px);box-shadow:var(--shadow-float)}}
  .entry .ic{width:40px;height:40px;border-radius:13px;background:linear-gradient(145deg,color-mix(in srgb,var(--color-primary) 24%,var(--color-surface)),color-mix(in srgb,var(--color-primary) 10%,var(--color-surface)))}
  .entry .arr{width:24px;height:24px;border-radius:50%;display:grid;place-items:center;background:var(--color-bg-soft);font-size:var(--fs-4)}
  .theme-dark .hero-card{background:linear-gradient(150deg,rgba(255,255,255,.06),rgba(212,113,74,.10));border-color:rgba(220,174,94,.22)}
  .theme-dark .wish-pill{background:linear-gradient(145deg,#2B241D,#1F1A15)}
  .theme-dark .entry .ic{background:linear-gradient(145deg,rgba(212,113,74,.22),rgba(212,113,74,.08))}
  /* 批次 24-E：两张常驻卡。它们的价值不在信息量，而在「从不进规划页的人也看得见行程与记账」——
     入口太窄的病灶就是这两个功能只活在规划结果页的尾部。版式跟着本页的 .panel/.rec 一族走，
     不搬 trip.html 那套卡片皮肤（两页的容器不同，各写一套才不会出现"看着像但差一点"）。 */
  .mrow{display:flex;align-items:center;gap:10px;min-height:52px;padding:9px 0;border-top:1px solid var(--color-line);text-decoration:none;color:var(--color-ink)}
  .mrow:first-child{border-top:0}
  .mrow .mn{flex:1;min-width:0}
  .mrow .mn b{display:block;font-size:var(--fs-4);font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .mrow .mn small{display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:2;overflow:hidden;font-size:var(--fs-2);color:var(--color-muted);margin-top:2px;line-height:1.5}
  .mrow .mm{flex:0 0 auto;text-align:right;font-family:var(--font-serif);font-size:var(--fs-5);color:var(--color-ink);font-variant-numeric:tabular-nums}
  .mrow .mm i{display:block;font-style:normal;font-family:var(--font-sans);font-size:var(--fs-1);color:var(--color-muted);margin-top:1px}
  .mrow .arr{flex:0 0 auto;width:24px;height:24px;border-radius:50%;display:grid;place-items:center;background:var(--color-bg-soft);color:var(--color-muted);font-size:var(--fs-4)}
  .msum{display:flex;align-items:baseline;gap:6px}
  .msum b{font-family:var(--font-serif);font-size:var(--fs-10);font-weight:400;line-height:1.15;color:var(--color-ink);font-variant-numeric:tabular-nums}
  .msum i{font-style:normal;font-size:var(--fs-3);color:var(--color-muted)}
  .msum .mcnt{margin-left:auto;font-size:var(--fs-2);color:var(--color-muted)}
  .msub{font-size:var(--fs-2);color:var(--color-muted);margin-top:5px;line-height:1.6}
  .mhint{font-size:var(--fs-3);color:var(--color-muted);padding:4px 0 2px;line-height:1.7}
  .mbtn{display:flex;align-items:center;justify-content:center;gap:6px;width:100%;min-height:44px;margin-top:8px;padding:0 14px;border-radius:13px;border:1px solid var(--color-line-strong);background:var(--color-bg-soft);color:var(--color-ink-soft);font-size:var(--fs-4);text-decoration:none;box-sizing:border-box}
  .mbtn.pri{background:var(--grad-primary);border-color:transparent;color:#fff;font-weight:600;box-shadow:var(--glow-ember)}
  .mbtn:active{transform:scale(.985)}
</style>
</head>
<body>
<div class="page">
  <header class="topbar">
    <div class="t-row">
      <button class="back" aria-label="返回" onclick="history.length>1?history.back():location.href='index.html'">←</button>
      <div class="title">我的 <small>My Journey</small></div>
    </div>
  </header>

  <div class="wrap">
    <div class="hero-card">
      <div class="seal">迹</div>
      <div class="who">
        <b>我的足迹</b>
        <div id="meSub">还没有记录，去探索第一处风景</div>
      </div>
      <a class="wish-pill" href="wishlist.html">想去 <b id="meWish">0</b></a>

    <div class="stats" id="meStats"></div>

    <!-- 批次 24-E：行程与记账在「我的」这一层常驻。此前它们只活在规划结果页尾部，
         不进规划页的人等于没有这两个功能；两张卡都是纯读数，点击一律跳到能改的那一页。 -->

    <div class="panel"><div class="ph">今年已花</div>
      <div class="msum"><b id="meYearSum">0.00</b><i>元</i><span class="mcnt" id="meYearCnt"></span></div>
      <div class="msub" id="meYearCats"></div>
      <a class="mbtn" href="expense.html">打开记账本</a>
    </div>

    <div class="panel"><div class="ph">省份足迹</div><div class="provs" id="meProvs"></div></div>

    <div class="panel"><div class="ph">最近记录</div><div id="meRecent"></div></div>

    <div style="margin-top:16px">
      <div class="grp-label">我的旅程</div>
      <a class="entry" href="review.html"><span class="ic"><span aria-hidden="true"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><circle cx="12" cy="9" r="5"/><path d="M8.5 13.5 L7 21 L12 18.5 L17 21 L15.5 13.5"/></svg></span></span><span class="nm">回顾与成果<small>统计 · 日历 · 成就 · 海报 · 年度报告</small></span><span class="arr">›</span></a>
      <a class="entry" href="album.html"><span class="ic"><span aria-hidden="true"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="5" width="16" height="14" rx="2"/><circle cx="9" cy="10" r="1.5"/><path d="M4 16 L9.5 11.5 L13.5 15 L16 12.5 L20 16"/></svg></span></span><span class="nm">旅行图册<small>把游记排成一本可翻阅的旅行书</small></span><span class="arr">›</span></a>
      <a class="entry" href="story.html"><span class="ic"><span aria-hidden="true"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><path d="M5 4 H19 V20 H5 Z"/><path d="M8 8 H16 M8 12 H16 M8 16 H13"/></svg></span></span><span class="nm">旅程叙事时间线<small>按旅程顺序重走一遍</small></span><span class="arr">›</span></a>
      <div class="grp-label">行前准备</div>
      <a class="entry" href="wishlist.html"><span class="ic"><span aria-hidden="true"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"><path d="M12 3 L14.8 8.9 L21 9.6 L16.5 13.8 L17.6 20 L12 16.9 L6.4 20 L7.5 13.8 L3 9.6 L9.2 8.9 Z"/></svg></span></span><span class="nm">想去清单<small>收藏 · 打卡 · 就近分日计划</small></span><span class="arr">›</span></a>
      <a class="entry" href="node-manager.html"><span class="ic"><span aria-hidden="true"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><circle cx="12" cy="12" r="7"/><path d="M12 8 V16 M8 12 H16"/></svg></span></span><span class="nm">我的地点<small>添加/编辑自己想去或去过的地方</small></span><span class="arr">›</span></a>
      <div class="grp-label">数据与工具</div>
      <a class="entry" href="search.html"><span class="ic"><span aria-hidden="true"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><circle cx="11" cy="11" r="6.5"/><path d="M16 16 L21 21"/></svg></span></span><span class="nm">搜索全部景点<small>全国景点全库检索</small></span><span class="arr">›</span></a>
      <a class="entry" href="settings.html"><span class="ic"><span aria-hidden="true"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><circle cx="12" cy="12" r="3"/><path d="M12 3 V5 M12 19 V21 M3 12 H5 M19 12 H21 M5.6 5.6 L7 7 M17 17 L18.4 18.4 M18.4 5.6 L17 7 M7 17 L5.6 18.4"/></svg></span></span><span class="nm">设置<small>AI · 语音 · 外观 · 数据备份与迁移</small></span><span class="arr">›</span></a>
    </div>
  </div>

  <div id="bnav"></div><script src="icons.js"></script><script src="nav.js" data-active="me"></script>
</div>

<script src="geo.js"></script>
<script src="ui.js"></script>
<script src="expense.js"></script>
<script src="checklist.js"></script>
<script src="ticketbox.js"></script>
<script src="travel-notes.js"></script>
<script src="wishlist.js"></script>
<script>
(function(){
  function esc(s){ return window.UI.esc(s); }
  function $(i){ return document.getElementById(i); }
  function readTrips(){ try { return JSON.parse(localStorage.getItem('tn_trips') || '[]'); } catch (e) { return []; } }
  /* 计划口径与实际口径分开取，谁也不冒充谁（与 trip.html 同一把尺子） */
  function planStart(t){ return Expense.isoOf(t && t.startDate); }
  function realStart(t){ return Expense.isoOf(t && t.logStart); }
  function startOf(t){ return realStart(t) || planStart(t); }
  function planDays(t){ return (t && t.days) ? t.days.length : 0; }
  function realDays(t){ var n = Math.round(Number(t && t.realDays)); return isFinite(n) && n > 0 ? n : planDays(t); }
  function stopStats(t){
    var total = 0, done = 0;
    ((t && t.days) || []).forEach(function(d){ (d.stops || []).forEach(function(s){ total++; if (s && s.done) done++; }); });
    return { total: total, done: done };
  }
  function centsOf(x){ var c = Math.round(Number(x && x.cents)); return isFinite(c) ? c : 0; }
  function catOf(c){ return Expense.CATS.indexOf(c) >= 0 ? c : '其他'; }

  /* 「我的行程」：一行一趟，读数全是只读的（要改就点进 trip.html / expense.html）。
     一趟都没有时不留白板——这一页是「不用排期的人」唯一的落脚点，空态必须给两条能走的路。 */
  function renderTrips(){
    var box = $('meTrips'); if (!box) return;
    var list = readTrips().filter(function(t){ return t && t.id; });
    var freeN = Expense.listOf(Expense.FREE_ID).length, freeC = Expense.totalCents(Expense.FREE_ID);
    if (!list.length) {
      box.innerHTML = '<div class="mhint">还没有行程。不排期也能记账，两件事各走各的门。</div>' +
        '<a class="mbtn pri" href="planner.html">去排一趟行程</a>' +
        '<a class="mbtn" href="expense.html?trip=' + encodeURIComponent(Expense.FREE_ID) + '">不排行程，直接记一笔</a>';
      return;
    }
    box.innerHTML = list.map(function(t){
      var n = Expense.listOf(t.id).length, c = Expense.totalCents(t.id);
      var ck = window.Checklist ? Checklist.statsOf(t.id) : { total: 0, done: 0 };
      var ss = stopStats(t), st = startOf(t);
      return '<a class="mrow" data-id="' + esc(t.id) + '" href="trip.html?trip=' + encodeURIComponent(t.id) + '"><span class="mn"><b>' + esc(t.name || '未命名行程') + '</b><small>' +
        (st ? (realStart(t) ? '实际 ' : '计划 ') + st + ' · ' : '没填出发日期 · ') +
        '计划 ' + planDays(t) + ' 天' + (realDays(t) !== planDays(t) ? ' · 实际 ' + realDays(t) + ' 天' : '') +
        (ss.total ? ' · 打卡 ' + ss.done + '/' + ss.total : '') + (ck.total ? ' · 清单 ' + ck.done + '/' + ck.total : '') +
        '</small></span><span class="mm">' + (n ? Expense.fmtMoney(c) + '<i>' + n + ' 笔</i>' : '<i>还没记账</i>') +
        '</span><span class="arr">›</span></a>';
    }).join('') + (freeN
      ? '<a class="mrow" href="expense.html?trip=' + encodeURIComponent(Expense.FREE_ID) + '"><span class="mn"><b>' + esc(Expense.FREE_NAME) + '</b><small>没挂在任何行程上的开销</small></span><span class="mm">' + Expense.fmtMoney(freeC) + '<i>' + freeN + ' 笔</i></span><span class="arr">›</span></a>'
      : '');
    /* 票数是 IndexedDB 的异步读数：先画行再补字，读不到就不提（印「票 0 张」是骗人）。
       这一页会在游记库 ready 后整体重画，两次渲染的回调可能都落在同一个新节点上，
       所以补字要带幂等标记——否则那格小字会变成「票 2 张 · 票 2 张」。 */
    if (window.TicketBox) {
      list.forEach(function(t){
        TicketBox.list(t.id).then(function(tk){
          if (!tk || !tk.length) return;
          var s = document.querySelector('#meTrips .mrow[data-id="' + t.id + '"] .mn small');
          if (!s || s.getAttribute('data-tk')) return;
          s.setAttribute('data-tk', String(tk.length));
          s.textContent += ' · 票 ' + tk.length + ' 张';
        }).catch(function(){});
      });
    }
  }

  /* 「今年已花」：合计走 yearCents（跨桶、反推不出日期的条目不进任何年份），
     分类前二只能自己按年筛——catTotals 不分年，直接用会把往年的账算进今年。 */
  function renderYear(){
    var sum = $('meYearSum'); if (!sum) return;
    var year = Expense.todayISO().slice(0, 4);
    var trips = readTrips().filter(function(t){ return t && t.id; });
    var byId = {}; trips.forEach(function(t){ byId[t.id] = t; });
    var y = Expense.yearCents(year, function(id){ return byId[id] || null; });
    sum.textContent = Expense.fmtMoney(y.cents);
    $('meYearCnt').textContent = y.count ? y.count + ' 笔' : '';
    var m = {}; Expense.CATS.forEach(function(c){ m[c] = 0; });
    /* 桶列表要并上账本里出现过的 tripId：行程被删后那批孤儿账合计还认、分类不能看不见它 */
    var seen = {};
    var buckets = [];
    Expense.tripIds().forEach(function(id){ seen[id] = 1; buckets.push({ id: id, start: startOf(byId[id]) }); });
    trips.forEach(function(t){ if (!seen[t.id]) { seen[t.id] = 1; buckets.push({ id: t.id, start: startOf(t) }); } });
    if (!seen[Expense.FREE_ID]) buckets.push({ id: Expense.FREE_ID, start: '' });
    buckets.forEach(function(b){
      Expense.byDate(b.id, b.start).forEach(function(g){
        if (!g.date || g.date.slice(0, 4) !== year) return;
        g.items.forEach(function(x){ m[catOf(x.cat)] += centsOf(x); });
      });
    });
    var top = Expense.CATS.map(function(c){ return { cat: c, cents: m[c] }; })
      .filter(function(o){ return o.cents > 0; })
      .sort(function(a, b){ return b.cents - a.cents; });
    $('meYearCats').textContent = top.length
      ? '主要是 ' + top.slice(0, 2).map(function(o){ return o.cat + ' ' + Expense.fmtMoney(o.cents) + ' 元'; }).join(' · ')
      : (y.count ? '' : '今年还没有记账，点下面记一笔');
  }

  function render(){
    var notes = (window.TravelNotes && TravelNotes.list) ? TravelNotes.list() : [];
    var wish = (window.Wish && Wish.count) ? Wish.count() : 0;
    var el = document.getElementById('meWish'); if (el) el.textContent = wish;
    var st = window.TNStats ? TNStats() : null;
    if (!st) st = { provs: [], cities: [], days: [], km: 0 };
    var provs = {}, cities = {}, km = st.km, days = {};
    st.provs.forEach(function (p) { provs[p] = 1; });
    st.cities.forEach(function (c) { cities[c] = 1; });
    st.days.forEach(function (d) { days[d] = 1; });
    var pn = st.provs.length;
    document.getElementById('meSub').textContent = notes.length ? (pn + ' 个省份 · ' + Object.keys(cities).length + ' 个城市 · ' + Object.keys(days).length + ' 天在路上') : '还没有记录，去探索第一处风景';
    document.getElementById('meStats').innerHTML = [
      ['省份', pn + ' / 34'], ['城市', Object.keys(cities).length], ['里程', Math.round(km) + ' km'], ['记录日', Object.keys(days).length]
    ].map(function(m){ return '<div class="st"><b>' + m[1] + '</b><span>' + m[0] + '</span></div>'; }).join('');
    var ALL=[['北京','京'],['天津','津'],['河北','冀'],['山西','晋'],['内蒙古','蒙'],['辽宁','辽'],['吉林','吉'],['黑龙江','黑'],['上海','沪'],['江苏','苏'],['浙江','浙'],['安徽','皖'],['福建','闽'],['江西','赣'],['山东','鲁'],['河南','豫'],['湖北','鄂'],['湖南','湘'],['广东','粤'],['广西','桂'],['海南','琼'],['重庆','渝'],['四川','川'],['贵州','黔'],['云南','滇'],['西藏','藏'],['陕西','陕'],['甘肃','甘'],['青海','青'],['宁夏','宁'],['新疆','新'],['香港','港'],['澳门','澳'],['台湾','台']];
    document.getElementById('meProvs').innerHTML = ALL.map(function(p){ return '<span class="prov' + (provs[p[0]] ? ' on' : '') + '">' + p[1] + '</span>'; }).join('');
    var recent = notes.slice().sort(function(a,b){ return b.ts - a.ts; }).slice(0,4);
    document.getElementById('meRecent').innerHTML = recent.length ? recent.map(function(n){
      return '<div class="rec"><span class="dot"></span><span class="t">' + esc(n.title || n.siteName || '未命名') + '</span><span class="d">' + esc(TravelNotes.dayText(n)) + '</span></div>';
    }).join('') : '<div style="font-size:var(--fs-3);color:var(--color-muted);padding:6px 0">还没有游记，去景点点「语音记录」开始</div>';
    if (window.Expense) { renderTrips(); renderYear(); }
  }
  render();
  /* 游记库为 IndexedDB 异步加载：ready 后重渲染（否则首屏永远读到空库） */
  window.TravelNotes._onReady = render;
  try { TravelNotes.init({}); } catch (e) {}
})();
</script>
</body>
</html>
