<script>
const SITES = window.SITES || [];
const THEME = {"圣湖":"#6D7D88","神山":"#8C7B66","寺庙":"#C86D4B","古遗址":"#8A5A44","土林":"#A9563B","垭口":"#9C9A92","边境口岸":"#71806C","草原":"#71806C","峡谷":"#6D7D88","冰川":"#5F6D76","古城":"#8A5A44","纪念碑":"#A9563B","村庄":"#C86D4B","其他":"#B4AFA4"};
const THEME_ICON = {"圣湖":"💧","神山":"🏔️","寺庙":"🛕","古遗址":"🏛️","土林":"🌋","垭口":"🔻","边境口岸":"🚩","草原":"🌾","峡谷":"🏞️","冰川":"❄️","古城":"🏯","纪念碑":"📜","村庄":"🏘️","其他":"📍"};
const THEME_ORDER = ["圣湖","神山","寺庙","古遗址","土林","垭口","边境口岸","草原","峡谷","冰川","古城","纪念碑","村庄","其他"];
const REF = {"玉树":[33.00,97.01],"拉萨":[29.65,91.13],"叶城":[37.875,77.469]};

const state = { q:"", region:"", theme:"", elev:"", sort:"" };
let userLatLng = null, userMarker = null, watchId = null, pickMode = false;
let routeLayer = null, curSite = null, tripRouteLayer = null;

function haversine(a,b){const R=6371,dLat=(b[0]-a[0])*Math.PI/180,dLng=(b[1]-a[1])*Math.PI/180;
  const s=Math.sin(dLat/2)**2+Math.cos(a[0]*Math.PI/180)*Math.cos(b[0]*Math.PI/180)*Math.sin(dLng/2)**2;
  return 2*R*Math.asin(Math.sqrt(s));}
function refPoint(){if(state.sort==="me"&&userLatLng)return userLatLng;if(state.sort&&REF[state.sort])return REF[state.sort];return null;}

function getFiltered(){
  const q=state.q.trim().toLowerCase();
  let arr=SITES.filter(s=>{
    if(state.region&&s.region!==state.region)return false;
    if(state.theme&&s.theme!==state.theme)return false;
    if(state.elev){
      const e=+s.elev||0;
      if(state.elev==="low"&&!(e<3000))return false;
      if(state.elev==="mid"&&!(e>=3000&&e<4000))return false;
      if(state.elev==="high"&&!(e>=4000&&e<5000))return false;
      if(state.elev==="xhigh"&&!(e>=5000))return false;
    }
    if(q){const hay=(s.name+s.label+s.region+s.county+s.theme+s.desc+(s.history||"")+(s.legend||"")+(s.figure||"")+(s.religion||"")+(s.culture||"")+(s.geo||"")).toLowerCase();
      if(!hay.includes(q))return false;}
    return true;
  });
  const rp=refPoint();
  if(rp){arr=arr.map(s=>({...s,_d:haversine(rp,[s.lat,s.lng])})).sort((a,b)=>a._d-b._d);}
  return arr;
}

const map = L.map('mapEl',{zoomControl:false,attributionControl:false}).setView([33.0,88.0],5);
// 缩放用自定义 .ctl 按钮（右上角），不再加载 Leaflet 默认缩放
L.control.attribution({position:'bottomleft',prefix:false}).addTo(map);
const osmLayer = L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,attribution:'&copy; OpenStreetMap'});
const satLayer = L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}',{maxZoom:19,attribution:'&copy; Esri'});
const topoLayer = L.tileLayer('https://{s}.tile.opentopomap.org/{z}/{x}/{y}.png',{maxZoom:17,attribution:'&copy; OpenTopoMap'});
const markerLayer = L.layerGroup().addTo(map);

/* ---------- 高德图层（GCJ-02 坐标纠偏） ---------- */
const AMAP_KEY = '9e530e2ccc388a8390655b398d354149';
let useGCJ = true, lastMarkerList = null, lastRouteRi = null;
function _tlat(lng, lat) { return window.Geo._tlat(lng, lat); }
function _tlng(lng, lat) { return window.Geo._tlng(lng, lat); }
const _A=6378245.0,_EE=0.00669342162296594323;
function gcj02Of(lat, lng) { return window.Geo.gcj02Of(lat, lng); }
function pt(s){ return useGCJ? gcj02Of(s.lat,s.lng):[s.lat,s.lng]; }
function gxy(lat,lng){ return useGCJ? gcj02Of(lat,lng):[lat,lng]; }
const amapStreet = L.tileLayer('https://wprd0{s}.is.autonavi.com/appmaptile?lang=zh_cn&size=1&style=7&x={x}&y={y}&z={z}',{subdomains:'1234',maxZoom:18,attribution:'© 高德地图'});
amapStreet.addTo(map);
/* 高德瓦片失败自动降级 OSM（国内无网络/被墙时地图不空白） */
amapStreet.on('tileerror',function(){ if(!map.hasLayer(osmLayer)){ try{ amapStreet.remove(); }catch(e){} osmLayer.addTo(map); } });   // 默认图层：高德街道（GCJ-02 纠偏）
const amapSat = L.tileLayer('https://wprd0{s}.is.autonavi.com/appmaptile?style=6&x={x}&y={y}&z={z}',{subdomains:'1234',maxZoom:18,attribution:'© 高德地图'});
const amapLabel = L.tileLayer('https://wprd0{s}.is.autonavi.com/appmaptile?style=8&x={x}&y={y}&z={z}',{subdomains:'1234',maxZoom:18,attribution:''});
const amapSatL = L.layerGroup([amapSat,amapLabel]);
// 自定义图层菜单（替代默认 layers 控件）
const BASE_LAYERS=[
  {id:'osm', name:'街道地图', sw:'linear-gradient(#f0f0ec,#d8d8d2)', layer:osmLayer},
  {id:'sat', name:'卫星实景', sw:'linear-gradient(#3c5d52,#27423f)', layer:satLayer},
  {id:'topo', name:'等高线地形', sw:'linear-gradient(#d9c9a8,#b8a878)', layer:topoLayer},
  {id:'amapStreet', name:'高德街道', sw:'linear-gradient(#c9d3c0,#8fa893)', layer:amapStreet},
  {id:'amapSat', name:'高德卫星', sw:'linear-gradient(#27423f,#101f1b)', layer:amapSat},
  {id:'amapSatL', name:'高德卫星+注记', sw:'linear-gradient(#3c5d52,#0f2a24)', layer:amapSatL}
];
const layMenu=document.getElementById('layMenu');
BASE_LAYERS.forEach(b=>{

  li.onclick=()=>{
    BASE_LAYERS.forEach(x=>{ if(map.hasLayer(x.layer)) map.removeLayer(x.layer); });
    b.layer.addTo(map);
    layMenu.querySelectorAll('.li').forEach(x=>{

      x.classList.toggle('on',on);
      x.querySelector('.ck').style.display=on?'':'none';
    });
    const isGCJ=(b.id==='amapStreet'||b.id==='amapSat'||b.id==='amapSatL');

      useGCJ=isGCJ;

document.getElementById('layBtn').onclick=e=>{e.stopPropagation();layMenu.classList.toggle('show');};
document.getElementById('zoomIn').onclick=()=>map.zoomIn();
document.getElementById('zoomOut').onclick=()=>map.zoomOut();
map.on('click',()=>layMenu.classList.remove('show'));
map.on('movestart',()=>layMenu.classList.remove('show'));
map.on('baselayerchange',e=>{

});
// 任意途经点随手记：点地图空白处 → 弹出「🎙 在此语音记录」
function spotRec(lat,lng){
  const m=L.marker([lat,lng],{icon:L.divIcon({html:'<div style="font-size:22px;line-height:1;filter:drop-shadow(0 1px 3px rgba(0,0,0,.5))">🎙️</div>',className:'',iconSize:[24,24],iconAnchor:[12,22]})}).addTo(map);
  m.bindPopup(`<div class="pop"><div class="pscroll"><b>途经点随手记</b><div class="pm">${lat.toFixed(5)}, ${lng.toFixed(5)}</div>
      <div class="pm pa">在此以 GPS 位置语音记录一段见闻，保存后成为游记节点。</div></div>
      <div class="pfoot"><button class="addtrip tnvo" onclick="__tnSpot(${lat},${lng})">🎙 在此语音记录</button></div></div>`,
    {maxWidth:260,className:'trippop',autoPan:true}).openPopup();
  m.on('popupclose',()=>{ if(map.hasLayer(m))map.removeLayer(m); });
}
window.__tnSpot=function(lat,lng){ TravelNotes.openPanel({label:'途经点',lat:lat,lng:lng}); };
// 顶部「随手记」：GPS 定位当前真实位置（WGS84），失败则退回已知位置/提示
window.__tnAnywhere=function(){
  const open=p=>TravelNotes.openPanel({label:'当前位置（GPS）',lat:p.lat,lng:p.lng});
  const tip=msg=>{
    const d=document.createElement('div');
    d.style.cssText='position:fixed;top:14px;left:50%;transform:translateX(-50%);background:rgba(31,122,90,.95);color:#fff;padding:8px 16px;border-radius:999px;font-size:13px;z-index:9600;box-shadow:0 2px 12px rgba(0,0,0,.2);white-space:nowrap;max-width:90vw;overflow:hidden;text-overflow:ellipsis';
    d.textContent=msg; document.body.appendChild(d);
    setTimeout(()=>d.remove(),2400);
  };
  const fallback=()=>{
    if(userLatLng){ open({lat:userLatLng[0],lng:userLatLng[1]}); }
    else {
      if(!document.getElementById('map').classList.contains('active'))switchTab('map');
      tip('⚠️ 无法获取位置：可点 📍 定位，或直接在地图上点想记录的地点');
    }
  };
  try{
    if(navigator.geolocation){
      navigator.geolocation.getCurrentPosition(p=>open({lat:p.coords.latitude,lng:p.coords.longitude}),fallback,{enableHighAccuracy:true,timeout:6000,maximumAge:15000});
    } else fallback();
  }catch(e){ fallback(); }
};
const markers = new Map();

function esc(s){return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
function buildSheet(i){
  const s=SITES[i]; if(!s) return '';
  const inT=inTrip(i);
  const img=s.img?`<div class="ls-img"><img src="${s.img}" alt="${esc(s.label)}" onerror="this.style.display='none'"></div>`:'';
  const ann=[];
  if(s.history)ann.push("史："+esc(s.history));
  if(s.legend)ann.push("传："+esc(s.legend));
  if(s.figure)ann.push("人："+esc(s.figure));
  if(s.religion)ann.push("教："+esc(s.religion));
  const annHtml=ann.length?`<div class="ls-hist">${ann.map(a=>'<b>'+a.split('：')[0]+'</b>：'+a.split('：').slice(1).join('：')).join('<br>')}</div>`:'';
  return `<div class="ls-place">${esc(s.label)}</div>
      <div class="ls-loc">${THEME_ICON[s.theme]||''} ${esc(s.theme)} · ${esc(s.region)}${s.county?(' · '+esc(s.county)):''}${s.elev?(' · 海拔'+esc(s.elev)+'m'):''}</div>
      ${img}
      <div class="ls-desc">${esc(s.desc)}</div>
      ${annHtml}
      <div class="ls-actions">
        <button class="btn-primary" style="min-height:46px;font-size:13.5px;padding:0 18px" onclick="TravelNotes.explain(${i})">🎧 听讲解</button>
        <button class="btn-secondary" style="min-height:46px;font-size:13.5px;padding:0 16px" onclick="TravelNotes.openPanel(${i})">🎙 语音记录</button>
        <span class="ls-add${inT?' done':''}" onclick="toggleTrip(${i},null)">${inT?'✓ 已加入行程':'+ 加入行程'}</span>
      </div>
      <div class="ls-more">
        <span onclick="flyToSite(${i},true)">在地图查看</span>
        <span onclick="closeSheet()">收起</span>
      </div>`;
}
function openSheet(i){
  curSite=i;
  document.getElementById('lsBody').innerHTML=buildSheet(i);
  document.getElementById('locSheet').classList.add('show');
  setActiveNode(i);
  document.querySelector('.tabbar').classList.add('is-hidden');
  highlightCard(i);
  if(map) setTimeout(function(){map.panBy([0,-160],{duration:420});},80);
}
function closeSheet(){
  document.getElementById('locSheet').classList.remove('show');
  document.querySelector('.tabbar').classList.remove('is-hidden');
  curSite=null; setActiveNode(-1);
  if(map) setTimeout(function(){map.panBy([0,160],{duration:420});},80);
}
function refreshSheet(){
  if(curSite!=null && document.getElementById('locSheet').classList.contains('show')){
    document.getElementById('lsBody').innerHTML=buildSheet(curSite);
  }
}
function isMajorSite(s){ return s.theme==='神山'||s.theme==='圣湖'; }
function nodeIcon(s,active){
  const theme=THEME[s.theme]||'#7D7970';
  const inT=inTrip(s.__i);
  const num=inT?(trip.indexOf(s.__i)+1):null;
  const cls='tr-node'+(active?' tr-active':'')+(isMajorSite(s)?' tr-major':'');
  let html='<div class="'+cls+'"><span class="tr-ring" style="--tint:'+theme+'"></span><span class="tr-dot"></span>';
  if(num) html+='<span class="node-num">'+num+'</span>';
  html+='</div>';
  return L.divIcon({className:'',html:html,iconSize:[26,26],iconAnchor:[13,13]});
}
function setActiveNode(i){
  markers.forEach((m,idx)=>{ if(SITES[idx]) m.setIcon(nodeIcon(SITES[idx], idx===i)); });
}
function drawTripRoute(){
  if(tripRouteLayer){ tripRouteLayer.remove(); tripRouteLayer=null; }
  if(trip.length<2) return;
  const pts=trip.map(i=>pt(SITES[i]));
  tripRouteLayer=L.polyline(pts,{color:'#C86D4B',weight:3,opacity:.7,dashArray:'6 6'}).addTo(map);
}
function showTripToast(msg){
  let t=document.getElementById('tripToast');
  if(!t){ t=document.createElement('div'); t.id='tripToast'; t.className='toast'; document.body.appendChild(t); }
  t.textContent=msg; t.classList.add('show');
  setTimeout(()=>t.classList.remove('show'),1800);
}
function colorOf(s){return THEME[s.theme]||"#7D7970";}
function renderMarkers(list){
  lastMarkerList=list;
  markerLayer.clearLayers(); markers.clear();
  list.forEach(s=>{
    const m=L.marker(pt(s),{icon:nodeIcon(s,false)});
    m.on('click',()=>openSheet(s.__i));
    markerLayer.addLayer(m); markers.set(s.__i,m);
  });
}

/* ---------- 我的行程 ---------- */
const TRIP_KEY='trip_qingzang';
let trip=[];
try{ trip=JSON.parse(localStorage.getItem(TRIP_KEY)||'[]'); }catch(e){ trip=[]; }
function inTrip(i){ return trip.indexOf(i)>=0; }
function saveTrip(){ try{ localStorage.setItem(TRIP_KEY, JSON.stringify(trip)); }catch(e){} }
function toggleTrip(i, btn){
  const k=trip.indexOf(i);
  const isAdd = k<0;
  if(k>=0) trip.splice(k,1); else trip.push(i);
  saveTrip(); renderTripBar(); drawTripRoute();
  if(isAdd) showTripToast('+1 已加入今天的行程');
  refreshSheet();
}

function renderTripBar(){
  const bar=document.getElementById('tripBar');
  document.getElementById('tripCnt').textContent=trip.length;
  const row=document.getElementById('tripRow'); row.innerHTML='';
  trip.forEach((i,n)=>{
    const s=SITES[i]; if(!s)return;
    const c=document.createElement('div'); c.className='chip';
    c.innerHTML=`<span class="no">${n+1}</span><span class="nm" style="cursor:pointer">${s.label}</span><span class="mv" data-d="up">▲</span><span class="mv" data-d="dn">▼</span><span class="x">✕</span>`;
    c.querySelector('.nm').onclick=()=>flyToSite(i);
    c.querySelector('[data-d="up"]').onclick=(e)=>{e.stopPropagation(); if(n>0){ trip.splice(n,1); trip.splice(n-1,0,i); saveTrip(); renderTripBar(); } };
    c.querySelector('[data-d="dn"]').onclick=(e)=>{e.stopPropagation(); if(n<trip.length-1){ trip.splice(n,1); trip.splice(n+1,0,i); saveTrip(); renderTripBar(); } };
    c.querySelector('.x').onclick=(e)=>{e.stopPropagation(); toggleTrip(i); };
    row.appendChild(c);
  });
  const fab=document.getElementById('tripFab');
  document.getElementById('tripBadge').textContent=trip.length;
  fab.style.display = trip.length>0 ? 'flex':'none';
  if(trip.length===0) bar.classList.remove('open');
}
function sortTripNN(){
  if(trip.length<2){ showTripToast('至少需要 2 个地点才能排序'); return; }
  if(!userLatLng){ showTripToast('先点 📍 定位，才能按距离排序'); return; }
  const rest=trip.slice(); const out=[]; let cur=userLatLng;
  while(rest.length){
    let bi=0,bd=1e12;
    rest.forEach((i,k)=>{ const s=SITES[i]; const d=(s.lat-cur[0])**2+(s.lng-cur[1])**2; if(d<bd){bd=d;bi=k;} });
    const pick=rest.splice(bi,1)[0]; out.push(pick); cur=[SITES[pick].lat,SITES[pick].lng];
  }
  trip=out; saveTrip(); renderTripBar(); drawTripRoute();
  showTripToast('我帮你重新排了一下顺序');
}
function navAmap(){
  if(trip.length===0)return;
  let pts=trip.map(i=>{ const s=SITES[i]; const g=gcj02Of(s.lat,s.lng); return {lng:g[1],lat:g[0],name:s.label}; });
  let sLng,sLat,sName='我的位置';
  if(userLatLng){ const g=gcj02Of(userLatLng[0],userLatLng[1]); sLng=g[1]; sLat=g[0]; }
  else { const f=pts.shift(); sLng=f.lng; sLat=f.lat; sName=f.name; }
  if(pts.length===0){
    window.location.href=`https://uri.amap.com/marker?position=${sLng},${sLat}&name=${encodeURIComponent(sName)}&src=古建地图&coordinate=gaode&callnative=1`;
    return;
  }
  const dest=pts[pts.length-1]; const ways=pts.slice(0,-1);
  // 高德 route/plan 多途经点参数名是 vian / vialons / vialats / vianames（用 | 分隔）
  const viaLons=ways.map(w=>w.lng).join('|');
  const viaLats=ways.map(w=>w.lat).join('|');
  const viaNames=ways.map(w=>encodeURIComponent(w.name)).join('|');
  let deep=`amapuri://route/plan/?sourceApplication=${encodeURIComponent('古建地图')}&slat=${sLat}&slon=${sLng}&sname=${encodeURIComponent(sName)}&dlat=${dest.lat}&dlon=${dest.lng}&dname=${encodeURIComponent(dest.name)}&dev=0&t=0`;
  if(ways.length) deep+=`&vian=${ways.length}&vialons=${viaLons}&vialats=${viaLats}&vianames=${viaNames}`;
  // 网页/桌面兜底（含 waypoints）
  let web=`https://uri.amap.com/navigation?from=${sLng},${sLat},${encodeURIComponent(sName)}&to=${dest.lng},${dest.lat},${encodeURIComponent(dest.name)}&mode=car&policy=1&src=古建地图&coordinate=gaode&callnative=1`;
  if(ways.length) web+='&waypoints='+ways.map(w=>`${w.lng},${w.lat},${encodeURIComponent(w.name)}`).join(';');
  document.getElementById('tripBar').classList.remove('open');
  if(/GuJianApp/.test(navigator.userAgent)){ window.location.href=deep; return; }
  // 非 App：先试深链，1.9s 内未离开页面（未装高德）则回退网页版
  const t0=Date.now();
  window.location.href=deep;
  setTimeout(function(){ if(Date.now()-t0<2200) window.location.href=web; }, 1900);
}

function flyToSite(i, fromSheet){
  const s=SITES[i]; if(!s)return;
  map.flyTo(pt(s),Math.max(map.getZoom(),12),{duration:.6});
  switchTab('map');
  if(fromSheet){
    document.getElementById('locSheet').classList.remove('show');
    document.querySelector('.tabbar').classList.remove('is-hidden');
    curSite=i;
    setActiveNode(i);
  } else {
    openSheet(i);
  }
}

const grid=document.getElementById('grid');
function detHtml(s){
  const g=[["history","历史"],["legend","传说"],["figure","人物"],["religion","宗教"],["culture","文化"],["geo","地理"]];
  let h="";
  g.forEach(([k,lab])=>{ if(s[k]) h+=`<div class="grp"><span class="lab">${lab}</span>${s[k]}</div>`; });
  return h;
}
function renderList(list){
  grid.innerHTML='';
  document.getElementById('listEmpty').style.display=list.length?'none':'block';
  const rp=refPoint();
  list.forEach(s=>{
    const c=colorOf(s);

    card.className='card'; card.dataset.i=s.__i;
    const km = (rp&&s._d!=null)?`<span class="km">📍 ${s._d.toFixed(0)} km</span>`:'';
    const alt = (s.elev&&+s.elev>=5000)?`<span class="tag" style="background:var(--cinnabar-500)">⚠ 极高海拔</span>`:'';

function highlightCard(i){
  document.querySelectorAll('.card.hl').forEach(c=>c.classList.remove('hl'));

    const sec=document.createElement('div'); sec.className='tl-era';
    const head=document.createElement('div'); head.className='tl-head';

    sec.appendChild(head);

      row.onclick=()=>flyToSite(s.__i);
      sec.appendChild(row);
    });
    tl.appendChild(sec);
  });
}

function resolveStop(name){
  let r=SITES.find(s=>s.name===name)||SITES.find(s=>s.label===name);
  if(!r){const b=name.replace(/（.*?）/g,"").replace(/[县市乡镇区县]$/,"").trim();
    r=SITES.find(s=>s.name.replace(/（.*?）/g,"").replace(/[县市乡镇区县]$/,"").trim()===b);}
  if(!r)r=SITES.find(s=>s.name.includes(name)||s.label.includes(name));
  return r;
}
function renderRoutes(){
  const box=document.getElementById('routes'); box.innerHTML='';
  ROUTES.forEach((rt,ri)=>{
    const total=rt.days.reduce((n,d)=>n+d.stops.length,0);
    const el=document.createElement('div'); el.className='route';
    const keyHtml=rt.days.map((d,di)=>`<span class="dayKey"><span class="dk" style="background:${DAY_COLORS[di%DAY_COLORS.length]}"></span>D${di+1} ${d.title.split(' · ')[1]||d.title}</span>`).join('');
    let daysHtml='';
    rt.days.forEach((d,di)=>{
      const c=DAY_COLORS[di%DAY_COLORS.length];
      const names=dayNames(ri,di);
      const stopsHtml=names.map((nm,i)=>{const s=resolveStop(nm);
        return s?`<div class="stop"><div class="num" style="background:${c}">${i+1}</div>
          <div class="si"><div class="sn">${s.label}</div><div class="sd">${s.theme} · ${s.region}${s.county} · ${s.elev?('海拔'+s.elev+'m'):''}</div></div></div>`
          :`<div class="stop"><div class="num" style="background:${c}">${i+1}</div><div class="si"><div class="sn">${nm}</div><div class="sd">（未收录）</div></div></div>`;
      }).join('');
      const connHtml=dayConnectHtml(ri,di,c);
      daysHtml+=`<div class="day">${connHtml}<div class="dayh" style="border-left:5px solid ${c}">
        <span class="dnt" style="background:${c}">D${di+1}</span><b>${d.title}</b></div>
        <div class="daytip">💡 ${d.tip}</div>${stopsHtml}
        <div class="dayacts"><button class="dbtn" data-sort="${ri}:${di}">↻ 按距离排序</button>
        <button class="dbtn send" data-send="${ri}:${di}">🚗 发高德导航</button></div></div>`;
    });
    el.innerHTML=`<div class="rh" style="background:linear-gradient(135deg,${rt.color},${rt.color}99)">
        <h3>${rt.name}</h3><p>⏱ ${rt.days.length} 天 ｜ ${total} 站 ｜ ${rt.desc}</p>
        <div class="dkey">🎨 每日轨迹色：${keyHtml}</div></div>
      <div class="stops">${daysHtml}</div>
      <div class="acts"><button class="btn" data-show="${ri}">🗺️ 在地图查看（按天配色）</button>
      <button class="btn alt" data-route="${ri}">📋 生成路线清单</button></div>`;
    box.appendChild(el);
  });
  box.querySelectorAll('[data-show]').forEach(b=>b.onclick=()=>showRouteOnMap(+b.dataset.show));
  box.querySelectorAll('[data-route]').forEach(b=>b.onclick=()=>buildRouteList(+b.dataset.route));
  box.querySelectorAll('[data-sort]').forEach(b=>b.onclick=()=>{const p=b.dataset.sort.split(':').map(Number);sortRouteDay(p[0],p[1]);});
  box.querySelectorAll('[data-send]').forEach(b=>b.onclick=()=>{const p=b.dataset.send.split(':').map(Number);sendRouteDayAmap(p[0],p[1]);});
}
/* 路线每日：排序 + 发高德 */
let routeOrders={};
function dayNames(ri,di){const k=ri+':'+di;return routeOrders[k]||ROUTES[ri].days[di].stops;}
function havKm(aLat,aLng,bLat,bLng){const R=6371,r=Math.PI/180;const dLa=(bLat-aLat)*r,dLo=(bLng-aLng)*r;const s=Math.sin(dLa/2)**2+Math.cos(aLat*r)*Math.cos(bLat*r)*Math.sin(dLo/2)**2;return 2*R*Math.asin(Math.min(1,Math.sqrt(s)));}
function fmtDur(min){min=Math.max(1,Math.round(min));return min<60?min+'分钟':(Math.floor(min/60)+'小时'+(min%60?(min%60+'分'):''));}
function legEst(aLat,aLng,bLat,bLng){const km=havKm(aLat,aLng,bLat,bLng)*1.35;return{km:km,min:km/48*60};}
function firstStop(ri,di){const ns=dayNames(ri,di);for(const nm of ns){const s=resolveStop(nm);if(s)return s;}return null;}
function lastStop(ri,di){const ns=dayNames(ri,di);for(let i=ns.length-1;i>=0;i--){const s=resolveStop(ns[i]);if(s)return s;}return null;}
function dayConnectHtml(ri,di,c){
  if(di<=0)return'';
  const pl=lastStop(ri,di-1),tf=firstStop(ri,di);
  if(!pl||!tf)return'';
  const e=legEst(pl.lat,pl.lng,tf.lat,tf.lng);
  return `<div class="dayconn" style="border-left:4px solid ${c}">🔗 承接 D${di} 终点：<b>${pl.label}</b> → <b>${tf.label}</b>　约 ${e.km.toFixed(0)} km · 建议预留 ${fmtDur(e.min)}（已含在下方导航起点）</div>`;
}
function sortRouteDay(ri,di){
  const names=dayNames(ri,di);
  const sites=names.map(resolveStop);
  const idx=sites.map((s,i)=>s?i:-1).filter(i=>i>=0);
  if(idx.length<2)return;
  const _pl=di>0?lastStop(ri,di-1):null;
  let cur=_pl?[_pl.lat,_pl.lng]:(userLatLng?userLatLng:[sites[idx[0]].lat,sites[idx[0]].lng]);
  const rest=idx.slice(),out=[];
  while(rest.length){
    let bi=0,bd=1e12;
    rest.forEach((i,k)=>{const s=sites[i];const d=(s.lat-cur[0])**2+(s.lng-cur[1])**2;if(d<bd){bd=d;bi=k;}});
    const pick=rest.splice(bi,1)[0];out.push(pick);cur=[sites[pick].lat,sites[pick].lng];
  }
  routeOrders[ri+':'+di]=out.map(i=>names[i]);
  renderRoutes();
}
function sendRouteDayAmap(ri,di){
  const names=dayNames(ri,di);
  const sites=names.map(resolveStop).filter(Boolean);
  if(sites.length===0)return;
  let pts=sites.map(s=>{const g=gcj02Of(s.lat,s.lng);return {lng:g[1],lat:g[0],name:s.name||s.label};});
  let sLng,sLat,sName;
  const _pl=di>0?lastStop(ri,di-1):null;
  if(_pl){const g=gcj02Of(_pl.lat,_pl.lng);sLng=g[1];sLat=g[0];sName='昨日终点·'+_pl.label;}
  else if(userLatLng){const g=gcj02Of(userLatLng[0],userLatLng[1]);sLng=g[1];sLat=g[0];sName='我的位置';}
  else{const f=pts.shift();sLng=f.lng;sLat=f.lat;sName=f.name;}
  if(pts.length===0){window.location.href=`https://uri.amap.com/marker?position=${sLng},${sLat}&name=${encodeURIComponent(sName)}&src=古建地图&coordinate=gaode&callnative=1`;return;}
  const dest=pts[pts.length-1],ways=pts.slice(0,-1);
  const viaLons=ways.map(w=>w.lng).join('|'),viaLats=ways.map(w=>w.lat).join('|'),viaNames=ways.map(w=>encodeURIComponent(w.name)).join('|');
  let deep=`amapuri://route/plan/?sourceApplication=${encodeURIComponent('古建地图')}&slat=${sLat}&slon=${sLng}&sname=${encodeURIComponent(sName)}&dlat=${dest.lat}&dlon=${dest.lng}&dname=${encodeURIComponent(dest.name)}&dev=0&t=0`;
  if(ways.length)deep+=`&vian=${ways.length}&vialons=${viaLons}&vialats=${viaLats}&vianames=${viaNames}`;
  let web=`https://uri.amap.com/navigation?from=${sLng},${sLat},${encodeURIComponent(sName)}&to=${dest.lng},${dest.lat},${encodeURIComponent(dest.name)}&mode=car&policy=1&src=古建地图&coordinate=gaode&callnative=1`;
  if(ways.length)web+='&waypoints='+ways.map(w=>`${w.lng},${w.lat},${encodeURIComponent(w.name)}`).join(';');
  if(/GuJianApp/.test(navigator.userAgent)){window.location.href=deep;return;}
  const t0=Date.now();window.location.href=deep;
  setTimeout(function(){if(Date.now()-t0<2200)window.location.href=web;},1900);
}
function showRouteOnMap(ri){
  lastRouteRi=ri;
  const rt=ROUTES[ri];
  if(routeLayer)map.removeLayer(routeLayer);
  routeLayer=L.layerGroup().addTo(map);
  const all=[];
  rt.days.forEach((d,di)=>{
    const pts=d.stops.map(resolveStop).filter(Boolean).map(s=>pt(s));
    if(pts.length<1)return;
    all.push(...pts);
    const c=DAY_COLORS[di%DAY_COLORS.length];
    const line=L.polyline(pts,{color:c,weight:4,opacity:.9,dashArray:"1,9",lineCap:"round"}).addTo(routeLayer);
    line.bindPopup(`<b style="color:${c}">${d.title}</b>`);
  });
  if(all.length)map.fitBounds(all,{padding:[40,40]});
  switchTab('map');
  // 紧凑清除胶囊：只显示路线名 + ✕
  const banner=document.getElementById('routeBanner');
  banner.style.display='block'; banner.textContent=`🗺️ ${rt.name}  ✕`;
  banner.title='点击清除路线';
  banner.onclick=clearRoute;
  // 每日轨迹色：默认收起为小按钮，点开才显示图例（不遮挡地图）
  const dl=document.getElementById('dayLegend');
  dl.innerHTML=`<b>每日轨迹色</b><br>`+rt.days.map((d,di)=>`<span class="dl"><span class="dd" style="background:${DAY_COLORS[di%DAY_COLORS.length]}"></span>D${di+1} ${d.title.split(' · ')[1]||d.title}</span>`).join('');
  dl.style.display='none';
  const dlBtn=document.getElementById('dayLegendBtn');
  dlBtn.textContent='🎨 每日色';
  dlBtn.style.display='block';
  dlBtn.onclick=()=>{
    const open=dl.style.display==='block';
    dl.style.display=open?'none':'block';
    dlBtn.textContent=open?'🎨 每日色':'🎨 收起每日色';
  };
}
function clearRoute(){
  lastRouteRi=null;
  if(routeLayer)map.removeLayer(routeLayer); routeLayer=null;
  document.getElementById('routeBanner').style.display='none';
  document.getElementById('dayLegend').style.display='none';
  document.getElementById('dayLegendBtn').style.display='none';
}
function buildRouteList(ri){
  const rt=ROUTES[ri];
  const resolved=rt.days.flatMap(d=>d.stops).map(resolveStop).filter(Boolean);
  state.q=""; document.getElementById('search').value="";
  const set=new Set(resolved.map(s=>s.__i));
  const list=SITES.filter(s=>set.has(s.__i));
  renderList(list); switchTab('list');
  document.getElementById('listCnt').textContent=`路线清单 · ${list.length} 站（来自路线页）`;
}

function userDotIcon(){return L.divIcon({className:'',html:'<div class="uwrap"><span class="upulse"></span><span class="udot"></span></div>',iconSize:[46,46],iconAnchor:[23,23]});}
let locateTried=false;
function locateSuccess(pos){
  userLatLng=[pos.coords.latitude,pos.coords.longitude];
  if(userMarker)map.removeLayer(userMarker);
  userMarker=L.marker(gxy(userLatLng[0],userLatLng[1]),{icon:userDotIcon(),zIndexOffset:1000}).addTo(map);
  userMarker.bindPopup('<b>📍 我的位置</b>').openPopup();
  if(!watchId && navigator.geolocation)watchId=navigator.geolocation.watchPosition(p=>{
    userLatLng=[p.coords.latitude,p.coords.longitude];
    if(userMarker)userMarker.setLatLng(gxy(userLatLng[0],userLatLng[1]));
  },()=>{},{enableHighAccuracy:true,maximumAge:10000});
}

function locate(manual){
  if(!navigator.geolocation){ if(manual)enterPickMode(); return; }
  if(manual)document.getElementById('locBtn').textContent='⏳';document.getElementById('locBtn').className='fab loading';
  navigator.geolocation.getCurrentPosition(p=>{
    locateSuccess(p);
    document.getElementById('locBtn').className='fab ok';setTimeout(function(){document.getElementById('locBtn').className='fab'},1500);document.getElementById('locBtn').textContent='📍';
    if(manual){ if(document.getElementById('map').classList.contains('active'))map.setView(gxy(userLatLng[0],userLatLng[1]),Math.max(map.getZoom(),11));
      else switchTab('map'); }
  },e=>{
    document.getElementById('locBtn').textContent='📍';
    if(manual)enterPickMode();
  },{enableHighAccuracy:true,timeout:10000});
}
function autoLocate(){
  if(locateTried)return; locateTried=true;
  if(!navigator.geolocation)return;
  navigator.geolocation.getCurrentPosition(locateSuccess,()=>{},{enableHighAccuracy:true,timeout:8000});
}

/* ---------- 渲染调度 ---------- */
function renderAll(){
  const list=getFiltered();
  renderMarkers(list);
  renderList(list);
  renderThemes(list);
  document.getElementById('totalTag').textContent=`· 共 ${SITES.length} 处（青/藏/新）`;
}
function attachIndex(){ SITES.forEach((s,i)=>s.__i=i); }

/* ---------- 交互绑定 ---------- */
function switchTab(tab){
  document.querySelectorAll('.view').forEach(v=>v.classList.remove('active'));
  document.getElementById(tab).classList.add('active');
  document.querySelectorAll('.tabbar button').forEach(b=>b.classList.toggle('on',b.dataset.tab===tab));
  if(tab==='map'){setTimeout(()=>map.invalidateSize(),60); autoLocate();}
}
document.querySelectorAll('.tabbar button').forEach(b=>b.onclick=()=>switchTab(b.dataset.tab));
document.getElementById('locBtn').onclick=()=>{
  if(userLatLng){ map.setView(gxy(userLatLng[0],userLatLng[1]),Math.max(map.getZoom(),12)); if(userMarker)userMarker.openPopup(); }
  else locate(true);
};
const searchEl=document.getElementById('search');
searchEl.oninput=e=>{state.q=e.target.value;renderAll();};
// URL ?q= 直达搜索（首页搜索栏跳转进入）
(function(){var m=location.search.match(/[?&]q=([^&]+)/);if(m){var q=decodeURIComponent(m[1]);var s=document.getElementById('search');if(s){s.value=q;state.q=q;renderAll();}}})();
document.getElementById('sortSel').onchange=e=>{state.sort=e.target.value;renderAll();};

// 筛选 chips：省份 + 类型 + 海拔（单选）+ 全部重置
const dynChips=document.getElementById('dynChips');
function mkChip(label,on,dot){
  const c=document.createElement('button'); c.className='chip'; c.dataset.f=label;
  if(dot)c.style.borderColor=dot;
  c.innerHTML=(dot?'<span style="display:inline-block;width:6px;height:6px;border-radius:50%;background:'+dot+';margin-right:5px"></span>':'')+label;
  if(on)c.classList.add('on');
  return c;
}
function syncChips(){
  dynChips.querySelectorAll('.chip').forEach(c=>{
    const f=c.dataset.f;
    if(f==='全部'){c.classList.toggle('on',!state.region&&!state.theme&&!state.elev);return;}
    if(f===state.region||f===state.theme||f===state.elev)c.classList.add('on');
    else c.classList.remove('on');
  });
  legBody.querySelectorAll('.lg').forEach(r=>{r.classList.toggle('on',r.dataset.th===state.theme);});
}
(function(){
  const c=mkChip('全部',true); c.className='chip all on';
  c.onclick=()=>{state.region='';state.theme='';state.elev='';syncChips();renderAll();};
  dynChips.appendChild(c);
})();
// 省份（单选）
[...new Set(SITES.map(s=>s.region))].sort().forEach(r=>{
  const c=mkChip(r,false); c.dataset.v=r;
  c.onclick=()=>{state.region=(state.region===r?'':r);syncChips();renderAll();};
  dynChips.appendChild(c);
});
// 类型（单选）
[...new Set(SITES.map(s=>s.theme))].sort((a,b)=>THEME_ORDER.indexOf(a)-THEME_ORDER.indexOf(b)).forEach(th=>{
  const c=mkChip((THEME_ICON[th]||'')+' '+th,false,THEME[th]); c.dataset.v=th;
  c.onclick=()=>{state.theme=(state.theme===th?'':th);syncChips();renderAll();};
  dynChips.appendChild(c);
});
// 海拔（单选）
[{v:'low',t:'低海拔 <3000m'},{v:'mid',t:'3000–4000m'},{v:'high',t:'4000–5000m'},{v:'xhigh',t:'>5000m'}].forEach(e=>{
  const c=mkChip(e.t,false); c.dataset.v=e.v;
  c.onclick=()=>{state.elev=(state.elev===e.v?'':e.v);syncChips();renderAll();};
  dynChips.appendChild(c);
});
// 图例
const legBody=document.getElementById('legBody');
THEME_ORDER.forEach(th=>{if(!SITES.some(s=>s.theme===th))return;const r=document.createElement('div');r.className='lg';r.dataset.th=th;r.style.cursor='pointer';
  r.innerHTML=`<span class="dot" style="background:${THEME[th]}"></span>${THEME_ICON[th]||''} ${th}`;
  r.onclick=()=>{state.theme=(state.theme===th?'':th);syncChips();renderAll();};
  legBody.appendChild(r);});
const legEl=document.getElementById('legend'),legOpen=document.getElementById('legOpen');
function legSet(h){legEl.classList.toggle('hidden',h);legOpen.classList.toggle('show',h);}
document.getElementById('legTg').onclick=()=>legSet(true);
legOpen.onclick=()=>legSet(false);

/* ---------- 启动 ---------- */
attachIndex();
TravelNotes.init({ map: map, getSite: (i)=>SITES[i] });
renderRoutes();
renderAll();
autoLocate();
setTimeout(()=>map.invalidateSize(),200);
</script>
</body>
</html>
